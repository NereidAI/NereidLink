          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/ops/orders/{orderId}/approve:
    post:
      tags: [ops]
      summary: Confirm an order and execute its action (super administrator)
      description: Business API only; requires the platform-admin flag.
      operationId: approveOpsOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsReviewRequest'
      responses:
        "200":
          description: Confirmed; EXECUTED once the action has run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsOrder'
        "409":
          description: Order expired or no longer pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/ops/orders/{orderId}/reject:
    post:
      tags: [ops]
      summary: Refuse an order (super administrator)
      description: Business API only; requires the platform-admin flag.
      operationId: rejectOpsOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsReviewRequest'
      responses:
        "200":
          description: Order rejected.
          content:
            application/json:
              schema:
