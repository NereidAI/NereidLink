    post:
      tags: [members]
      summary: Enable or disable a member account
      description: |
        A disabled account is rejected at login; existing access tokens
        stop working on the next request.
      operationId: setMemberEnabled
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberEnabledRequest'
      responses:
        "200":
          description: Updated member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMember'
        "404":
          description: Member not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
