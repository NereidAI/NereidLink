      operationId: listOpsOrders
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED, EXECUTED, EXPIRED, CANCELLED]
        - name: tenant_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Orders matching the filter, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpsOrder'
    post:
      tags: [ops]
      summary: Open a cleanup operation order (operators)
      description: |
        Ops admin listener only (loopback, no application login). The
        operator CLI opens a PENDING order; nothing is deleted until the
        single super administrator reviews the full order on the web and
        confirms it. Confirmation runs the action immediately.
      operationId: createOpsOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOpsOrderRequest'
      responses:
        "201":
          description: Order opened and awaiting super administrator confirmation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsOrder'
        "400":
          description: Unknown action or invalid payload/operator/ttl.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/ops/orders/{orderId}:
    get:
      tags: [ops]
      summary: Get one operation order
      description: Available on both listeners.
      operationId: getOpsOrder
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Full order document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpsOrder'
        "404":
