          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/tenants/{tenantId}/members/{userId}:
    delete:
      tags: [members]
      summary: Remove a member (and its account when tenant-less)
      description: |
        Deletes this tenant's membership in one transaction; its role rows
        cascade. The app_user account is deleted only when it has no
        membership left in any tenant, so a suite SSO user removed from one
        tenant keeps their account and access elsewhere. An operator cannot
        remove the account they are currently authenticated as.
      operationId: removeMember
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Member removed.
        "400":
          description: Attempt to remove the caller's own account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: Member not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: Platform administrator account is protected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/tenants/{tenantId}/modules:
    get:
      tags: [modules]
      summary: List southbound modules
      operationId: listModules
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        "200":
          description: All provisioned modules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SouthboundModule'
    post:
      tags: [modules]
      summary: Provision a southbound module
      description: |
        Creates a module row and returns a generated enrollment token.
        Modules are platform-level; the tenant path segment only fixes the
        management boundary.
      operationId: createModule
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSouthboundModule'
      responses:
        "201":
          description: Module provisioned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SouthboundModule'
        "400":
          description: Invalid parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: Name or ingress ID already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/tenants/{tenantId}/modules/{moduleId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: moduleId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [modules]
      summary: Get one module
      operationId: getModule
      responses:
        "200":
          description: Module detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SouthboundModule'
        "404":
          description: Module not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [modules]
      summary: Update a module
      description: Changes name, enabled flag or protocol configuration.
      operationId: updateModule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSouthboundModule'
      responses:
        "200":
          description: Updated module.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SouthboundModule'
        "404":
          description: Module not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [modules]
      summary: Delete a module
      operationId: deleteModule
      responses:
        "204":
          description: Module removed.
        "404":
          description: Module not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/modules/register:
    post:
      tags: [modules]
      summary: Adapter enrollment
      description: |
        Called by an adapter container at startup. The provisioned module
        type and ingress ID must match the enrollment token. On success the
        module flips to ONLINE.
      operationId: registerModule
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterModule'
      responses:
        "200":
          description: Module enrolled and ONLINE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SouthboundModule'
        "400":
          description: Type or ingress mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          description: Invalid enrollment token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/modules/{moduleId}/heartbeat:
    post:
      tags: [modules]
      summary: Adapter heartbeat
      description: Renews the module lease while the adapter is running.
      operationId: heartbeatModule
      security: []
      parameters:
        - name: moduleId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollment_token]
              properties:
                enrollment_token: { type: string }
      responses:
        "200":
          description: Lease renewed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SouthboundModule'
        "401":
          description: Invalid module ID or token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    TenantPath:
      name: tenant
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Error:
      description: Standard error response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Human or machine access token (Authorization: Bearer &lt;jwt&gt;)."
    APIKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
      description: >-
        Long-lived user API key. It authenticates the same human principal as
        the owner's interactive token. Empty scopes inherit live roles;
        explicit scopes narrow the principal. Unknown and revoked keys return
        the same generic 401; ten failed attempts for one prefix lock it for
        15 minutes.
    ClientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /v1/auth/token
          scopes: {}
      description: Service-account client_id/client_secret grant (ADR-0021).
    DeviceToken:
      type: http
      scheme: bearer
      description: >-
        Device credential presented as `Authorization: Bearer <token>`
        for passwordless access tokens, or
        `Authorization: Basic base64(credentials_id:credentials_value)`
        when the credential carries a secret (mirrors MQTT
        username/password).
    DeviceBasic:
      type: http
      scheme: basic
      description: "Alternative presentation for secret-bearing credentials (`credentials_id:credentials_value`)."
  requestBodies:
    ImportFile:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
                description: CSV (devices/profiles) or XLSX (devices) import file.
  schemas:
    BusinessTemplate:
      type: object
      description: >-
        Versioned business orchestration template. The binary ships no
        business vocabulary; templates only exist after a pack import or a
        designer publish.
      required: [schema_version, id, version, name, description, requires, parameters, assembly]
      properties:
        schema_version:
          type: string
        id:
          type: string
        version:
          type: string
        name:
          type: string
        description:
          type: string
        requires:
          type: object
          description: Requirement kinds mapped to symbolic refs resolved by instance assemblies.
          additionalProperties:
            type: string
        parameters:
          type: object
          description: JSON Schema describing the template parameter object.
          additionalProperties: true
        assembly:
          $ref: "#/components/schemas/BusinessAssembly"
        created_at:
          type: string
          format: date-time
          readOnly: true

    BusinessTemplatePack:
      type: object
      description: >-
        Multi-template import/export envelope. Import also accepts a bare
        BusinessTemplate document as a one-element pack.
      required: [templates]
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/BusinessTemplate"

    BusinessAssembly:
      type: object
      description: Business orchestration graph.
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/BusinessNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/BusinessEdge"

    BusinessNode:
      type: object
      required: [id, kind, name, ref, asset, position]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [camera, pipeline, model, companion, rule, action, northbound, external_servable]
        name:
          type: string
        ref:
          type: string
        asset:
          type: object
          description: >-
            Kind-specific asset configuration. Camera, model, companion,
            action, and northbound nodes follow their corresponding
            Business*Asset schemas below. Pipeline and external-servable
            definitions remain opaque integration-owned objects.
          additionalProperties: true
        position:
          $ref: "#/components/schemas/BusinessNodePosition"

    BusinessCameraAsset:
      type: object
      required: [gateway_id, device_id]
      properties:
        gateway_id:
          type: string
          format: uuid
          description: Existing active gateway selected for this camera binding.
        device_id:
          type: string
          format: uuid
          description: Existing camera managed by gateway_id; changing the gateway invalidates it.
        output_device_id:
          type: string
          format: uuid
          description: Optional existing output device managed by the same gateway.
        source_kind:
          type: string
          enum: [onvif-camera, rtsp, jpeg, none]
        source_device: { type: string }
        source_url: { type: string }
        secret_name: { type: string }
        stream_profile: { type: string }
        fps: { type: number, minimum: 0 }
        decode_accel:
          type: string
          enum: [software, vaapi]
        vaapi_device: { type: string }
        target_device:
          type: string
          description: Operational inference target; presets are suggestions and custom OpenVINO targets remain valid.
        publish_mode:
          type: string
          enum: [all, nonempty, none]
        publish_readings:
          type: array
          items: { type: string }
      additionalProperties: true

    BusinessModelAsset:
      type: object
      required: [model_id, version]
      properties:
        model_id:
          type: string
          minLength: 1
          description: Model identity selected from target-gateway inventory.
        version:
          type: string
          minLength: 1
          description: >-
            Model version dependent on model_id. The console offers only READY,
            non-stale id/version identities present on every derived target
            gateway; changing model_id or target context invalidates version.
        precision:
          type: string
          enum: [fp16, int8]
        object_type: { type: string }
        object_id: { type: string }
      additionalProperties: true

    BusinessCompanionAsset:
      type: object
      required: [companion_id, conclusion_device_id]
      properties:
        companion_id:
          type: string
          minLength: 1
          description: >-
            Logical companion with an enabled registered endpoint on every
            target gateway derived from the connected camera/pipeline graph.
        conclusion_device_id:
          type: string
          format: uuid
          description: Existing active device that owns companion conclusions.
      additionalProperties: true

    BusinessActionAsset:
      type: object
      required: [action_type]
      description: >-
        Closed command/alarm action. send-command and create-alarm are the
        canonical console values; command and alarm remain accepted legacy
        aliases. Only the fields for the selected action kind are required.
      properties:
        action_type:
          type: string
          enum: [send-command, create-alarm, command, alarm]
        target_device_id:
          type: string
          format: uuid
          description: Existing active device targeted by a command action.
        resource:
          type: string
          minLength: 1
          description: Enabled command declared in the target device's command catalog.
        command_name:
          type: string
          description: Legacy command override; a newly selected resource takes precedence in the console.
        alarm_type: { type: string, minLength: 1 }
        severity:
          type: string
          enum: [CRITICAL, MAJOR, MINOR, WARNING]
        params:
          type: object
          additionalProperties: true
        timeout_ms: { type: integer, minimum: 0 }
      oneOf:
        - properties:
            action_type: { enum: [send-command, command] }
          required: [target_device_id, resource]
        - properties:
            action_type: { enum: [create-alarm, alarm] }
          required: [alarm_type, severity]
      additionalProperties: true

    BusinessNorthboundAsset:
      type: object
      description: >-
        Northbound assembly asset. EdgeX selectors are exact raw names reported
        by the target gateway and are never derived from NereidLink device UUIDs
        or canonical names.
      required: [channel, forwarder_id, readings, edgex_device_name, edgex_profile_name, edgex_resource_names]
      properties:
        channel:
          type: string
          minLength: 1
          description: Neutral business envelope metadata; the forwarder still selects the sink.
        forwarder_id:
          type: string
          minLength: 1
          description: Existing enabled NereidLink forwarder used to publish the channel.
        readings:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: Explicit conclusion reading paths; wildcards and embedding paths are rejected.
        edgex_device_name:
          type: string
          minLength: 1
          description: Exact raw EdgeX device name for the conclusion source.
        edgex_profile_name:
          type: string
          minLength: 1
          description: Exact raw EdgeX device profile name for the conclusion source.
        edgex_resource_names:
          type: array
          minItems: 1
          items:
            type: string
            minLength: 1
          description: >-
            Explicit raw EdgeX resource names. path.Match patterns, PipelineJSON,
            and the case-sensitive Embedding prefix are rejected.
      additionalProperties: true

    BusinessNodePosition:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
        y:
          type: number

    BusinessEdge:
      type: object
      required: [id, source, target, relation]
      properties:
        id:
          type: string
        source:
          type: string
        target:
          type: string
        relation:
          type: string
          enum: [frames, uses, serves, facts, conclusions, triggers, publishes]

    BusinessInstanceCreate:
      type: object
      required: [name, template_id, template_version, parameters, assembly]
      properties:
        name:
          type: string
        template_id:
          type: string
        template_version:
          type: string
        parameters:
          type: object
          description: Parameter values validated against the template JSON Schema.
          additionalProperties: true
        assembly:
          $ref: "#/components/schemas/BusinessAssembly"

    BusinessInstanceUpdate:
      type: object
      required: [name, parameters, assembly, expected_generation]
      properties:
        name:
          type: string
        parameters:
          type: object
          additionalProperties: true
        assembly:
          $ref: "#/components/schemas/BusinessAssembly"
        expected_generation:
          type: integer
          format: int64
          description: Generation the caller expects to replace.

    BusinessInstance:
      description: Business instance document and its orchestration state.
      allOf:
        - $ref: "#/components/schemas/BusinessInstanceCreate"
        - type: object
          required: [id, status, generation, active_generation, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
            status:
              type: string
              enum: [DRAFT, VALIDATING, DEPLOYING, RUNNING, DEGRADED, FAILED, UNDEPLOYED]
            generation:
              type: integer
              format: int64
            active_generation:
              type: integer
              format: int64
            pending_generation:
              type: integer
              format: int64
            validation:
              $ref: "#/components/schemas/BusinessValidationReport"
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
            last_error:
              type: string
            deployed_at:
              type: string
              format: date-time

    BusinessValidationReport:
      type: object
      required: [valid, issues]
      properties:
        valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: "#/components/schemas/BusinessValidationIssue"

    BusinessValidationIssue:
      type: object
      required: [code, message, blocking]
      properties:
        code:
          type: string
        message:
          type: string
        node_id:
          type: string
        artifact_key:
          type: string
        blocking:
          type: boolean

    BusinessExpansion:
      type: object
      description: Deterministic expansion of one business instance generation.
      required: [schema_version, instance_id, generation, template, digest, artifacts]
      properties:
        schema_version:
          type: string
        instance_id:
          type: string
          format: uuid
        generation:
          type: integer
          format: int64
        template:
          $ref: "#/components/schemas/BusinessExpansionTemplate"
        digest:
          type: string
          pattern: "^[a-f0-9]{64}$"
          description: Lowercase hexadecimal SHA-256 digest of the expansion.
        artifacts:
          type: array
          items:
            $ref: "#/components/schemas/BusinessArtifact"

    BusinessExpansionTemplate:
      type: object
      required: [id, version]
      properties:
        id:
          type: string
        version:
          type: string

    BusinessArtifact:
      type: object
      required: [key, kind, depends_on, spec]
      properties:
        key:
          type: string
        kind:
          type: string
          enum: [model_distribution, pipeline_registration, external_servable, inference_binding, companion_subscription, rule_chain, northbound_channel, northbound_filter]
        gateway_id:
          type: string
          format: uuid
        device_id:
          type: string
          description: Empty for gateway-level artifacts such as manager resources and northbound filters; otherwise a device UUID.
        depends_on:
          type: array
          items:
            type: string
        spec:
          type: object
          description: >-
            Artifact-kind-specific deployment specification. Pipeline and
            reference-only external-servable artifacts carry the complete
            connector envelope (connector_type=edge-manager-resource,
            type_version=1, empty device_id, nested config). Manager config
            identifies PipelinesJSON by pipeline_id or ExternalServablesJSON
            by entry_id+id_field=servableId; managed external definitions are
            rejected until NI supplies a runtime-only symmetric resource.
            northbound_channel carries channel, forwarder_id, explicit reading
            paths, and raw EdgeX device/profile/resource selectors.
            northbound_filter carries one gateway-level complete
            edge-northbound-filter v1 connector envelope with empty device_id
            and BusinessNorthboundFilterConfig in nested config.
          additionalProperties: true

    BusinessNorthboundFilterConfig:
      type: object
      required: [enabled, default_action, rules]
      properties:
        enabled:
          type: boolean
          description: False only for the quiescent singleton retained after the last contributor leaves.
        default_action:
          type: string
          enum: [allow]
          description: The filter defaults to allow; explicit allow/deny rules narrow the conclusion resources.
        rules:
          type: array
          items:
            type: object
            required: [action, device_names, profile_names]
            properties:
              action:
                type: string
                enum: [allow, deny]
              device_names:
                type: array
                items:
                  type: string
              profile_names:
                type: array
                items:
                  type: string
              resource_names:
                type: array
                items:
                  type: string
                description: Present on the explicit allow rule; omitted by the following same device/profile deny rule.
            additionalProperties: true
          description: Ordered first-match-wins rules using raw EdgeX names.

    BusinessRollbackRequest:
      type: object
      required: [generation]
      properties:
        generation:
          type: integer
          format: int64

    BusinessMonitor:
      type: object
      required: [instance_id, generation, active_generation, status, cameras, issues]
      properties:
        instance_id:
          type: string
          format: uuid
        generation:
          type: integer
          format: int64
        active_generation:
          type: integer
          format: int64
        status:
          type: string
          enum: [DRAFT, VALIDATING, DEPLOYING, RUNNING, DEGRADED, FAILED, UNDEPLOYED]
        cameras:
          type: array
          items:
            $ref: "#/components/schemas/BusinessCameraMonitor"
        issues:
          type: array
          items:
            $ref: "#/components/schemas/BusinessValidationIssue"

    BusinessCameraMonitor:
      type: object
      required: [node_id, device_id, gateway_id, state, health_source]
      properties:
        node_id:
          type: string
        device_id:
          type: string
          format: uuid
        gateway_id:
          type: string
          format: uuid
        state:
          type: string
        last_error:
          type: string
        success_total:
          type: integer
          minimum: 0
          description: Optional reported successful-job count; absence is unavailable and zero is a real reading.
        error_total:
          type: integer
          minimum: 0
          description: Optional reported job-error count; absence is unavailable and zero is a real reading.
        p50_ms:
          type: number
          description: Optional reported p50 job latency in milliseconds; independently available.
        p95_ms:
          type: number
          description: Optional reported p95 job latency in milliseconds; independently available.
        events_per_second:
          type: number
          description: Optional event rate; currently unavailable because the connector wire contract has no authoritative source.
        health_source:
          type: string
          description: Health evidence source; connector+job_metrics indicates at least one optional stats field was reported.

    AccountingTopNEntry:
      type: object
      description: One ranked accounting dimension value.
      properties:
        value:
          type: string
          description: >-
            The accounted value. Subject patterns are normalized, so
            per-device segments appear as {id}.
        message_count:
          type: integer
          format: int64
          description: Estimated message count over the window.
        byte_count:
          type: integer
          format: int64
          description: Estimated byte volume over the window.
        nodes:
          type: integer
          description: How many distinct nodes reported this value.
        sample_rate:
          type: integer
          format: int64
          description: >-
            Largest 1/N divisor among the contributing reports. A sum that
            includes any sampled report is an extrapolation.
        estimated:
          type: boolean
          description: True when the counts were sampled rather than measured.
    AccountingTopNResponse:
      type: object
      properties:
        dimension:
          type: string
          enum: [tenant, device, ip, protocol, node, topic]
        window:
          type: string
        limit:
          type: integer
        entries:
          type: array
          description: Ranking ordered by descending message count; [] when nothing matched.
          items:
            $ref: "#/components/schemas/AccountingTopNEntry"

    DashboardWidget:
      type: object
      description: One grid item with geometry and binding config.
      properties:
        id: { type: string }
        type:
          type: string
          enum: [timeseries, stat, alarms]
        title: { type: string }
        device_id: { type: string, format: uuid }
        measurement_key: { type: string }
        range: { type: string, enum: ["1h", "6h", "24h", "7d"] }
        x: { type: integer }
        y: { type: integer }
        w: { type: integer }
        h: { type: integer }
    Dashboard:
      type: object
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        sort_order: { type: integer }
        layout:
          type: array
          items: { $ref: "#/components/schemas/DashboardWidget" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EscalationStep:
      type: object
      description: One ordered step of an escalation chain.
      properties:
        step_id: { type: string, format: uuid }
        order: { type: integer }
        delay_seconds:
          type: integer
          format: int64
          minimum: 0
        target_role:
          type: string
          enum: [TENANT_ADMIN, ENGINEER, CUSTOMER_USER, READ_ONLY]
        target_group_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Optional device group refining this step to role holders whose
            RBAC data scope covers the group subtree. Omit or null for the
            whole tenant.
        stop_on_ack: { type: boolean }
        stop_on_clear: { type: boolean }
    EscalationStepWrite:
      type: object
      required: [delay_seconds, target_role]
      properties:
        delay_seconds: { type: integer, format: int64, minimum: 0 }
        target_role:
          type: string
          enum: [TENANT_ADMIN, ENGINEER, CUSTOMER_USER, READ_ONLY]
        target_group_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Optional device group refining this step to role holders whose
            RBAC data scope covers the group subtree. Must belong to the
            tenant. Omit or null for the whole tenant.
        stop_on_ack: { type: boolean }
        stop_on_clear: { type: boolean }
    EscalationChain:
      type: object
      properties:
        chain_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        enabled: { type: boolean }
        repeat_interval_seconds:
          type: integer
          format: int64
          description: Reminder cadence for unacknowledged alarms; 0 disables.
        repeat_target_role:
          type: string
          description: Role notified on each reminder.
          enum: [TENANT_ADMIN, ENGINEER, CUSTOMER_USER, READ_ONLY]
        repeat_target_group_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Optional device group narrowing reminders to role holders whose
            RBAC data scope covers the group subtree.
        steps:
          type: array
          items: { $ref: "#/components/schemas/EscalationStep" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EscalationChainWrite:
      type: object
      required: [name, steps]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        repeat_interval_seconds:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: Reminder cadence in seconds for unacknowledged alarms; 0 disables.
        repeat_target_role:
          type: string
          enum: [TENANT_ADMIN, ENGINEER, CUSTOMER_USER, READ_ONLY]
          description: Required when repeat_interval_seconds > 0.
        repeat_target_group_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Optional device group narrowing reminders to role holders whose
            RBAC data scope covers the group subtree. Must belong to the
            tenant.
        steps:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/EscalationStepWrite" }
    ConnectorWrite:
      type: object
      description: >-
        Desired connector spec; config and mappings are opaque JSON. In the
        two-level model, set profile_id to a device profile carrying a
        connector template and supply only per-device overrides in
        config/mappings; connector_type/type_version then inherit from the
        template when omitted. Exactly one of connector_type or profile_id
        must resolve to a connector type.
      properties:
        connector_type:
          type: string
          description: Connector type key, opaque to the NL kernel. Inherited from profile_id when omitted.
        type_version:
          type: string
          default: ""
          description: Plugin/type version requested for the instance.
        device_id:
          type: string
          format: uuid
          description: Optional south-bound sub-device this instance targets; must be bound to the gateway. One instance per sub-device.
        profile_id:
          type: string
          format: uuid
          description: Optional device profile supplying the connector template (type/version + default config/mappings).
        config:
          type: object
          additionalProperties: true
          default: {}
          description: >-
            Per-device config overrides, deep-merged over the profile template
            (arrays replace). For EdgeX connector types, a blank
            `device_name` is filled in by the console with the bound
            sub-device's canonical name when the instance targets a device.
            For the self-registered `edge-inference` type (type_version "1")
            the console sends `source` ({device, resource:"snapshot_jpeg",
            mode?:"snapshot"|"stream", profile?}) for managed ONVIF cameras;
            `profile` is an optional
            ONVIF media ProfileToken (main/sub stream, stream mode only,
            pattern ^[A-Za-z0-9_.:,-]+$, max 64, absent = camera default),
            enumerated via the read-only camera.profiles v1 gateway
            operation. Stream mode selects the edge-federated RTSP/ffmpeg
            source while the URL and credentials stay edge-local; firmware
            without the mode declaration only sees snapshot. For non-ONVIF
            hardware the console instead sends source
            {mode:"url", transport:"rtsp"|"rtsp-udp"|"mpjpeg"|"jpeg",
            url (8-1024 chars, rtsp:// for RTSP transports or http(s)://
            for mpjpeg/jpeg, host required, embedded userinfo rejected),
            secret_name? (^[A-Za-z0-9_.:,-]+$, max 128, naming an
            edge-provisioned NI secret; passwords never enter the platform)}
            with no device/resource keys. The console
            also sends `model_ref` ({id, version, revision?}), `trigger`
            ("event"|"periodic"|"continuous"), `period_ms`/`max_idle_ms`,
            `fps` (0.1-60, continuous only),
            `error_threshold`, `conf_threshold`, optional evidence-frame
            toggles `emit_frame`/`annotate_preview` (both boolean, default
            true and omitted in that case), and `ffmpeg_extra` (stream or
            direct-URL mode, max 256, space-separated allowlisted argv
            tokens: -re or
            -r/-ss/-t/-threads/-fflags/-flags with a value; DS-authoritatively
            validated), and site-local `decode_accel` ("software"|"vaapi",
            default software and omitted) plus optional `vaapi_device`
            (^(?:/dev/dri/)?renderD\d+$, omitted for NI's renderD128 default).
            VA-API is offered only for ONVIF RTSP streams and direct
            rtsp/rtsp-udp sources, maps to NI DecodeAccel/VAAPIDevice through
            NE, and never falls back silently when its device is unavailable.
            The console also sends optional
            `target_device` (default "CPU" and omitted by the console in that
            case; GPU/GPU.N/NPU/AUTO or OVMS MULTI:/HETERO: composite forms,
            pattern ^[A-Za-z0-9_.:,-]+$, max 64). The authoritative shape and
            its validation come from the edge-advertised JSON Schema; the
            console gates stream/url modes and continuous trigger on that
            schema declaring them, so older firmware rejects them explicitly
            (400) rather than running a different acquisition. An unavailable
            stream or direct feed reports `source-no-frame`; an unavailable
            target device must fail loudly (`target-device-unavailable`),
            never silently fall back to CPU. For the business-managed
            `edge-northbound-filter` type (type_version "1", empty device_id),
            config is `{enabled:boolean, default_action:"allow",
            rules:[{action:"allow"|"deny", device_names:string[],
            profile_names:string[], resource_names?:string[]}]}`, uses exact
            raw EdgeX names, and is reconciled as one gateway-level singleton.
            A zero-contributor gateway is quiesced with enabled=false and
            rules=[] rather than hard-deleted.
        mappings:
          type: array
          default: []
          items:
            type: object
            required: [key]
            properties:
              key:
                type: string
                minLength: 1
                description: Canonical point key the edge connector maps to.
            additionalProperties: true
          description: >-
            Per-device point mappings; non-empty replaces the template list.
            Every item must be an object carrying a non-empty string `key`;
            additional properties are connector-specific.
        health_check:
          $ref: "#/components/schemas/ConnectorHealthCheck"
    ConnectorHealthCheck:
      type: object
      description: >-
        Instance-level liveness probe policy. Only meaningful on an instance
        bound to one sub-device. The owning edge gateway periodically READS
        the named south resource, DISCARDS THE VALUE (no telemetry, no shadow
        update) and autonomously asserts the bound device connect/disconnect.
        Omit or send an empty object to disable probing; the edge stops any
        running probe for the instance. Protocol-agnostic: resource names the
        same neutral resource space the connector mappings use.
      properties:
        resource:
          type: string
          maxLength: 256
          description: South read resource/command name to probe.
        interval_ms:
          type: integer
          minimum: 1
          maximum: 86400000
          default: 30000
          description: Probe cadence in milliseconds.
        timeout_ms:
          type: integer
          minimum: 1
          maximum: 60000
          default: 5000
          description: Per-probe read timeout; must be shorter than interval_ms.
        fail_threshold:
          type: integer
          minimum: 1
          maximum: 100
          default: 3
          description: Consecutive failures that flip the device offline;
            the first success reconnects it.
    ConnectorStatusStats:
      type: object
      description: >-
        Independently optional NE job measurements. Absence/null means
        unavailable; an explicit zero counter is a real reading. Every new
        status replaces the whole projection rather than merging stale fields.
      properties:
        success_total:
          type: integer
          minimum: 0
          description: Unsigned successful-job counter; zero is meaningful.
        error_total:
          type: integer
          minimum: 0
          description: Unsigned job-error counter; zero is meaningful.
        p50_ms:
          type: number
          description: Optional p50 job latency in milliseconds.
        p95_ms:
          type: number
          description: Optional p95 job latency in milliseconds.
    ConnectorInstance:
      type: object
      description: One desired connector instance plus its last reported status (ADR-0026).
      properties:
        spec_id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        gateway_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
          description: Bound south-bound sub-device; empty for a gateway-level instance.
        profile_id:
          type: string
          format: uuid
          description: Device profile providing the connector template; empty when self-contained.
        connector_type: { type: string }
        type_version: { type: string }
        config:
          type: object
          additionalProperties: true
        mappings:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key:
                type: string
                minLength: 1
            additionalProperties: true
        health_check:
          $ref: "#/components/schemas/ConnectorHealthCheck"
        revision:
          type: integer
          format: int64
          description: Desired revision; starts at 1 and increments per update.
        state:
          type: string
          enum: [PENDING, DISPATCHED, CREATING, APPLIED, FAILED, DEGRADED]
        reported_revision:
          type: integer
          format: int64
        report_reason:
          type: string
        not_applied_alarm:
          type: boolean
        failed_alarm:
          type: boolean
        failed_critical:
          type: boolean
        failed_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        desired_at: { type: string, format: date-time }
        dispatched_at:
          type: string
          format: date-time
          nullable: true
        reported_at:
          type: string
          format: date-time
          nullable: true
        stats:
          $ref: "#/components/schemas/ConnectorStatusStats"
        observed_revision:
          type: integer
          format: int64
          description: Manager desired revision confirmed by authoritative GET readback; not manifest_revision.
        observed_hash:
          type: string
          description: Lowercase SHA-256 of the complete canonical manager GET array; never reported_config_hash/config_hash.
        manifest_revision:
          type: integer
          format: int64
          description: Desired revision the edge last listed in its full manifest (0 = never seen).
        reported_config_hash:
          type: string
          description: Optional canonical effective-config hash from the last manifest.
        last_manifest_at:
          type: string
          format: date-time
          nullable: true
          description: When the edge last listed this spec in its full connector manifest.
    SecretBinding:
      type: object
      description: One gateway secret delivery binding plus its reported state (ADR-0034).
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        gateway_id:
          type: string
          format: uuid
        secret_name: { type: string }
        secret_type: { type: string }
        type_version: { type: string }
        selectors:
          type: array
          items: { $ref: "#/components/schemas/SecretBindingSelector" }
        revision:
          type: integer
          format: int64
          description: Desired revision; starts at 1 and increments per update.
        status:
          type: string
          enum: [PENDING, DISPATCHED, APPLIED, FAILED, REMOVING, REMOVED]
        reason:
          type: string
          description: Edge-reported failure reason, when FAILED.
        dispatched_at:
          type: string
          format: date-time
          nullable: true
        applied_at:
          type: string
          format: date-time
          nullable: true
        removed_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    SecretBindingSelector:
      type: object
      properties:
        kind:
          type: string
          description: >-
            Open selector vocabulary the edge interprets; "mac" binds the
            secret to the device with that MAC. Opaque to the platform.
        value:
          type: string
          description: Selector value; opaque to the platform.
      required: [kind, value]
    SecretBindingWrite:
      type: object
      required: [selectors]
      description: Upsert body for a secret binding.
      properties:
        selectors:
          type: array
          items: { $ref: "#/components/schemas/SecretBindingSelector" }
    ProfileTarget:
      type: object
      description: One explicit profile distribution edge (ADR-0038).
      properties:
        profile_id:
          type: string
          format: uuid
        gateway_id:
          type: string
          format: uuid
        gateway_name:
          type: string
          description: Gateway display name, when resolvable.
        created_at: { type: string, format: date-time }
    ProfileTargetWrite:
      type: object
      required: [gateway_id]
      description: Create body for a distribution edge.
      properties:
        gateway_id:
          type: string
          format: uuid
    ProfileDelivery:
      type: object
      description: >-
        One (profile, gateway) delivery state (ADR-0038). The desired,
        dispatched and applied revisions let the console show how far a
        delivery got.
      properties:
        tenant_id:
          type: string
          format: uuid
        profile_id:
          type: string
          format: uuid
        profile_name: { type: string }
        gateway_id:
          type: string
          format: uuid
        desired_revision:
          type: integer
          format: int64
        dispatched_revision:
          type: integer
          format: int64
        applied_revision:
          type: integer
          format: int64
        state:
          type: string
          enum: [PENDING, DISPATCHED, APPLIED, FAILED, REJECTED, REMOVING, REMOVED]
        reason:
          type: string
          description: Edge-reported failure reason, when FAILED/REJECTED.
        explicit:
          type: boolean
          description: >-
            True when an operator created an explicit distribution edge
            (profile_gateway_target). False means the gateway holds the
            profile only implicitly through a connector instance; such a row
            is not withdrawable from the downlink surface.
        desired_at: { type: string, format: date-time }
        dispatched_at:
          type: string
          format: date-time
          nullable: true
        applied_at:
          type: string
          format: date-time
          nullable: true
        failed_at:
          type: string
          format: date-time
          nullable: true
        updated_at: { type: string, format: date-time }
    GatewayModel:
      type: object
      description: >-
        One model present on a gateway, reported in the full-replacement
        manifest models segment (ADR-0039). No model bytes transit
        NereidLink; this is the edge-reported inventory view. `labels` are
        stored and displayed verbatim and never interpreted by the kernel.
      required: [id, version, task, backend, state, labels, active_bindings, stale, first_seen, updated_at]
      properties:
        id:
          type: string
          description: Globally meaningful model identifier.
        version:
          type: string
          description: Semantic model version; (id, version) is the inventory key.
        revision:
          type: string
          description: Build/optimization job id (a string, e.g. "76937").
        task:
          type: string
          description: >-
            Task family (detection, classification, segmentation, pose, ocr,
            chat, embeddings, custom); an open enum, additional values pass
            through verbatim.
        family:
          type: string
          description: In-task result/post-process family, e.g. yolov8.
        backend:
          type: string
          enum: [kserve, openai, task-runtime]
          description: Inference protocol family, never a vendor name.
        server_family:
          type: string
          description: >-
            Concrete model-server product serving this model, as an open enum
            passed through verbatim (e.g. ovms, triton, external). Distinct
            from backend, which names the wire protocol family. Omitted by
            edge firmware predating the field; clients fall back to backend
            for display.
        model_name:
          type: string
          description: Runtime-facing model name, display/diagnostics only.
        state:
          type: string
          enum: [EXTRACTING, VALIDATING, READY, FAILED, REMOVED]
        reason:
          type: string
          description: Transport-safe failure code when FAILED; empty otherwise.
        labels:
          type: array
          items: { type: string }
          description: Class names indexed by class id; business data, not internationalized.
        active_bindings:
          type: integer
          description: edge-inference instances referencing this model (edge-authoritative).
        stale:
          type: boolean
          description: >-
            True when the model view is no longer trustworthy: either the
            gateway's whole gw-manifest lease expired (no manifest frames), or
            the models-segment watermark is older than 15 minutes while other
            manifest segments keep arriving (segment-silent edge). The row is
            kept (not pruned) until the gateway reports the models segment
            again and cannot be bound while stale.
        stale_at:
          type: string
          format: date-time
          nullable: true
        first_seen: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OperationInvokeBody:
      type: object
      description: Execute request for a gateway operation (ADR-0035).
      properties:
        params:
          type: object
          description: >-
            Parameter document shaped by the descriptor param_schema; values
            may be secret:// references. Capped at 64KB.
          additionalProperties: true
        step_up_id:
          type: string
          description: >-
            Consumed step-up challenge id; required for dangerous
            operations and ignored otherwise.
        timeout_ms:
          type: integer
          minimum: 100
          maximum: 60000
          description: >-
            Optional per-call wait override. It can only shorten the
            descriptor default (the effective value is the smaller of the
            two) and is clamped to 100..60000. Omit or send 0 to use the
            descriptor default.
    OperationTask:
      type: object
      description: One persisted gateway operation invocation (ADR-0035).
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        gateway_id:
          type: string
          format: uuid
        operation: { type: string }
        type_version: { type: string }
        params:
          type: object
          additionalProperties: true
          description: Params as sent (secret:// references, never plaintext).
        result:
          description: Edge-reported result (any JSON). Must not contain passwords by protocol agreement.
        status:
          type: string
          enum: [SUCCEEDED, FAILED, TIMEOUT, NOT_CONNECTED]
        reason:
          type: string
          description: Failure explanation.
        risk:
          type: string
          enum: [read, normal, dangerous]
        invoked_by:
          type: string
          format: uuid
        invoked_by_email: { type: string }
        started_at: { type: string, format: date-time }
        finished_at:
          type: string
          format: date-time
          nullable: true
    ProtocolFieldOption:
      type: object
      properties:
        value: { type: string }
        label: { type: string }
      required: [value, label]
    ProtocolFieldSpec:
      type: object
      description: >-
        One structured connection or point-address parameter. `key` is
        emitted verbatim into the edge protocol-property/address JSON, so its
        casing must match the reference device service exactly.
      properties:
        key: { type: string }
        label: { type: string }
        kind:
          type: string
          enum: [string, integer, number, boolean, duration, select]
        required: { type: boolean }
        placeholder: { type: string }
        hint: { type: string }
        options:
          type: array
          items: { $ref: "#/components/schemas/ProtocolFieldOption" }
        transports:
          type: array
          items: { type: string }
          description: Connection fields only; ["*"] means every transport.
        min: { type: number }
        max: { type: number }
        defaultValue:
          description: Point fields only; value inserted into a new address.
      required: [key, label, kind]
    ProtocolTransport:
      type: object
      properties:
        value: { type: string }
        label: { type: string }
      required: [value, label]
    ProtocolFamily:
      type: object
      description: One global device-service/protocol catalog row (ADR-0033).
      properties:
        family: { type: string }
        display_name: { type: string }
        service_name: { type: string }
        protocol_key: { type: string }
        transports:
          type: array
          items: { $ref: "#/components/schemas/ProtocolTransport" }
        connection_fields:
          type: array
          items: { $ref: "#/components/schemas/ProtocolFieldSpec" }
        point_fields:
          type: array
          items: { $ref: "#/components/schemas/ProtocolFieldSpec" }
        default_point_address:
          type: object
          additionalProperties: true
        doc_url: { type: string }
        builtin: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
      required: [family, display_name]
    ProtocolFamilyInput:
      type: object
      description: >-
        Create/update payload. family and display_name are required on create;
        family and builtin are immutable on update (the path supplies the key).
      properties:
        family: { type: string }
        display_name: { type: string }
        service_name: { type: string }
        protocol_key: { type: string }
        transports:
          type: array
          items: { $ref: "#/components/schemas/ProtocolTransport" }
        connection_fields:
          type: array
          items: { $ref: "#/components/schemas/ProtocolFieldSpec" }
        point_fields:
          type: array
          items: { $ref: "#/components/schemas/ProtocolFieldSpec" }
        default_point_address:
          type: object
          additionalProperties: true
        doc_url: { type: string }
      required: [display_name]
    ConnectorSchema:
      type: object
      description: One edge-registered connector config JSON Schema (migration 0043).
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        connector_type:
          type: string
        connector_type_version:
          type: string
          description: Plugin/type version; empty string is the unversioned "any" schema.
        config_schema:
          type: object
          additionalProperties: true
          description: Draft 2020-12 JSON Schema for the connector config document.
        protocol:
          type: string
          description: Optional open-vocabulary protocol family (e.g. modbus); empty leaves family checks fail-open.
        transports:
          type: array
          items: { type: string }
          description: Optional concrete transport keys within the family (e.g. modbus-tcp/modbus-rtu).
        source:
          type: string
          enum: [edge]
        registered_by:
          type: string
          format: uuid
          description: Gateway that advertised the schema in hello.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EdgeSecretType:
      type: object
      description: >-
        One descriptor for a credential the platform delivers to a gateway
        (ADR-0034). Descriptors are tenant-scoped: edge-advertised rows
        (source=edge) are read-only, manual rows are editable.
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        secret_type:
          type: string
          description: Credential type key understood by the gateway.
        type_version:
          type: string
          description: Descriptor version; empty string is the unversioned row.
        fields_schema:
          type: object
          additionalProperties: true
          description: Self-contained draft 2020-12 JSON Schema for the credential document.
        display_name:
          type: object
          additionalProperties: { type: string }
          description: Optional bilingual display names, e.g. {"en":"…","zh":"…"}.
        source:
          type: string
          enum: [edge, manual]
        registered_by:
          type: string
          format: uuid
          description: Gateway that advertised the descriptor (edge rows only).
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    EdgeSecretTypeWrite:
      type: object
      required: [type, fields_schema]
      description: Tenant-defined descriptor create/replace payload.
      properties:
        type: { type: string }
        type_version: { type: string }
        fields_schema:
          type: object
          additionalProperties: true
        display_name:
          type: object
          additionalProperties: { type: string }
    StepUpStart:
      type: object
      required: [action]
      description: Start a step-up challenge for one registered action.
      properties:
        action:
          type: string
          description: Registered action key, e.g. step_up:demo.
        details:
          type: object
          additionalProperties: true
          description: Non-sensitive action details shown to the operator.
    StepUpComplete:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: Current 6-digit TOTP code; never stored or logged.
    StepUpChallenge:
      type: object
      description: One 5-minute, single-use operation-time challenge.
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        action: { type: string }
        details:
          type: object
          additionalProperties: true
        details_sha256: { type: string }
        status:
          type: string
          enum: [pending, verified, consumed]
        expires_at: { type: string, format: date-time }
        verified_at: { type: string, format: date-time }
        consumed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        signed_payload:
          type: string
          description: Signed nl-stepup QR content (action/details hash/expiry/signature).
    GatewayOperation:
      type: object
      description: One effective gateway operation descriptor.
      properties:
        operation: { type: string }
        type_version: { type: string }
        interaction:
          type: string
          enum: [request-response, one-way]
        timeout_ms: { type: integer }
        risk:
          type: string
          enum: [read, normal, dangerous]
        param_schema:
          type: object
          additionalProperties: true
        result_schema:
          type: object
          additionalProperties: true
        display_name:
          type: object
          additionalProperties: { type: string }
        description:
          type: object
          additionalProperties: { type: string }
        source:
          type: string
          enum: [edge, manual]
        disabled: { type: boolean }
        advertised_by:
          type: array
          description: >-
            Edge aggregate rows only: the tenant gateways advertising this
            operation+version.
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        gateway_count:
          type: integer
          description: Number of gateways advertising an edge row.
        conflict:
          type: boolean
          description: >-
            True when same-key advertisers disagree on risk, timeout or a
            JSON schema.
    GatewayOperationWrite:
      type: object
      required: [operation]
      properties:
        operation: { type: string }
        type_version: { type: string }
        interaction:
          type: string
          enum: [request-response, one-way]
        timeout_ms: { type: integer, minimum: 100, maximum: 60000 }
        risk:
          type: string
          enum: [read, normal, dangerous]
        param_schema:
          type: object
          additionalProperties: true
        result_schema:
          type: object
          additionalProperties: true
        display_name:
          type: object
          additionalProperties: { type: string }
        description:
          type: object
          additionalProperties: { type: string }
    ConnectorReconcileView:
      type: object
      description: >-
        Read-only desired-vs-applied classification for one gateway, computed
        on demand from the last connector manifest watermark (migration 0055).
      properties:
        tenant_id:
          type: string
          format: uuid
        gateway_id:
          type: string
          format: uuid
        watermark:
          description: Last full connector manifest the gateway reported; null before the first.
          nullable: true
          type: object
          properties:
            tenant_id: { type: string, format: uuid }
            gateway_id: { type: string, format: uuid }
            observed_at: { type: string, format: date-time }
            spec_ids:
              type: array
              items: { type: string, format: uuid }
        in_sync:
          type: array
          items: { type: string, format: uuid }
        missing:
          type: array
          items: { type: string, format: uuid }
          description: Desired specs absent from the edge's last full manifest.
        stale:
          type: array
          items: { type: string, format: uuid }
          description: Specs the edge runs at an older desired revision.
        drifted:
          type: array
          items: { type: string, format: uuid }
          description: Same-revision specs whose effective config hash differs.
        extra:
          type: array
          items: { type: string, format: uuid }
          description: Spec ids the edge reported that NL does not desire.
        strict_mode:
          type: boolean
          description: Whether the deployment makes desired win on the next live reconcile.
    EdgeProfile:
      type: object
      description: One EdgeX device profile cached from a gateway's v1/gateway/profiles report.
      properties:
        name:
          type: string
          description: EdgeX device profile name.
        content_hash:
          type: string
          description: Platform-computed canonical sha256 of the profile (never taken from the wire).
        resource_count:
          type: integer
          format: int32
          description: Number of deviceResources in the raw reported profile.
        first_seen_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        adopted_profile_id:
          type: string
          format: uuid
          description: Native profile created/updated by the last adopt; absent when never adopted.
        adopted_at:
          type: string
          format: date-time
          nullable: true
    EdgeProfileResource:
      type: object
      description: One raw reported deviceResource with the adopt-time decision.
      properties:
        name: { type: string }
        value_type: { type: string }
        units: { type: string }
        description: { type: string }
        translatable:
          type: boolean
          description: Whether adopt would emit an identity descriptor for this resource.
        skip_reason:
          type: string
          description: Why the resource is excluded; empty when translatable.
    EdgeProfileDetail:
      type: object
      description: One cached EdgeX profile including metadata and every raw resource.
      allOf:
        - $ref: "#/components/schemas/EdgeProfile"
      properties:
        resources:
          type: array
          items: { $ref: "#/components/schemas/EdgeProfileResource" }
    EdgeProfileAdoptRequest:
      type: object
      description: Optional adopt controls. An empty body adopts under the edge profile name.
      properties:
        mode:
          type: string
          enum: ["", update]
          description: '"update" overwrites the descriptors of an existing same-name native profile.'
        target_name:
          type: string
          description: Adopt under a different native profile name.
    EdgeProfileAdoptResult:
      type: object
      properties:
        profile_id:
          type: string
          format: uuid
        profile_name:
          type: string
        created:
          type: boolean
          description: True when a new native profile was created.
        updated:
          type: boolean
          description: True when an existing profile's descriptors were replaced.
        adopted_count:
          type: integer
          format: int32
          description: Number of scalar deviceResources translated into descriptors.
        skipped:
          type: array
          description: Resources kept in the cache but excluded from translation.
          items:
            type: object
            properties:
              name: { type: string }
              value_type: { type: string }
              reason: { type: string }
    RetentionPolicy:
      type: object
      description: Effective retention policy for one tenant/domain.
      properties:
        tenant_id:
          type: string
          format: uuid
        domain:
          type: string
          enum: [telemetry, event, alarm, audit]
        retention_days:
          type: integer
          format: int32
          minimum: 0
          description: Automatic-delete age in days; 0 keeps data indefinitely.
        legal_hold:
          type: boolean
          description: When true, automatic deletion is suspended.
        overridden:
          type: boolean
          description: Whether the window differs from the code default.
    RetentionPolicyWrite:
      type: object
      required: [retention_days]
      properties:
        retention_days:
          type: integer
          format: int32
          minimum: 0
        legal_hold:
          type: boolean
          default: false
    DiscoveryPolicy:
      type: object
      description: Effective gateway auto-provisioning policy for a scope.
      properties:
        tenant_id:
          type: string
          format: uuid
        gateway_id:
          type: string
          format: uuid
          nullable: true
        enabled:
          type: boolean
          description: Whether auto-provisioning is effective for the scope.
        max_per_cycle:
          type: integer
          format: int32
          minimum: 1
          description: Max NEW devices one frame may insert.
        max_candidates:
          type: integer
          format: int32
          minimum: 1
          description: Max candidates accepted in one uplink frame.
        default_profile:
          type: string
          description: Profile UUID or name applied when a candidate names none.
        approval_mode:
          type: string
          enum: [auto, review]
          description: >-
            auto creates eligible candidates immediately; review parks them in
            the discovery-candidate approval queue until an operator decides.
        overridden:
          type: boolean
          description: Whether a stored override row exists at this exact scope.
    DiscoveryPolicyWrite:
      type: object
      description: >-
        Partial override. Omitted fields inherit the next-less-specific level
        (gateway -> tenant -> deployment). Provide at least one field.
      properties:
        enabled:
          type: boolean
        max_per_cycle:
          type: integer
          format: int32
          minimum: 1
        max_candidates:
          type: integer
          format: int32
          minimum: 1
        default_profile:
          type: string
        approval_mode:
          type: string
          enum: [auto, review]
    DiscoveryCandidate:
      type: object
      description: One queued gateway discovery candidate awaiting review.
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        gateway_id:
          type: string
          format: uuid
        local_id:
          type: string
        candidate_name:
          type: string
        profile_id:
          type: string
          format: uuid
          nullable: true
        source_type:
          type: string
        state:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXPIRED]
        device_id:
          type: string
          format: uuid
          nullable: true
        decision_reason:
          type: string
        decided_by:
          type: string
        decided_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
    SecretMetadata:
      type: object
      description: Tenant secret metadata; the sealed value is never exposed.
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [blob, document]
        secret_type:
          type: string
          description: Empty for legacy/ad-hoc entries.
        type_version:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SecretDeleteRequest:
      type: object
      description: DELETE options; omit the body for a normal guarded deletion.
      properties:
        force:
          type: boolean
          description: Withdraw all bindings as part of the deletion.
        step_up_id:
          type: string
          format: uuid
          description: Verified human TOTP step-up challenge.
      required: [force]
    SecretReference:
      type: object
      required: [gateway_id, gateway_name, status]
      properties:
        gateway_id:
          type: string
          format: uuid
        gateway_name:
          type: string
        status:
          type: string
          enum: [PENDING, APPLIED, FAILED, REMOVING]
    PendingSecretDelete:
      type: object
      required: [secret_name, initiated_at]
      properties:
        secret_name:
          type: string
        initiated_by:
          type: string
          format: uuid
        initiated_at:
          type: string
          format: date-time
    SecretDeleteConflict:
      type: object
      required: [error, references]
      properties:
        error:
          $ref: "#/components/schemas/Error"
        secret_name:
          type: string
        references:
          type: array
          items: { $ref: "#/components/schemas/SecretReference" }
    SecretWrite:
      type: object
      description: >-
        Create/rotate payload: either legacy single value or a typed
        document with its type.
      oneOf:
        - required: [value]
        - required: [document]
      properties:
        value:
          type: string
        secret_type:
          type: string
        type_version:
          type: string
        document:
          type: object
          additionalProperties: true
    DiscoveryItemResult:
      type: object
      description: Per-candidate outcome returned after an approval decision.
      properties:
        local_id:
          type: string
        device_id:
          type: string
          format: uuid
        canonical_name:
          type: string
        profile_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [created, existing, rejected, pending]
        reason:
          type: string
    ImportPreview:
      type: object
      description: Validate-and-preview result for a bulk import.
      properties:
        total: { type: integer }
        valid: { type: integer }
        invalid: { type: integer }
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            properties:
              line: { type: integer }
              valid: { type: boolean }
              reason: { type: string }
              values:
                type: object
                additionalProperties: { type: string }
    AuditEvent:
      type: object
      description: Append-only audit event linked to the previous event hash.
      properties:
        seq:
          type: integer
          format: int64
        time:
          type: string
          format: date-time
        tenant_id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        actor_name:
          type: string
        event_type:
          type: string
          enum:
            - AUTH_LOGIN
            - AUTH_LOGIN_FAILED
            - AUTH_LOGOUT
            - CONFIG_CHANGE
            - COMMAND_DISPATCH
            - CREDENTIAL_MANAGE
            - PERMISSION_CHANGE
            - HIGH_RISK_OPERATION
            - TENANT_LIFECYCLE
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        details:
          type: object
          additionalProperties: true
        ip:
          type: string
        prev_hash:
          type: string
        hash:
          type: string
      required:
        - seq
        - time
        - actor_name
        - event_type
        - action
        - resource_type
        - resource_id
        - details
        - ip
        - prev_hash
        - hash
      example:
        seq: 2
        time: "2026-09-29T16:41:26.258735Z"
        tenant_id: 00000000-0000-0000-0000-000000000001
        actor_id: a655b7de-b8e0-4362-9bff-4629200a3cfe
        actor_name: admin@nereidai.local
        event_type: COMMAND_DISPATCH
        action: dispatch
        resource_type: device_command
        resource_id: 68bb70a2-a3a6-4ce2-bd2f-73290c63ee92
        details:
          device: 00000000-0000-0000-0000-000000000100
          name: reboot
          status: QUEUED
        ip: "[::1]:34948"
        prev_hash: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        hash: b805df1c962027a023975d8a1af06788aaed4474ac490cece8e126cc32a962c1
    AuditEventPage:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        total:
          type: integer
        page:
          type: integer
      required: [events, total, page]
    AuditVerifyResult:
      type: object
      properties:
        ok:
          type: boolean
        events_checked:
          type: integer
        seals_checked:
          type: integer
        broken_at_seq:
          type: integer
          format: int64
        reason:
          type: string
      required: [ok, events_checked, seals_checked]
      example:
        ok: true
        events_checked: 9
        seals_checked: 0
    LicenseState:
      type: object
      properties:
        read_only:
          type: boolean
        suspended:
          type: boolean
        reason:
          type: string
        device_cap:
          type: integer
          format: int64
          description: Zero means unlimited.
        device_count:
          type: integer
          format: int64
        expires_at:
          type: string
          format: date-time
      required: [read_only, suspended, device_cap, device_count, expires_at]
      example:
        read_only: false
        suspended: false
        device_cap: 10000
        device_count: 2
        expires_at: "2031-09-30T00:00:00Z"
    SuspendTenantRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
      example:
        reason: Contract expired
    LicenseEnvelope:
      type: object
      description: |
        Signed offline license file: base64 canonical JSON payload plus a
        detached base64 Ed25519 signature over those exact payload bytes.
        Produced by the vendor `tools/license-sign`; the same file is accepted
        by the CLI `nereidlink license install`.
      required: [payload, signature]
      properties:
        payload:
          type: string
          format: byte
          description: Base64-encoded JSON license payload.
        signature:
          type: string
          format: byte
          description: Base64-encoded detached Ed25519 signature.
      example:
        payload: eyJzY29wZSI6IioiLCJjdXN0b21lcl9uYW1lIjoiSW50ZXJuYWwifQ==
        signature: PZd8Za7C6K6nmEQa0Li712t/nYlClT2H7tsueENLqyTe6QDK4sTJ3sZwTrnx2QYmt7saCr74PMydMEn3FYAeAQ==
    DeploymentLicense:
      type: object
      description: |
        Installation and gate status of the deployment-scope (`scope: "*"`)
        license. Returned by the platform administrator license endpoints.
      properties:
        installed:
          type: boolean
          description: Whether a deployment license row is present.
        customer_name:
          type: string
        tenant_cap:
          type: integer
          format: int64
          description: Zero means unlimited.
        tenant_count:
          type: integer
          format: int64
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        features:
          type: array
          items:
            type: string
        read_only:
          type: boolean
          description: Effective gate (missing, expired, over-cap or clock).
        reason:
          type: string
          description: Present when read_only is true.
      required: [installed, tenant_cap, tenant_count, features, read_only]
      example:
        installed: true
        customer_name: YIQISOFT Internal
        tenant_cap: 0
        tenant_count: 1
        issued_at: "2026-10-04T01:52:18Z"
        expires_at: "2036-10-04T01:52:18Z"
        features: []
        read_only: false
    UsageRow:
      type: object
      properties:
        day:
          type: string
          format: date
        tenant_id:
          type: string
          format: uuid
        device_count:
          type: integer
        active_device_count:
          type: integer
        messages:
          type: integer
          format: int64
        bytes:
          type: integer
          format: int64
        hot_bytes:
          type: integer
          format: int64
        warm_bytes:
          type: integer
          format: int64
        cold_bytes:
          type: integer
          format: int64
      required:
        - day
        - tenant_id
        - device_count
        - active_device_count
        - messages
        - bytes
        - hot_bytes
        - warm_bytes
        - cold_bytes
    DeviceShadow:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        desired:
          type: object
          additionalProperties: true
        reported:
          type: object
          additionalProperties: true
        delta:
          type: object
          additionalProperties: true
        desired_version:
          type: integer
          format: int64
        reported_version:
          type: integer
          format: int64
        etag:
          type: string
        in_sync:
          type: boolean
        desired_at:
          type: string
          format: date-time
        reported_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - device_id
        - desired
        - reported
        - delta
        - desired_version
        - reported_version
        - etag
        - in_sync
        - updated_at
    UpdateShadowDesiredRequest:
      type: object
      required: [state]
      properties:
        state:
          type: object
          additionalProperties: true
    ReportShadowRequest:
      type: object
      required: [state]
      properties:
        version:
          type: integer
          format: int64
        state:
          type: object
          additionalProperties: true
    ShadowDesiredSchema:
      type: object
      description: Profile-derived catalog of writable desired keys for the editor.
      required: [device_id, fields]
      properties:
        device_id:
          type: string
          format: uuid
        profile_id:
          type: string
          format: uuid
          nullable: true
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ShadowDesiredKey'
    ShadowDesiredKey:
      type: object
      required: [key, type]
      properties:
        key:
          type: string
          description: Top-level shadow key (the profile measurement key).
        type:
          type: string
          enum: [boolean, number, string]
        unit:
          type: string
        min:
          type: number
          nullable: true
        max:
          type: number
          nullable: true
        default:
          description: Profile-reported default initial value.
          oneOf:
            - type: boolean
            - type: number
            - type: string
    TenantProvisionTask:
      type: object
      description: |
        Tenant provisioning outbox row (ADR-0027 Q24). A tenant with
        status PROVISIONING or FAILED cannot authenticate devices or
        users; ACTIVE means every provisioning step succeeded.
      properties:
        tenant_id:
          type: string
          format: uuid
        tenant_name:
          type: string
        tenant_status:
          type: string
          description: |
            Live tenant-table state. It tracks suspension independently of
            the provisioning task status, which remains ACTIVE while a
            tenant is suspended.
          enum: [ACTIVE, SUSPENDED]
        status:
          type: string
          enum: [PROVISIONING, ACTIVE, FAILED]
        attempts:
          type: integer
        last_error:
          type: string
        run_after:
          type: string
          format: date-time
      required: [tenant_id, tenant_name, tenant_status, status, attempts, last_error, run_after]
      example:
        tenant_id: 3ddc1b5b-5017-4650-9ba6-a5f13a18a828
        tenant_name: Acme Factory
        tenant_status: ACTIVE
        status: ACTIVE
        attempts: 1
        last_error: ""
        run_after: "2026-09-29T23:56:33+08:00"
    TenantMember:
      type: object
      description: |
        One tenant member: an app_user plus its membership roles. Member
        administration is delegated to a platform admin (any tenant) or the
        tenant's own TENANT_ADMIN; other roles receive 403. A generated
        password is returned exactly once and never retrievable afterwards.
        An is_platform_admin account is fully protected: roles, data scope,
        enable state, password reset and removal all return 403. Removing a
        member deletes the login account only when it has no membership left
        in any tenant (suite SSO users keep accounts with access elsewhere).
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        roles:
          type: array
          items:
            type: string
            enum: [TENANT_ADMIN, ENGINEER, CUSTOMER_USER, READ_ONLY]
        data_scope:
          type: string
          description: |
            Which devices the member may reach. Roles decide what a member
            may do; the data scope decides whose rows they may touch
            (ADR-0022). SELF is not offered because no resource in the
            current schema is owned by a user.
          enum: [TENANT, CUSTOMER, GROUP]
        data_scope_id:
          type: string
          format: uuid
          description: |
            Anchoring customer or group id for a narrowed scope, absent for
            TENANT. A GROUP scope covers the anchor group and every group
            beneath it.
        data_scope_name:
          type: string
          description: |
            Server-resolved anchor label for display. Absent for TENANT and
            for an anchor that has since been deleted.
        disabled:
          type: boolean
        email_verified:
          type: boolean
        is_platform_admin:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
      required: [user_id, email, display_name, roles, data_scope, disabled, email_verified, is_platform_admin, created_at]
      example:
        user_id: 0c2d9c41-2a6a-4f60-9a2e-7f6b1c3d4e5f
        email: engineer@acme.example
        display_name: Acme Engineer
        roles: [TENANT_ADMIN]
        data_scope: CUSTOMER
        data_scope_id: 7f3d9a52-1c4e-4f0b-9a6d-2b8e7f1a3c5d
        data_scope_name: Acme Retail
        disabled: false
        email_verified: true
        is_platform_admin: false
        created_at: "2026-09-30T09:00:00Z"
    CreateTenantMemberRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
        password:
          type: string
          description: Leave empty to generate a 16-character password.
        roles:
          type: array
          items:
            type: string
            enum: [TENANT_ADMIN, ENGINEER, CUSTOMER_USER, READ_ONLY]
        data_scope:
          type: string
          description: |
            Membership narrowing. Defaults to TENANT. The anchor must belong
            to the tenant; an unknown anchor is rejected with 400.
          enum: [TENANT, CUSTOMER, GROUP]
        data_scope_id:
          type: string
          format: uuid
          description: |
            Required for CUSTOMER and GROUP, and must be absent for TENANT.
      example:
        email: engineer@acme.example
        roles: [TENANT_ADMIN]
        data_scope: GROUP
        data_scope_id: 7f3d9a52-1c4e-4f0b-9a6d-2b8e7f1a3c5d
    CreateTenantMemberResponse:
      type: object
      properties:
        member:
          $ref: '#/components/schemas/TenantMember'
        generated_password:
          type: string
          description: Present only when the request password was empty.
      required: [member]
    MemberRolesRequest:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [TENANT_ADMIN, ENGINEER, CUSTOMER_USER, READ_ONLY]
    MemberPasswordRequest:
      type: object
      properties:
        password:
          type: string
          description: Empty generates a new password.
    MemberPasswordResponse:
      type: object
      required: [password]
      properties:
        password:
          type: string
    MemberEnabledRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    OpsOrder:
      type: object
      description: |
        Signed high-risk operation order with its full review state.
        Rows are never deleted; expired or decided orders stay for the
        compliance record.
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
          nullable: true
        action:
          type: string
        summary:
          type: string
        payload:
          type: object
          additionalProperties: true
        content_hash:
          type: string
        initiator_id:
          type: string
          format: uuid
          nullable: true
        initiator_name:
          type: string
        initiator_channel:
          type: string
          enum: [WEB, CLI]
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, EXECUTED, EXPIRED, CANCELLED]
        reviewer_id:
          type: string
          format: uuid
          nullable: true
        reviewer_name:
          type: string
        reviewer_channel:
          type: string
          enum: ["", WEB, CLI]
        review_reason:
          type: string
        reviewed_at:
          type: string
          format: date-time
          nullable: true
        executed_at:
          type: string
          format: date-time
          nullable: true
        exec_result:
          type: object
          additionalProperties: true
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
        [id, action, summary, payload, content_hash, initiator_name,
         initiator_channel, status, reviewer_name, reviewer_channel,
         review_reason, exec_result, expires_at, created_at]
    CreateOpsOrderRequest:
      type: object
      required: [action, payload, operator]
      properties:
        tenant_id:
          type: string
          format: uuid
        action:
          type: string
          enum:
            - telemetry.purge
            - tenant.deprovision
            - retention.shorten
            - node.force-disconnect
            - license.replace
            - quarantine.release
        summary:
          type: string
        payload:
          type: object
          additionalProperties: true
        operator:
          type: string
          description: OS user running the operator CLI.
        ttl_seconds:
          type: integer
          minimum: 1
    OpsCancelRequest:
      type: object
      required: [operator]
      properties:
        operator:
          type: string
    OpsDeadmanTestRequest:
      type: object
      description: >-
        Optional overrides for the synthetic dead-man report. Empty values
        make the server substitute the test defaults.
      properties:
        code:
          type: string
          description: Report code carried in the fallback payload.
          example: PLATFORM_PROBLEM_TEST
        subject:
          type: string
          example: NereidLink dead-man test
        body:
          type: string
          example: This is an operator-triggered dead-man delivery test.
    OpsReviewRequest:
      type: object
      properties:
        reason:
          type: string
    MFAChallenge:
      type: object
      required: [challenge_token, expires_in]
      properties:
        challenge_token:
          type: string
        expires_in:
          type: integer
    LinkEpisodePage:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/LinkEpisodeRow"
    LinkEpisodeRow:
      type: object
      required: [episode_id, gateway_id, gateway_name, source, started_at,
                 down_reason]
      properties:
        episode_id: { type: string, format: uuid }
        gateway_id: { type: string, format: uuid }
        gateway_name: { type: string }
        source:
          type: string
          enum: [lease, edge]
        started_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        down_reason: { type: string }
        edge_down_at: { type: string, format: date-time }
        alarm_id: { type: string, format: uuid }
    LoginResult:
      type: object
      description: |
        Either a complete token pair or a short-lived MFA challenge. Exactly
        one of the properties is present.
      oneOf:
        - required: [pair]
        - required: [mfa]
      properties:
        pair:
          $ref: '#/components/schemas/TokenPair'
        mfa:
          $ref: '#/components/schemas/MFAChallenge'
    MFAVerifyRequest:
      type: object
      required: [challenge_token, code]
      properties:
        challenge_token:
          type: string
        code:
          type: string
          description: TOTP code or single-use recovery code.
    MFAStatus:
      type: object
      required: [totp_enabled]
      properties:
        totp_enabled:
          type: boolean
    TOTPEnrollment:
      type: object
      required: [secret, uri]
      properties:
        secret:
          type: string
        uri:
          type: string
          format: uri
    TOTPConfirmRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
    RecoveryCodeSet:
      type: object
      required: [codes]
      properties:
        codes:
          type: array
          items:
            type: string
    LoginRequest:
      type: object
      required: [email, password, captcha_id, captcha_answer]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        captcha_id:
          type: string
          description: One-time challenge id from GET /v1/auth/captcha.
        captcha_answer:
          type: integer
          description: Integer answer to the arithmetic challenge.
      example:
        email: admin@nereidai.local
        password: Admin12345!
        captcha_id: 1b9d6bcdbbfd4b2d9b3d6b4f5f4f5f10
        captcha_answer: 9
    CaptchaChallenge:
      type: object
      required: [captcha_id, expression]
      properties:
        captcha_id:
          type: string
        expression:
          type: string
          description: Human-readable arithmetic expression, e.g. "7 + 2 = ?".
      example:
        captcha_id: 1b9d6bcdbbfd4b2d9b3d6b4f5f4f5f10
        expression: "7 + 2 = ?"
    BootstrapStatus:
      type: object
      required: [required]
      properties:
        required:
          type: boolean
          description: True while the first administrator password is unset.
        email:
          type: string
          format: email
          description: Fixed bootstrap administrator email, present when required.
      example:
        required: true
        email: admin@nereidai.local
    BootstrapRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          minLength: 10
          description: New administrator password (at least 10 characters).
      example:
        password: FirstRunStrongPass123
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        is_platform_admin:
          type: boolean
        email_verified:
          type: boolean
        must_change_password:
          type: boolean
        last_login_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        tenant_roles:
          type: object
          description: >
            Built-in roles per membership tenant, keyed by tenant id. Present
            on /v1/auth/me and login responses for accounts with memberships;
            used by the UI to show tenant-admin surfaces such as member
            administration.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            7bda011f-d995-41e3-be93-16edb7bf564d: ["TENANT_ADMIN"]
    TokenPair:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/AuthUser'
    TokenRequest:
      type: object
      required: [grant_type, client_id, client_secret]
      properties:
        grant_type:
          type: string
          enum: [client_credentials]
        client_id:
          type: string
          example: sa_jbqxk3v5m7z2n4q6w8e1a0s9
        client_secret:
          type: string
          format: password
        scope:
          type: string
          description: Optional requested scope; reserved for future narrowing.
    MachineTokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 1800 }
    OAuthError:
      type: object
      required: [error]
      properties:
        error:
          type: string
          enum: [invalid_request, invalid_client, unsupported_grant_type]
        error_description:
          type: string
    APIKey:
      type: object
      required: [id, tenant_id, user_id, name, key_prefix, scopes, revoked, created_at, created_by]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        name: { type: string, maxLength: 200 }
        key_prefix:
          type: string
          description: Non-secret stored prefix used for display and indexed lookup.
          example: nlk_abcd2345
        scopes:
          type: array
          items: { type: string }
          description: Empty array means the key inherits the owner's live permissions.
        expires_at:
          type: string
          format: date-time
          nullable: true
        revoked: { type: boolean }
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at: { type: string, format: date-time }
        created_by: { type: string, format: uuid }
    CreateAPIKeyRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        scopes:
          type: array
          items: { type: string }
          description: Explicit permission points; must be held by the owner. Empty means live role inheritance.
          example: [device:read, stats:read]
        expires_at:
          type: string
          format: date-time
          nullable: true
    CreatedAPIKey:
      type: object
      required: [item, api_key]
      properties:
        item:
          $ref: '#/components/schemas/APIKey'
        api_key:
          type: string
          format: password
          description: >-
            Full plaintext key in the format nlk_ followed by 52 lowercase
            unpadded base32 characters. Returned exactly once; the value below
            is a non-secret placeholder.
          example: nlk_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    RotatedAPIKey:
      type: object
      required: [item, api_key, old_prefix]
      properties:
        item:
          $ref: '#/components/schemas/APIKey'
        api_key:
          type: string
          format: password
          description: New plaintext key, returned exactly once.
        old_prefix:
          type: string
          description: Prefix of the replaced credential, retained for audit correlation.
    ServiceAccount:
      type: object
      required: [id, tenant_id, client_id, name, scopes, enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        client_id: { type: string }
        name: { type: string }
        scopes:
          type: array
          items: { type: string }
          description: ADR-0022 permission points; '*' is the tenant-admin wildcard.
        enabled: { type: boolean }
        last_used_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateServiceAccountRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        scopes:
          type: array
          items: { type: string }
          example: [device:read, stats:read, alarm:read]
    CreatedServiceAccount:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/ServiceAccount'
        client_id: { type: string }
        client_secret:
          type: string
          format: password
          description: Plaintext secret, returned exactly once.
    UpdateServiceAccountRequest:
      type: object
      description: A field is changed only when present.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        scopes:
          type: array
          items: { type: string }
    RotatedServiceAccountSecret:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/ServiceAccount'
        client_id: { type: string }
        client_secret:
          type: string
          format: password
          description: New plaintext secret, returned exactly once.
        rotating_expires_at:
          type: string
          format: date-time
          description: Expiry of the previous (now ROTATING) secret; empty if it never expired.
    SessionInfo:
      type: object
      description: A refresh-token session as exposed to its owner.
      required: [id, ip, user_agent, current, active, created_at, expires_at]
      properties:
        id:
          type: string
          format: uuid
          description: Session identifier (matches access-token `sid` claim).
        ip:
          type: string
          description: Client IP at session creation.
        user_agent:
          type: string
          description: Client User-Agent at session creation.
        current:
          type: boolean
          description: True for the session backing the request token.
        active:
          type: boolean
          description: True when not revoked and inside refresh TTL.
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    MemberDataScopeRequest:
      type: object
      required: [data_scope]
      properties:
        data_scope:
          type: string
          description: |
            The narrowing level. SELF is rejected: ADR-0022 lists it, but no
            resource in the current schema is owned by a user, so it cannot
            be honored and silently widening it would expose the tenant.
          enum: [TENANT, CUSTOMER, GROUP]
        data_scope_id:
          type: string
          format: uuid
          description: |
            Required for CUSTOMER and GROUP, and must be empty for TENANT.
            For GROUP the member covers the anchor group and every group
            beneath it.
      example:
        data_scope: CUSTOMER
        data_scope_id: 7f3d9a52-1c4e-4f0b-9a6d-2b8e7f1a3c5d
    DeviceTelemetryFrame:
      type: object
      description: |
        Telemetry frame keyed by measurement identifier. Field values are
        numbers, booleans or strings; one Envelope is published per
        measurement key. Null and arbitrary structured values are rejected.
        A field may instead be a BlobMarker: its base64 payload is stored
        in blob storage and the point becomes a `blob://<key>` string
        reference (requires blob storage).
      additionalProperties:
        anyOf:
          - type: number
          - type: boolean
          - type: string
          - $ref: '#/components/schemas/BlobMarker'
      example:
        temperature: 21.5
        humidity: 62.1
        switch: true
        mode: AUTO
    BlobMarker:
      type: object
      required: [blob, data]
      description: |
        Marks one telemetry field as binary media for blob offload. `data`
        is standard or URL-safe base64, with or without padding.
      properties:
        blob:
          type: boolean
          enum: [true]
          description: Must be true.
        content_type:
          type: string
          example: image/jpeg
          description: Media type; empty stores no type (read side sniffs).
        filename:
          type: string
          example: camera-01.jpg
        data:
          type: string
          contentEncoding: base64
          description: Base64-encoded media bytes.
      example:
        blob: true
        content_type: image/jpeg
        filename: camera-01.jpg
        data: /9j/4AAQSkZJRgABAQEASABIAAD...
    DeviceCommandFrame:
      type: object
      required: [id, name, params]
      properties:
        id:
          type: string
          format: uuid
          description: Command identifier.
        name:
          type: string
          description: Command name from the catalog.
        params:
          type: object
          description: Catalog-validated JSON document delivered verbatim.
          additionalProperties: true
    SouthboundModule:
      type: object
      required: [id, type, name, ingress_id, enabled, config, status]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [coap, lwm2m, snmp]
        name: { type: string }
        ingress_id: { type: string }
        enabled: { type: boolean }
        config:
          type: object
          additionalProperties: true
        version: { type: string }
        status:
          type: string
          enum: [ONLINE, OFFLINE]
        enrollment_token: { type: string }
        registered_at: { type: string, format: date-time, nullable: true }
        last_heartbeat: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateSouthboundModule:
      type: object
      required: [type, name, ingress_id]
      properties:
        type:
          type: string
          enum: [coap, lwm2m, snmp]
        name: { type: string }
        ingress_id: { type: string }
        enabled: { type: boolean }
        config:
          type: object
          additionalProperties: true
    UpdateSouthboundModule:
      type: object
      properties:
        name: { type: string }
        enabled: { type: boolean }
        config:
          type: object
          additionalProperties: true
    RegisterModule:
      type: object
      required: [enrollment_token, type, ingress_id]
      properties:
        enrollment_token: { type: string }
        type:
          type: string
          enum: [coap, lwm2m, snmp]
        ingress_id: { type: string }
        version: { type: string }
    MetricCount:
      type: object
      required: [label, count]
      properties:
        label: { type: string }
        count: { type: integer, format: int64 }
    OverviewRecentAlarm:
      type: object
      required: [id, device_id, type, severity, state, started_at]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        type: { type: string }
        severity:
          type: string
          enum: [CRITICAL, MAJOR, MINOR, WARNING]
        state:
          type: string
          enum: [ACTIVE, ACK]
        started_at: { type: string, format: date-time }
    OverviewRecentNotification:
      type: object
      required: [id, device_id, title, body, severity, state, created_at]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string }
        title: { type: string }
        body: { type: string }
        severity: { type: string }
        state:
          type: string
          enum: [NEW, READ]
        created_at: { type: string, format: date-time }
    OverviewSummary:
      type: object
      required:
        - generated_at
        - device_total
        - online_devices
        - offline_devices
        - live_alarms
        - pending_commands
        - unread_notifications
        - telemetry_last_hour
        - telemetry_last_24h
        - telemetry_buckets
        - alarm_severities
        - recent_alarms
        - recent_notifications
      properties:
        generated_at: { type: string, format: date-time }
        device_total: { type: integer, format: int64 }
        online_devices: { type: integer, format: int64 }
        offline_devices: { type: integer, format: int64 }
        live_alarms: { type: integer, format: int64 }
        pending_commands: { type: integer, format: int64 }
        unread_notifications: { type: integer, format: int64 }
        telemetry_last_hour: { type: integer, format: int64 }
        telemetry_last_24h: { type: integer, format: int64 }
        telemetry_buckets:
          type: array
          items:
            $ref: "#/components/schemas/MetricCount"
        alarm_severities:
          type: array
          items:
            $ref: "#/components/schemas/MetricCount"
        recent_alarms:
          type: array
          items:
            $ref: "#/components/schemas/OverviewRecentAlarm"
        recent_notifications:
          type: array
          items:
            $ref: "#/components/schemas/OverviewRecentNotification"
    StorageHook:
      type: object
      required: [id, name, enabled, order, hook_type, measurement_keys,
                 config, timeout_ms, failure_policy]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        enabled: { type: boolean }
        order: { type: integer }
        hook_type:
          type: string
          enum: [expression, webhook, wasm]
        measurement_keys:
          type: array
          items: { type: string }
          description: Empty array means every measurement key.
        config:
          type: object
          description: |
            Type-specific config. expression {script}, webhook {url},
            wasm {module_b64} (standard base64). A read response masks a wasm
            module to {module_size, module_sha256}.
          additionalProperties: true
        timeout_ms: { type: integer }
        failure_policy:
          type: string
          enum: [passthrough, abort, dlq]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    StorageHookWrite:
      type: object
      required: [name, enabled, order, hook_type, measurement_keys,
                 config, timeout_ms, failure_policy]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        order: { type: integer }
        hook_type:
          type: string
          enum: [expression, webhook, wasm]
        measurement_keys:
          type: array
          items: { type: string }
        config:
          type: object
          description: |
            {script} for expression, {url} for webhook, {module_b64}
            (standard base64 WebAssembly; max size per
            storage_hook.wasm_max_module_bytes, default 2 MiB) for wasm.
            On a wasm update, omit module_b64 to keep the stored binary.
          additionalProperties: true
        timeout_ms: { type: integer }
        failure_policy:
          type: string
          enum: [passthrough, abort, dlq]
    Forwarder:
      type: object
      required: [id, tenant_id, name, sink_type, sink_config, encoder,
                 max_attempts, message_ttl_ms, max_buffer_messages,
                 enabled, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        name: { type: string }
        sink_type:
          type: string
          description: Delivery sink; see the matching *SinkConfig schema.
          enum: [http, mqtt, nats, amqp, kafka, email, sms]
        sink_config:
          $ref: "#/components/schemas/ForwarderSinkConfig"
        encoder:
          type: string
          enum: [json]
        max_attempts: { type: integer }
        message_ttl_ms:
          type: integer
          format: int64
          description: Undelivered messages older than this are dropped.
        max_buffer_messages:
          type: integer
          description: Oldest messages are discarded when this is exceeded.
        enabled: { type: boolean }
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ForwarderWrite:
      type: object
      required: [name, sink_type, sink_config]
      properties:
        name: { type: string }
        sink_type:
          type: string
          enum: [http, mqtt, nats, amqp, kafka, email, sms]
        sink_config:
          $ref: "#/components/schemas/ForwarderSinkConfig"
        encoder:
          type: string
          enum: [json]
        max_attempts: { type: integer, minimum: 0, maximum: 50 }
        message_ttl_ms: { type: integer, format: int64, minimum: 0 }
        max_buffer_messages: { type: integer, minimum: 0 }
        enabled: { type: boolean }
    ForwarderSinkConfig:
      type: object
      description: >-
        Sink-specific parameters; the valid members depend on sink_type and
        match the per-sink *SinkConfig schemas. The HTTP sink accepts private
        CA, mutual-TLS client credentials, Basic authentication and custom
        headers.
      oneOf:
        - $ref: "#/components/schemas/HTTPSinkConfig"
        - $ref: "#/components/schemas/MQTTSinkConfig"
        - $ref: "#/components/schemas/NATSSinkConfig"
        - $ref: "#/components/schemas/AMQPSinkConfig"
        - $ref: "#/components/schemas/KafkaSinkConfig"
        - $ref: "#/components/schemas/EmailSinkConfig"
        - $ref: "#/components/schemas/SMSSinkConfig"
      discriminator:
        propertyName: sink_type
    HTTPSinkConfig:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          description: Receiver endpoint (http:// or https://).
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
          default: POST
        headers:
          type: object
          description: Headers added to every request.
          additionalProperties: { type: string }
        username:
          type: string
          description: Enables HTTP Basic authentication with password.
        password: { type: string }
        ca_cert:
          type: string
          description: PEM certificate (or bundle) of a private CA.
        client_cert:
          type: string
          description: PEM client certificate for mutual TLS; needs client_key.
        client_key:
          type: string
          description: PEM private key matching client_cert.
        skip_tls_verify:
          type: boolean
          default: false
          description: Insecure verification opt-out; prefer ca_cert.
    MQTTSinkConfig:
      type: object
      required: [broker, topic]
      properties:
        broker: { type: string, description: "e.g. tcp://host:1883." }
        topic: { type: string }
        qos: { type: integer, enum: [0, 1, 2], default: 0 }
        client_id: { type: string, description: Auto-generated when empty. }
        username: { type: string }
        password: { type: string }
    NATSSinkConfig:
      type: object
      required: [servers, subject]
      properties:
        servers: { type: string, description: "nats:// URL(s)." }
        subject: { type: string }
        username: { type: string }
        password: { type: string }
        token: { type: string }
    AMQPSinkConfig:
      type: object
      required: [url, routing_key]
      properties:
        url: { type: string, description: "amqp://user:pass@host:5672/vhost." }
        exchange:
          type: string
          description: Empty publishes to the default exchange.
        routing_key: { type: string }
    KafkaSinkConfig:
      type: object
      required: [brokers, topic]
      properties:
        brokers:
          description: Seed brokers as a comma-separated host:port string (the form format) or a JSON array of strings.
          oneOf:
            - type: string
              example: "host1:9092, host2:9092"
            - type: array
              items: { type: string }
        topic: { type: string }
        use_sasl:
          type: boolean
          default: false
          description: Enables SASL/PLAIN authentication with username/password; older configs with a username but no use_sasl are treated as enabled.
        username:
          type: string
          description: SASL/PLAIN username, required when use_sasl is true.
        password: { type: string }
    EmailSinkConfig:
      type: object
      required: [host, from, to]
      properties:
        host: { type: string }
        port:
          type: integer
          description: "Defaults from security: 587 for STARTTLS, 465 for implicit TLS, 25 for plaintext."
        security:
          type: string
          enum: [starttls, tls, none]
          default: starttls
          description: Transport encryption. starttls upgrades after EHLO (usually 587); tls dials implicit TLS (usually 465); none is plaintext (usually 25).
        from: { type: string }
        to:
          type: array
          items: { type: string }
        subject: { type: string }
        ehlo_domain:
          type: string
          description: FQDN announced in EHLO/HELO; defaults to the domain part of from.
        use_auth:
          type: boolean
          default: false
          description: When true, SMTP AUTH runs with username/password; when false the message is sent anonymously.
        username: { type: string }
        password: { type: string }
    SMSSinkConfig:
      type: object
      required: [url, to]
      properties:
        url: { type: string, format: uri }
        to: { type: string, description: Recipient phone number. }
        number_field:
          type: string
          default: to
          description: Provider JSON field carrying the number.
        message_field:
          type: string
          default: text
          description: Provider JSON field carrying the text.
        headers:
          type: object
          additionalProperties: { type: string }
    EgressEnvelope:
      type: object
      required: [id, tenant_id, device_id, ts, data]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        ts: { type: integer, format: int64 }
        trace_id: { type: string }
        data:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
    ForwarderDeadLetter:
      type: object
      required: [id, tenant_id, forwarder_id, payload, error, attempts,
                 created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        forwarder_id: { type: string, format: uuid }
        payload:
          $ref: "#/components/schemas/EgressEnvelope"
        error: { type: string }
        attempts: { type: integer }
        last_tried_at: { type: string, format: date-time }
        replayed_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    ForwarderDelivery:
      type: object
      required: [id, tenant_id, forwarder_id, status, code, attempts,
                 occurred_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        forwarder_id: { type: string, format: uuid }
        envelope_id: { type: string }
        device_id: { type: string }
        status:
          type: string
          enum: [delivered, retry, terminal]
        code:
          type: integer
          description: Receiver return code (e.g. HTTP status); 0 if none.
        reason: { type: string }
        attempts: { type: integer }
        occurred_at: { type: string, format: date-time }
    CompanionEndpoint:
      type: object
      required: [id, companion_id, gateway_id, base_url, contract_version,
                 auth_token_set, insecure_skip_verify, enabled,
                 created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        companion_id:
          type: string
          description: Logical companion id from the business assembly node.
        gateway_id:
          type: string
          description: Target gateway device UUID used by business camera assets.
        base_url:
          type: string
          format: uri
          description: Companion installation root URL (http or https).
        contract_version:
          type: string
          enum: [companion-subscription/v1]
        auth_token_set:
          type: boolean
          description: Whether a bearer token is stored; the token itself is never returned.
        insecure_skip_verify: { type: boolean }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CompanionEndpointWrite:
      type: object
      required: [companion_id, gateway_id, base_url, auth_token]
      properties:
        companion_id:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,127}$"
        gateway_id:
          type: string
          pattern: "^[a-z0-9][a-z0-9._-]{0,127}$"
        base_url:
          type: string
          format: uri
          description: Absolute http(s) URL; trailing slashes are normalized.
        contract_version:
          type: string
          enum: [companion-subscription/v1]
          description: Defaults to companion-subscription/v1 when omitted.
        auth_token:
          type: string
          description: >-
            Bearer token issued by the companion installation. Required at
            registration; on update, omit to keep the stored token or send an
            empty string to clear it.
        insecure_skip_verify:
          type: boolean
          description: Only valid for https endpoints.
        enabled: { type: boolean }
    CompanionDesiredSubscription:
      type: object
      required: [id, source_device, camera, pipeline_id, conclusion_device_id,
                 enabled, artifact_key, revision, status, reason]
      properties:
        id:
          type: string
          description: Deterministic row id companion:<gateway>:<conclusionDevice>:<sourceDevice>.
        source_device: { type: string }
        camera: { type: string }
        pipeline_id: { type: string }
        conclusion_device_id: { type: string }
        enabled: { type: boolean }
        artifact_key:
          type: string
          description: Business artifact that owns the row.
        revision:
          type: integer
          format: int64
          description: Last companion-reported monotonic revision; 0 before first read-back.
        status:
          type: string
          enum: [PENDING, APPLIED, FAILED]
        reason:
          type: string
          description: Kebab-case companion failure reason; empty when APPLIED.
    TelemetryDLQ:
      type: object
      required: [id, time, tenant_id, device_id, measurement_key, point,
                 hook_name, reason]
      properties:
        id: { type: integer, format: int64 }
        time: { type: string, format: date-time }
        tenant_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        measurement_key: { type: string }
        point:
          type: object
          additionalProperties: true
        hook_name: { type: string }
        reason: { type: string }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/Error"
    PaginationEnvelope:
      type: object
      required: [items, total, page, page_size, total_pages]
      properties:
        items:
          type: array
        total: { type: integer }
        page: { type: integer }
        page_size: { type: integer }
        total_pages: { type: integer }
    CommandRecord:
      type: object
      required: [id, device_id, name, interaction, timeliness, params, state, created_at]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        name: { type: string }
        interaction:
          type: string
          enum: [one-way, request-response]
        timeliness:
          type: string
          enum: [realtime, persistent]
        direction:
          type: string
          enum: [read, write]
          description: Empty for commands created before direction tracking.
        params: { type: string }
        state:
          type: string
          enum: [PENDING, CLAIMED, QUEUED, DELIVERED, SUCCEEDED, FAILED,
                 TIMEOUT, NOT_CONNECTED, EXPIRED]
        response: { type: string }
        error: { type: string }
        created_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    DeviceAttribute:
      type: object
      required: [scope, key, value, updated_at]
      properties:
        scope:
          type: string
          enum: [CLIENT, SERVER_SCOPE, SHARED_SCOPE]
        key: { type: string }
        value: {}
        updated_at: { type: string, format: date-time }
    DeviceAttributeWrite:
      type: object
      required: [scope, key, value]
      properties:
        scope:
          type: string
          enum: [SERVER_SCOPE, SHARED_SCOPE]
        key: { type: string }
        value: {}
    DeviceEvent:
      type: object
      required: [id, tenant_id, device_id, time, event_type, severity, payload]
      properties:
        id: { type: integer, format: int64 }
        tenant_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        time: { type: string, format: date-time }
        event_type: { type: string }
        severity:
          type: string
          enum: [info, warning, error, critical]
        payload:
          type: object
          description: Tenant-defined opaque JSON object.
          additionalProperties: true
    TelemetryHistory:
      type: object
      required: [time, measurement_key, quality]
      properties:
        time: { type: string, format: date-time }
        measurement_key: { type: string }
        v_double: { type: number }
        raw_value: { type: number }
        unit: { type: string }
        descriptor_version: { type: integer }
        v_string: { type: string }
        v_bool: { type: boolean }
        quality: { type: string }
    TelemetryKey:
      type: object
      required: [measurement_key, value_type, time]
      properties:
        measurement_key: { type: string }
        value_type:
          type: string
          enum: [number, boolean, string]
        unit: { type: string }
        time: { type: string, format: date-time }
        v_double: { type: number }
        v_bool: { type: boolean }
        v_string: { type: string }
    TelemetrySeriesPoint:
      type: object
      required: [time, value_type]
      properties:
        time: { type: string, format: date-time }
        value_type:
          type: string
          enum: [number, boolean, string]
        v_double: { type: number }
        v_bool: { type: boolean }
        v_string: { type: string }
    PresenceSnapshotDevice:
      type: object
      required: [device_id, ingress_id, session_id]
      properties:
        device_id: { type: string, format: uuid }
        ingress_id: { type: string }
        session_id: { type: string }
        gateway_id: { type: string }
    PresenceSnapshot:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/PresenceSnapshotDevice"
    Notification:
      type: object
      required: [notification_id, tenant_id, severity, title, state, created_at]
      properties:
        notification_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        alarm_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        severity:
          type: string
          enum: [CRITICAL, MAJOR, MINOR, WARNING]
        title: { type: string }
        body: { type: string }
        state:
          type: string
          enum: [NEW, READ]
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time }
    CommandRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Command name declared in the device Command Catalog.
        direction:
          type: string
          enum: [read, write]
          description: |
            South-side operation to perform. Must be allowed by the catalog
            entry's read/write mask. Empty defaults to read when the entry
            allows reads, otherwise write.
        params:
          type: object
          description: Command parameters as a JSON document. Sent for both
            read and write commands (a read may carry query parameters).
          additionalProperties: true
        timeout_ms:
          type: integer
          format: int64
          description: Optional override of the catalog default timeout.
    CommandCatalogEntry:
      type: object
      required: [name, interaction, timeliness, allow_read, allow_write]
      properties:
        name:
          type: string
          description: Whitelisted command name (wire method/resource name).
        interaction:
          type: string
          enum: [one-way, request-response]
          description: A read-permitting entry must be request-response.
        timeliness:
          type: string
          enum: [realtime, persistent]
        default_timeout_ms:
          type: integer
          format: int64
          description: Response wait when the caller omits a timeout. 0 uses
            the platform default.
        allow_read:
          type: boolean
          description: The name may be dispatched as a read.
        allow_write:
          type: boolean
          description: The name may be dispatched as a write.
        enabled:
          type: boolean
          description: Disabled entries reject dispatch but remain stored.
        source:
          type: string
          enum: [manual, auto]
          description: manual = operator-declared; auto = materialized from
            the bound profile's read/write points.
        description:
          type: string
        created_at:
          type: string
          format: date-time
    CommandCatalogList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CommandCatalogEntry"
    CommandCatalogInput:
      type: object
      required: [name, interaction, timeliness, allow_read, allow_write]
      properties:
        name: { type: string, maxLength: 128 }
        interaction: { type: string, enum: [one-way, request-response] }
        timeliness: { type: string, enum: [realtime, persistent] }
        default_timeout_ms: { type: integer, format: int64, minimum: 0 }
        allow_read: { type: boolean }
        allow_write: { type: boolean }
        enabled: { type: boolean }
        description: { type: string, maxLength: 512 }
    CommandResult:
      type: object
      required: [command_id, status]
      properties:
        command_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, DELIVERED, SUCCEEDED, FAILED, TIMEOUT, NOT_CONNECTED, EXPIRED]
        response:
          description: Raw JSON device response.
        error:
          type: string
          description: Machine-readable failure detail.
    Breakpoint:
      type: object
      required: [x, y]
      properties:
        x: { type: number }
        y: { type: number }
    Descriptor:
      type: object
      required: [measurement_key, transform_type]
      properties:
        id: { type: string, format: uuid }
        measurement_key: { type: string }
        unit: { type: string }
        transform_type:
          type: string
          enum: [identity, linear, table, expression, enum]
        scale: { type: number, default: 1 }
        offset: { type: number, default: 0 }
        breakpoints:
          type: array
          items:
            $ref: "#/components/schemas/Breakpoint"
        enum_map:
          type: object
          additionalProperties: { type: string }
        expression: { type: string }
        precision: { type: integer, default: -1 }
        valid_min: { type: number }
        valid_max: { type: number }
        version: { type: integer }
        # ADR-0014 online-but-silent monitoring. A positive expected period
        # (seconds) enables detection for devices using this profile; absent
        # or null leaves the point unmonitored. The deadline is
        # expected_period_seconds * tolerance_multiplier (default 3).
        expected_period_seconds:
          type: integer
          minimum: 1
          nullable: true
        tolerance_multiplier: { type: number, minimum: 1, default: 3 }
        # Edge/spec-owned neutral point fields (ADR-0032). data_type/
        # read_write/edge_* are vendor-owned on edge/import profiles (console
        # writes ignored there); address and unit remain operator-writable on
        # every source.
        data_type:
          type: string
          enum: [bool, int, uint, float, string, binary]
        read_write: { type: string, enum: ["", R, W, RW] }
        address:
          type: object
          additionalProperties: true
          description: Opaque per-protocol point addressing (e.g. Modbus primaryTable/startingAddress); kernel does not parse it. Operator-writable on every profile source; an edge replay overwrites it only when non-empty.
        edge_default: { type: string }
        edge_min: { type: number }
        edge_max: { type: number }
        inactive:
          type: boolean
          description: Point removed on the edge but retained for history/rule references.
    DescriptorWrite:
      allOf:
        - $ref: "#/components/schemas/Descriptor"
    Profile:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        rule_chain_group_id: { type: string, format: uuid }
        source:
          type: string
          enum: [edge, import, manual]
          description: Where the profile content came from.
        protocol:
          type: string
          description: Open-vocabulary protocol family ("" unknown). Drives family compatibility with connector types.
        content_hash: { type: string }
        edge_payload:
          type: object
          additionalProperties: true
          description: Verbatim reported/imported profile document.
        availability:
          type: string
          enum: [discovered, active]
          description: discovered = reported/imported but not referenced; active = used by a device/connector.
        descriptors:
          type: array
          items:
            $ref: "#/components/schemas/Descriptor"
        connector_type:
          type: string
          description: When set, this profile also supplies a connector template; empty means descriptors only.
        connector_type_version: { type: string }
        connector_config_template:
          type: object
          additionalProperties: true
          description: Default connector config deep-merged under per-instance overrides.
        connector_mappings:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key:
                type: string
                minLength: 1
            additionalProperties: true
          description: Default point mapping list for instances of this template; each item must carry a non-empty string `key`.
    ProfileWrite:
      type: object
      required: [name]
      properties:
        name: { type: string }
        rule_chain_group_id: { type: string, format: uuid }
        protocol:
          type: string
          maxLength: 64
          description: Optional open-vocabulary protocol family. Writable on EVERY profile source, including edge/import (a discovery frame commonly omits the family); edge ingest adopts a reported family only when it is non-empty.
        descriptors:
          type: array
          items:
            $ref: "#/components/schemas/DescriptorWrite"
        connector_type:
          type: string
          description: Set to make this profile a connector template; requires connector_config_template to be an object when present.
        connector_type_version: { type: string }
        connector_config_template:
          type: object
          additionalProperties: true
          default: {}
        connector_mappings:
          type: array
          items:
            type: object
            required: [key]
            properties:
              key:
                type: string
                minLength: 1
            additionalProperties: true
          default: []
    ProfileImportRequest:
      type: object
      required: [document]
      properties:
        document:
          description: >-
            A vendor-neutral NL profile ({name, protocol?, points[]}) or an
            EdgeX DeviceProfile (deviceResources[]).
          oneOf:
            - $ref: "#/components/schemas/NeutralProfileDocument"
            - type: object
              additionalProperties: true
    NeutralProfileDocument:
      type: object
      required: [name, points]
      properties:
        name: { type: string }
        protocol: { type: string }
        description: { type: string }
        labels:
          type: array
          items: { type: string }
        points:
          type: array
          items:
            type: object
            required: [name, type]
            properties:
              name: { type: string }
              type:
                type: string
                enum: [bool, int, uint, float, string, binary]
              unit: { type: string }
              read_write: { type: string, enum: [R, W, RW] }
              min: { type: number }
              max: { type: number }
              default: { type: string }
              description: { type: string }
              address:
                type: object
                additionalProperties: true
        commands:
          type: array
          items:
            type: object
            required: [name]
            properties:
              name: { type: string }
              points:
                type: array
                items: { type: string }
    ProfileImportResult:
      type: object
      properties:
        profile_id: { type: string, format: uuid }
        point_count: { type: integer }
        warnings:
          type: array
          items: { type: string }
    Customer:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        contact_name: { type: string }
        contact_email: { type: string }
        external_id: { type: string }
    CustomerWrite:
      type: object
      required: [name]
      properties:
        name: { type: string }
        contact_name: { type: string }
        contact_email: { type: string }
        external_id: { type: string }
    DeviceGroup:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid }
        name: { type: string }
    DeviceGroupWrite:
      type: object
      required: [name]
      properties:
        customer_id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid }
        name: { type: string }
    ClaimTokenResult:
      type: object
      required: [device_id, token, expires_at]
      properties:
        device_id: { type: string, format: uuid }
        token:
          type: string
          description: Single-use plaintext claim token; never stored.
        expires_at: { type: string, format: date-time }
    ClaimRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
        customer_id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
    TransferRequest:
      type: object
      required: [customer_id, reset_credentials, alarm_policy]
      properties:
        customer_id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        reset_credentials: { type: boolean }
        alarm_policy:
          type: string
          enum: [retain, clear]
    Device:
      type: object
      required: [id, canonical_name, state]
      properties:
        id: { type: string, format: uuid }
        canonical_name: { type: string }
        profile_id: { type: string, format: uuid }
        rule_chain_group_id: { type: string, format: uuid }
        customer_id:
          type: string
          format: uuid
          description: Owning customer; absent when unassigned.
        group_id:
          type: string
          format: uuid
          description: Assigned device group.
        is_gateway:
          type: boolean
          description: Whether this device may host passive sub-devices.
        gateway_id:
          type: string
          format: uuid
          description: Gateway that hosts this sub-device; absent for direct devices.
        gateway_name:
          type: string
          description: Canonical name of the owning gateway; present when bound.
        connector_id:
          type: string
          format: uuid
          description: Spec id of the connector instance bound to this sub-device (at most one per device); absent when none.
        connector_type:
          type: string
          description: Type of the bound connector instance.
        connector_state:
          type: string
          enum: [PENDING, DISPATCHED, CREATING, APPLIED, DEGRADED, FAILED]
          description: Last reported apply state of the bound connector instance.
        gateway_connector_count:
          type: integer
          description: Number of gateway-level (non-bound) connector instances on this device; populated for gateways, omitted when zero.
        firmware_version:
          type: string
          description: Firmware version last reported after a successful OTA rollout (ADR-0006b); absent when never reported.
        agent_features:
          type: array
          items: { type: string }
          description: Features negotiated in the gateway's last successful hello (ADR-0034); "secrets" marks secret delivery support.
        state:
          type: string
          enum: [UNCLAIMED, ACTIVE, DECOMMISSIONED, ARCHIVED, QUARANTINED]
          description: Lifecycle state. Only ACTIVE devices authenticate and accept commands.
        claimed_at:
          type: string
          format: date-time
        decommissioned_at:
          type: string
          format: date-time
        recall_until:
          type: string
          format: date-time
          description: End of the reactivation window.
        presence_state:
          type: string
          enum: [ONLINE, OFFLINE]
          description: Latest boundary state from presence history; absent when the device never connected.
        presence_since:
          type: string
          format: date-time
          description: When the current presence state began (RFC3339 UTC).
        created_at:
          type: string
          format: date-time
          description: When the device row was created (RFC3339 UTC); the list is ordered by this descending.
        updated_at:
          type: string
          format: date-time
          description: When the device row was last edited (RFC3339 UTC).
        alias:
          type: string
          maxLength: 255
          description: Optional operator-defined human-friendly display name; carries no identity meaning.
        notes:
          type: string
          maxLength: 4096
          description: Optional free-form additional information (location, contact, remarks).
        last_activity_at:
          type: string
          format: date-time
          description: "Most recent activity (RFC3339 UTC): latest telemetry or presence boundary, whichever is newer; absent when there is none."
    DeviceWrite:
      type: object
      required: [canonical_name]
      properties:
        canonical_name:
          type: string
          maxLength: 255
          description: >
            Stable technical name, unique within the tenant and used for
            edge-side cross-checks. The interactive device form generates a
            `dev-`/`gw-` prefix plus a random letter/digit suffix (for example
            dev-a3f9k2x7); the inference binding wizard instead derives an
            `inference:` name from the source, model id and model-version hash
            so parallel variants remain distinct. The operator edits only the
            display alias; direct REST/SDK callers may supply any unique name.
            The console presents the canonical name as read-only after creation
            because it is the name cross-checked on the edge.
        profile_id: { type: string, format: uuid }
        rule_chain_group_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        is_gateway:
          type: boolean
          description: Grants the gateway topic set and the ability to attach sub-devices (ADR-0010).
        gateway_id:
          type: string
          format: uuid
          description: Binds this sub-device to an ACTIVE gateway device.
        alias:
          type: string
          maxLength: 255
          description: Optional human-friendly display name. An empty string clears a stored alias.
        notes:
          type: string
          maxLength: 4096
          description: Optional free-form additional information. An empty string clears stored notes.
        state:
          type: string
          enum: [UNCLAIMED, ACTIVE]
          description: Pre-register as UNCLAIMED to require a claim token; defaults to ACTIVE.
    Credential:
      type: object
      required: [id, type, credentials_id, status]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [TOKEN, PASSWORD, X509, JWT]
        credentials_id: { type: string }
        status:
          type: string
          enum: [ACTIVE, DISABLED, EXPIRED]
          description: EXPIRED is assigned by the hourly expiry scanner, never by clients.
        effective_at:
          type: string
          format: date-time
          description: Validity start; absent means effective from creation.
        expires_at:
          type: string
          format: date-time
          description: Validity end; absent means never expires.
        warn_level:
          type: string
          enum: ["", "30d", "7d", "1d", "expired"]
          description: Strongest expiry warning raised so far.
        credentials_value:
          type: string
          description: Present on create responses for server-generated TOKENs and on reveal responses.
        revealable:
          type: boolean
          description: False only for a PASSWORD held as an argon2id hash whose plaintext cannot be recovered.
        certificate_pem:
          type: string
          description: X509 certificate PEM on create/reveal responses.
        private_key_pem:
          type: string
          description: X509 device private key PEM on create/reveal responses.
        ca_pem:
          type: string
          description: Built-in CA PEM on an issued X509 create response.
    CredentialWrite:
      type: object
      required: [type, credentials_id]
      properties:
        type:
          type: string
          enum: [TOKEN, PASSWORD, X509, JWT]
        credentials_id: { type: string }
        credentials_value: { type: string }
        issue:
          type: boolean
          description: X509 only; true asks the built-in CA to issue a key and certificate.
        status:
          type: string
          enum: [ACTIVE, DISABLED]
          description: Initial state; defaults to ACTIVE.
        effective_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        extra:
          type: object
          description: >-
            JWT-only constraints as string pairs: `iss`, `sub`, `aud` pin
            claims, and `jwks_uri` selects remote asymmetric verification
            (RS256/ES256, key chosen by `kid`); with `jwks_uri` the
            `credentials_value` inline key may be omitted. `jwks_uri` must
            use https (loopback http is allowed).
          additionalProperties: { type: string }
          example:
            iss: issuer-a
            aud: tenant-x
            jwks_uri: https://issuer.example/.well-known/jwks.json
    CredentialStatusWrite:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, DISABLED]
          description: Disabling ends the device's live session.
    CredentialRotate:
      type: object
      properties:
        credentials_value:
          type: string
          description: Required for PASSWORD rotation; empty keeps the current secret.
        expires_at:
          type: string
          format: date-time
          description: New validity end; absent keeps the current one.
    TrustAnchor:
      type: object
      required: [id, label, fingerprint_sha256, pem, builtin, status]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
        subject_cn: { type: string }
        issuer_cn: { type: string }
        not_before:
          type: string
          format: date-time
          description: Certificate validity start, parsed from the stored PEM; empty if the PEM cannot be parsed.
        not_after:
          type: string
          format: date-time
          description: Certificate expiry, parsed from the stored PEM; empty if the PEM cannot be parsed.
        fingerprint_sha256: { type: string }
        pem: { type: string }
        builtin: { type: boolean }
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Alarm:
      type: object
      required: [alarm_id, device_id, alarm_type, severity, state, started_at]
      properties:
        alarm_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        alarm_type: { type: string }
        severity:
          type: string
          enum: [CRITICAL, MAJOR, MINOR, WARNING]
        state:
          type: string
          enum: [ACTIVE, ACK, CLEARED]
        dedupe_key: { type: string }
        details: { type: object, additionalProperties: true }
        started_at: { type: string, format: date-time }
        acked_at: { type: string, format: date-time }
        cleared_at: { type: string, format: date-time }
        assignee_id: { type: string, format: uuid }
        assignee_name: { type: string }
    AlarmComment:
      type: object
      required: [comment_id, alarm_id, author_id, author_name, body, created_at]
      properties:
        comment_id: { type: string, format: uuid }
        alarm_id: { type: string, format: uuid }
        author_id: { type: string, format: uuid }
        author_name: { type: string }
        body: { type: string }
        created_at: { type: string, format: date-time }
    AssignAlarmRequest:
      type: object
      properties:
        assignee_id:
          type: string
          format: uuid
          description: Empty value clears the current assignment.
    AlarmCommentRequest:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 2000 }
    AlarmPage:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/Alarm"
    BatchCommandTask:
      type: object
      required: [id, tenant_id, name, params, timeout_ms, target_type, state,
                 total_count, succeeded_count, failed_count, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        name: { type: string }
        params: { type: object, additionalProperties: true }
        timeout_ms: { type: integer }
        target_type:
          type: string
          enum: [group, devices]
        group_id: { type: string, format: uuid }
        state:
          type: string
          enum: [pending, running, completed, partial, failed]
        total_count: { type: integer }
        succeeded_count: { type: integer }
        failed_count: { type: integer }
        error: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    BatchCommandItem:
      type: object
      required: [id, task_id, tenant_id, device_id, state, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        command_id: { type: string, format: uuid }
        state:
          type: string
          enum: [pending, running, succeeded, failed]
        response: { type: object, additionalProperties: true }
        error: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    CreateBatchCommandRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        direction: { type: string, enum: [read, write] }
        params: { type: object, additionalProperties: true }
        timeout_ms: { type: integer }
        group_id: { type: string, format: uuid }
        device_ids:
          type: array
          items: { type: string, format: uuid }
    BatchCommandTaskPage:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/BatchCommandTask"
    BatchCommandItemPage:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/BatchCommandItem"
    CreateProbeRequest:
      type: object
      required: [devices]
      properties:
        devices:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
        mode:
          type: string
          enum: [cached, fresh, strict]
          default: fresh
          description: Probe freshness hint; forwarded to the edge verbatim.
        timeout_ms:
          type: integer
          format: int64
          default: 10000
    ProbeTask:
      type: object
      required: [id, tenant_id, mode, timeout_ms, state, total_count,
                 succeeded_count, failed_count, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        mode:
          type: string
          enum: [cached, fresh, strict]
        timeout_ms: { type: integer, format: int64 }
        gateway_id:
          type: string
          format: uuid
          description: Gateway the single-gateway task was created against.
        state:
          type: string
          enum: [pending, running, completed, partial, failed]
        total_count: { type: integer }
        succeeded_count: { type: integer }
        failed_count: { type: integer }
        error: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ProbeItem:
      type: object
      required: [id, task_id, tenant_id, gateway_id, device_id, state, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        gateway_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        state:
          type: string
          enum: [pending, running, succeeded, failed]
        result: { type: object, additionalProperties: true }
        error: { type: string }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    ProbeTaskPage:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ProbeTask"
    ProbeItemPage:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/ProbeItem"
    MyOtaAssignment:
      type: object
      required: [task_id, version, url, sha256, state]
      properties:
        task_id: { type: string, format: uuid }
        version: { type: string }
        url:
          type: string
          description: Relative authenticated download path on this server.
        sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        size: { type: integer, format: int64 }
        state:
          type: string
          enum: [pending, downloading, downloaded, updating]
    MyOtaProgress:
      type: object
      required: [state]
      properties:
        state:
          type: string
          description: |
            Ordered device phase. `updated`/`confirmed` semantics depend on the
            task success_policy: under device_reported an `updated` (or
            `succeeded`) frame finalizes; under confirmed_after_reboot the
            device must later send `confirmed` with the running version.
          enum: [initiated, downloading, downloaded, verified, updating,
                 updated, rebooting, confirmed, succeeded, failed]
        progress_pct:
          type: integer
          minimum: 0
          maximum: 100
        bytes:
          type: integer
          format: int64
          description: Package bytes received so far.
        result_code:
          type: string
          description: Structured failure/reason axis; omit for in-progress and successful frames.
          enum: [flash_full, out_of_ram, connection_lost, integrity_check_failed,
                 unsupported_type, model_mismatch, version_mismatch, invalid_uri,
                 apply_failed, reboot_timeout, download_no_progress,
                 already_current, unknown]
        message: { type: string }
        firmware_version:
          type: string
          description: Running version, required on the post-reboot `confirmed` frame under confirmed_after_reboot; matched against the task target.
    OTAPackage:
      type: object
      required: [version, url, sha256]
      properties:
        version:
          type: string
          description: Firmware version label.
        url:
          type: string
          format: uri
          description: Absolute http(s) URL the edge downloads the package from. NL never proxies the bytes.
        sha256:
          type: string
          pattern: '^[A-Fa-f0-9]{64}$'
          description: Mandatory lowercase/uppercase 64-hex-char digest enforced by the edge before applying.
        size:
          type: integer
          format: int64
          default: 0
          description: Package size in bytes.
        headers:
          type: object
          additionalProperties: { type: string }
          description: Extra HTTP headers (e.g. Authorization) sent on download.
    OTACreateRequest:
      type: object
      description: |
        Provide `firmware_id` for a platform-hosted package (ADR-0006b);
        otherwise `package` with an external URL is required. Provide either
        `devices` (explicit snapshot) or `selector` (dynamic fleet resolved
        once at creation), never both. `policy` configures canary batching,
        abort thresholds and watchdogs (ADR-0006d); omitted fields inherit the
        platform's safe defaults.
      properties:
        devices:
          type: array
          maxItems: 1000
          items: { type: string, format: uuid }
          description: Explicit target device list (mutually exclusive with selector).
        selector:
          $ref: "#/components/schemas/OTATargetSelector"
        firmware_id:
          type: string
          format: uuid
          description: Repository package id for a platform-hosted rollout; package is ignored when set.
        success_policy:
          type: string
          default: device_reported
          enum: [device_reported, confirmed_after_reboot]
          description: |
            How a device reaches success. `device_reported` finalizes on the
            edge's own success report. `confirmed_after_reboot` keeps the item
            open after `updated` until the device reconnects and reports
            `confirmed` with firmware_version equal to the target.
        policy:
          $ref: "#/components/schemas/OTARolloutPolicy"
        package:
          $ref: "#/components/schemas/OTAPackage"
    OTATargetSelector:
      type: object
      description: |
        Dynamic fleet selector; non-empty dimensions are AND-combined. The
        result is resolved once at creation and snapshotted into items, so
        later membership changes never move a running rollout (max 1000
        targets, ADR-0006d §1).
      properties:
        profile_id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
    OTARolloutPolicy:
      type: object
      description: |
        Per-task canary/abort/watchdog configuration. Absent fields inherit
        the server defaults; explicitly null disables a watchdog. Both batch
        fields unset means a single full batch (legacy behaviour); they are
        mutually exclusive.
      properties:
        batch_percent:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: Percentage of targets opened per batch; the first batch opens immediately.
        batch_size:
          type: integer
          minimum: 1
          nullable: true
          description: Fixed number of targets opened per batch.
        batch_pause_seconds:
          type: integer
          minimum: 0
          default: 0
          description: Observation delay between a settled batch and opening the next.
        failure_abort_percent:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
          description: Abort when the failed share of settled devices reaches this rate (default 20).
        max_consecutive_failures:
          type: integer
          minimum: 1
          nullable: true
          description: Abort after this many consecutive failures (default 5).
        stall_timeout_seconds:
          type: integer
          minimum: 1
          nullable: true
          description: Fails a downloading item with no progress for this long (default 1800).
        confirm_timeout_seconds:
          type: integer
          minimum: 1
          nullable: true
          description: Fails a rebooting item unconfirmed for this long (default 7200).
    FirmwarePackage:
      type: object
      required: [id, name, version, filename, size_bytes, sha256, is_stable, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        profile_id:
          type: string
          format: uuid
          description: Binds the package to one device model; absent for a model-agnostic package.
        name:
          type: string
          description: Human-readable release name shown in the console (ADR-0006d §2).
        release_notes:
          type: string
          maxLength: 65536
          description: Optional free-text release notes.
        version: { type: string }
        filename: { type: string }
        content_type: { type: string }
        size_bytes: { type: integer, format: int64 }
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: Mandatory lowercase 64-hex-char digest enforced before applying.
        is_stable:
          type: boolean
          description: Marks the recommended rollback target; exactly one package per (tenant, model scope) can be stable.
        created_by: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    FirmwarePage:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/FirmwarePackage"
    FirmwarePresignedDownload:
      type: object
      required: [url, filename, version]
      properties:
        url:
          type: string
          format: uri
          description: Short-lived operator presigned URL for browser download (never used by devices).
        filename: { type: string }
        version: { type: string }
    FirmwareUpload:
      type: object
      required: [file, name, version]
      description: multipart/form-data; metadata text parts must precede the `file` part so the server can stream the artifact.
      properties:
        name:
          type: string
          description: Required human-readable release name (ADR-0006d §2).
        release_notes:
          type: string
          maxLength: 65536
          description: Optional release notes.
        version: { type: string }
        filename: { type: string }
        profile_id: { type: string, format: uuid }
        content_type: { type: string }
        is_stable: { type: boolean, default: false }
        file:
          type: string
          format: binary
    OTATask:
      type: object
      required: [id, tenant_id, firmware_version, package_url, package_sha256,
                 package_size, state, success_policy, total_count, succeeded_count,
                 failed_count, created_at]
      properties:
        id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        created_by: { type: string, format: uuid }
        firmware_id:
          type: string
          format: uuid
          description: Set for a platform-hosted rollout; absent for an external-URL task.
        firmware_version: { type: string }
        package_url:
          type: string
          description: Absolute external URL, or the relative authenticated relay path for hosted packages.
        package_sha256: { type: string }
        package_size: { type: integer, format: int64 }
        headers:
          type: object
          additionalProperties: { type: string }
        state:
          type: string
          enum: [pending, running, paused, completed, partial, failed, aborted, canceled]
        success_policy:
          type: string
          enum: [device_reported, confirmed_after_reboot]
        target_mode:
          type: string
          enum: [explicit, selector]
          description: explicit UUID list, or a snapshot resolved from target_selector.
        target_selector:
          $ref: "#/components/schemas/OTATargetSelector"
        policy:
          $ref: "#/components/schemas/OTARolloutPolicy"
        batch_no:
          type: integer
          description: Highest batch number currently open (0 for a single full batch).
        next_batch_at:
          type: string
          format: date-time
          description: When the next deferred batch opens after the observation pause.
        abort_reason:
          type: string
          description: Set when the rollout was auto-aborted by an abort threshold.
        total_count: { type: integer }
        succeeded_count: { type: integer }
        failed_count: { type: integer }
        canceled_count: { type: integer }
        skipped_count: { type: integer }
        error: { type: string }
        created_at: { type: string, format: date-time }
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    OTAPhase:
      type: string
      description: Ordered per-device phase. confirmed is a report-only phase (normalized to succeeded on a version match).
      enum: [pending, initiated, downloading, downloaded, verified, updating,
             updated, rebooting, confirmed, succeeded, failed, canceled, skipped]
    OTAResultCode:
      type: string
      enum: [none, flash_full, out_of_ram, connection_lost, integrity_check_failed,
             unsupported_type, model_mismatch, version_mismatch, invalid_uri,
             apply_failed, reboot_timeout, download_no_progress, already_current,
             canceled, unknown]
    OTAEvent:
      type: object
      required: [id, task_id, tenant_id, device_id, seq, phase, progress_pct, source, created_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        gateway_id:
          type: string
          format: uuid
          description: Owning gateway for a sub-device; empty for a direct device.
        seq:
          type: integer
          format: int64
          description: Monotonic per (task, device), starting at 0 for the platform queued event.
        phase: { $ref: "#/components/schemas/OTAPhase" }
        result_code: { $ref: "#/components/schemas/OTAResultCode" }
        progress_pct: { type: integer, minimum: 0, maximum: 100 }
        bytes_received: { type: integer, format: int64 }
        message: { type: string }
        source:
          type: string
          enum: [platform, device, gateway]
        created_at: { type: string, format: date-time }
    OTAEventPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/OTAEvent"
    OTACancelResult:
      type: object
      required: [task, still_applying_count]
      properties:
        task:
          $ref: "#/components/schemas/OTATask"
        still_applying_count:
          type: integer
          description: Devices already applying that cancel could not stop; their final result is still collected.
    OTAItem:
      type: object
      required: [id, task_id, tenant_id, device_id, state,
                 progress_pct, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        task_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        gateway_id:
          type: string
          format: uuid
          description: Owning gateway for a sub-device; empty for a directly connected device.
        device_id: { type: string, format: uuid }
        state: { $ref: "#/components/schemas/OTAPhase" }
        result_code: { $ref: "#/components/schemas/OTAResultCode" }
        progress_pct:
          type: integer
          minimum: 0
          maximum: 100
        bytes_received: { type: integer, format: int64 }
        batch_no:
          type: integer
          description: Opened batch number (0 for a single full batch). Deferred batches never appear in item responses.
        message: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
    OTATaskPage:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/OTATask"
    OTAItemPage:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/OTAItem"
    OTADeviceItem:
      type: object
      description: One rollout row from a single device's point of view; the OTA item joined to its parent task.
      allOf:
        - $ref: "#/components/schemas/OTAItem"
        - type: object
          required: [firmware_version, task_state]
          properties:
            firmware_version:
              type: string
              description: Target firmware version carried by the parent task.
            task_state:
              type: string
              enum: [pending, running, paused, completed, partial, failed, aborted, canceled]
              description: Aggregate state of the parent rollout.
    OTADeviceItemPage:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/OTADeviceItem"
    CommandRecordPage:
      allOf:
        - $ref: "#/components/schemas/PaginationEnvelope"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/CommandRecord"
    SystemSnapshot:
      type: object
      required: [generated_at, uptime_sec, go, postgres, nats, streams, broker]
      properties:
        generated_at: { type: string, format: date-time }
        uptime_sec: { type: integer }
        go:
          $ref: "#/components/schemas/GoRuntimeStats"
        postgres:
          $ref: "#/components/schemas/PostgresStats"
        nats:
          $ref: "#/components/schemas/NATSStats"
        streams:
          type: array
          items:
            $ref: "#/components/schemas/StreamStats"
        broker:
          $ref: "#/components/schemas/BrokerStats"
    GoRuntimeStats:
      type: object
      required: [goroutines, heap_alloc_bytes, sys_bytes, heap_objects,
                 next_gc_bytes, gc_cycles, last_gc_pause_ms]
      properties:
        goroutines: { type: integer }
        heap_alloc_bytes: { type: integer, format: int64 }
        sys_bytes: { type: integer, format: int64 }
        heap_objects: { type: integer, format: int64 }
        next_gc_bytes: { type: integer, format: int64 }
        gc_cycles: { type: integer }
        last_gc_pause_ms: { type: number }
    PostgresStats:
      type: object
      required: [max_connections, active_connections, total_connections,
                 idle_connections, acquire_total, tx_commit, tx_rollback,
                 block_hit_ratio, deadlocks]
      properties:
        max_connections: { type: integer }
        active_connections: { type: integer }
        total_connections: { type: integer }
        idle_connections: { type: integer }
        acquire_total: { type: integer, format: int64 }
        tx_commit: { type: integer, format: int64 }
        tx_rollback: { type: integer, format: int64 }
        block_hit_ratio: { type: number }
        deadlocks: { type: integer, format: int64 }
    NATSStats:
      type: object
      required: [in_msgs, out_msgs, in_bytes, out_bytes, reconnects]
      properties:
        in_msgs: { type: integer, format: int64 }
        out_msgs: { type: integer, format: int64 }
        in_bytes: { type: integer, format: int64 }
        out_bytes: { type: integer, format: int64 }
        reconnects: { type: integer, format: int64 }
    StreamStats:
      type: object
      required: [name, messages, bytes, first_seq, last_seq, consumer_count,
                 consumers]
      properties:
        name: { type: string }
        messages: { type: integer, format: int64 }
        bytes: { type: integer, format: int64 }
        first_seq: { type: integer, format: int64 }
        last_seq: { type: integer, format: int64 }
        consumer_count: { type: integer }
        consumers:
          type: array
          items:
            $ref: "#/components/schemas/ConsumerStats"
    ConsumerStats:
      type: object
      required: [name, pending, redelivered, ack_floor_seq]
      properties:
        name: { type: string }
        pending: { type: integer, format: int64 }
        redelivered: { type: integer, format: int64 }
        ack_floor_seq: { type: integer, format: int64 }
    BrokerStats:
      type: object
      required: [type, online_clients]
      properties:
        type: { type: string }
        online_clients: { type: integer }
    BusinessReport:
      type: object
      required: [range, since, generated_at, devices, telemetry, alarms,
                 commands, active_rule_chains]
      properties:
        range: { type: string, enum: [1h, 24h, 7d] }
        since: { type: string, format: date-time }
        generated_at: { type: string, format: date-time }
        devices:
          $ref: "#/components/schemas/DeviceBusiness"
        telemetry:
          $ref: "#/components/schemas/TelemetryBusiness"
        alarms:
          $ref: "#/components/schemas/AlarmBusiness"
        commands:
          $ref: "#/components/schemas/CommandBusiness"
        active_rule_chains: { type: integer }
    MetricBucket:
      type: object
      required: [time, count]
      properties:
        time: { type: string, format: date-time }
        count: { type: integer, format: int64 }
    DeviceBusiness:
      type: object
      required: [total, online, offline, by_profile]
      properties:
        total: { type: integer, format: int64 }
        online: { type: integer }
        offline: { type: integer, format: int64 }
        by_profile:
          type: array
          items:
            $ref: "#/components/schemas/MetricCount"
    TelemetryBusiness:
      type: object
      required: [total, series]
      properties:
        total: { type: integer, format: int64 }
        series:
          type: array
          items:
            $ref: "#/components/schemas/MetricBucket"
    AlarmBusiness:
      type: object
      required: [created, live, by_state, by_severity]
      properties:
        created: { type: integer, format: int64 }
        live: { type: integer, format: int64 }
        by_state:
          type: array
          items:
            $ref: "#/components/schemas/MetricCount"
        by_severity:
          type: array
          items:
            $ref: "#/components/schemas/MetricCount"
    CommandBusiness:
      type: object
      required: [created, by_state]
      properties:
        created: { type: integer, format: int64 }
        by_state:
          type: array
          items:
            $ref: "#/components/schemas/MetricCount"

    RuleChainGroup:
      type: object
      description: Stable chain identity with its version summary.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        is_default: { type: boolean }
        active_version:
          type: integer
          description: Active version number, or 0 when only drafts exist.
        active_chain_id: { type: string, format: uuid }
        latest_version: { type: integer }
        device_count:
          type: integer
          description: Number of devices directly bound to this group.
        profile_count:
          type: integer
          description: Number of profiles directly bound to this group.
        created_at: { type: string, format: date-time }
      required: [id, name, is_default, active_version, latest_version,
                 device_count, profile_count, created_at]

    RuleChainMeta:
      type: object
      required: [id, group_id, name, version, state, is_root, created_at]
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer }
        state:
          type: string
          enum: [DRAFT, ACTIVE, ARCHIVED]
        is_root: { type: boolean }
        created_at: { type: string, format: date-time }
    RuleNode:
      type: object
      required: [id, type, name, config]
      properties:
        id: { type: string }
        type:
          type: string
          enum:
            - script-filter
            - declarative-filter
            - time-window
            - debounce
            - sustained
            - switch
            - transform
            - save-attributes
            - create-alarm
            - clear-alarm
            - send-command
            - forward
            - log
            - delimiter
        name: { type: string }
        config:
          type: object
          additionalProperties: true
          description: >-
            Node-specific configuration. A forward node uses forwarder_id to
            select the JetStream stream and sink, optional fields as the
            whitelist, and optional channel as business envelope metadata
            propagated to egress.
        position_x: { type: number, nullable: true }
        position_y: { type: number, nullable: true }
    RuleEdge:
      type: object
      required: [from, to, relation]
      properties:
        from: { type: string }
        to: { type: string }
        relation: { type: string }
    RuleGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/RuleNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/RuleEdge"
    RuleGraphWrite:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items:
            $ref: "#/components/schemas/RuleNode"
        edges:
          type: array
          items:
            $ref: "#/components/schemas/RuleEdge"
    RuleChainDraftResponse:
      type: object
      required: [chain_id, graph]
      properties:
        chain_id: { type: string, format: uuid }
        graph:
          $ref: "#/components/schemas/RuleGraph"
    NodeCapture:
      type: object
      properties:
        time: { type: string, format: date-time }
        in: { type: object }
        out:
          type: array
          items: { type: object }
        duration_ms: { type: number }
        error: { type: string }
    NodeRecord:
      type: object
      properties:
        node_id: { type: string, format: uuid }
        node_type: { type: string }
        entered: { type: string, format: date-time }
        duration_ms: { type: number }
        outputs:
          type: array
          items: { type: string }
        error: { type: string }
    ChainTrace:
      type: object
      properties:
        trace_id: { type: string }
        chain_id: { type: string, format: uuid }
        started: { type: string, format: date-time }
        records:
          type: array
          items:
            $ref: "#/components/schemas/NodeRecord"
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          pattern: "^[A-Z]+(?:_[A-Z]+)*$"
          description: Global upper-snake-case error code, e.g. DEVICE_NOT_FOUND.
        message:
          type: string
        trace_id:
          type: string
        details:
          type: object
          additionalProperties: true
