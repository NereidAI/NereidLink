openapi: 3.1.0

# This file is the global REST API contract for NereidLink.
# It MUST be updated in the same change whenever an endpoint, request or
# response is modified.

info:
  title: NereidLink API
  version: v0.0.1
  description: |
    Enterprise on-premises IoT pipeline platform.

    Real-time data (telemetry, presence, alarms, notifications) is delivered
    exclusively through the WebSocket endpoint at `GET /ws`. REST is used only
    for one-off snapshots, historical ranges and configuration writes.
    Polling real-time state through REST is not supported.

servers:
  # Relative server URL so Swagger UI "Try it out" targets the same host the
  # documentation is served from, both locally and in a cluster behind TLS.
  - url: /

# Ordinary tenant REST routes accept either an interactive human/machine
# bearer JWT or a user-scoped X-Api-Key. Public and device routes override
# this with their own security, while credential-management routes stay
# bearer-only because they require an interactive human session.
security:
  - BearerAuth: []
  - APIKeyAuth: []

tags:
  - name: system
    description: Platform health and diagnostics.
  - name: platform
    description: Platform trust-anchor management.
  - name: overview
    description: Tenant operational dashboard aggregation.
  - name: business
    description: Business template, instance expansion, deployment, rollback and monitoring orchestration.
  - name: realtime
    description: WebSocket real-time channel.
  - name: commands
    description: Device command dispatch.
  - name: alarms
    description: Alarm lifecycle and audit snapshot.
  - name: dashboards
    description: User-defined dashboards.
  - name: escalations
    description: Alarm escalation chains.
  - name: connectors
    description: Edge connector desired/reported instance lifecycle (ADR-0026).
  - name: edge-profiles
    description: EdgeX device profiles reported by gateways and adopted as native profiles.
  - name: probes
    description: On-demand gateway probing tasks (ADR-0026).
  - name: ota
    description: Firmware OTA rollout tasks (ADR-0026) and platform-hosted firmware repository (ADR-0006b).
  - name: discovery
    description: Per-tenant/per-gateway gateway auto-provisioning policy (ADR-0026).
  - name: retention
    description: Per-tenant data retention policy and legal hold.
  - name: rules
    description: Rule-chain debug and test delivery.
  - name: rule-chains
    description: Rule-chain version and graph management.
  - name: profiles
    description: Device profile and measurement descriptor management.
  - name: devices
    description: Device registry management.
  - name: credentials
    description: Device credential management.
  - name: storage
    description: Pre-storage hooks and telemetry dead-letter queue.
  - name: notifications
    description: In-app notification inbox.
  - name: statistics
    description: System metrics and tenant business statistics.
  - name: device-ingest
    description: Device-facing HTTP ingest for telemetry uplink and command exchange.
  - name: modules
    description: Platform-level optional southbound protocol modules.
  - name: tenants
    description: Platform-level tenant lifecycle and provisioning status.
  - name: auth
    description: Local identity authentication (ADR-0021 fallback).
  - name: integration
    description: NereidSphere suite console integration endpoints.
  - name: audit
    description: Cross-tenant append-only audit log and hash-chain verification.
  - name: licenses
    description: Offline license state, tenant suspension and usage metering.
  - name: shadows
    description: Device desired/reported shadow state.
  - name: customers
    description: Customer ownership, device groups and device lifecycle (ADR-0013).
  - name: members
    description: >
      Tenant member accounts and roles. A platform administrator may manage
      every tenant; a TENANT_ADMIN may manage only their own tenant
      (members:admin point). Engineer/customer/read-only roles receive 403.
  - name: ops
    description: Cross-channel dual control of high-risk operation orders (ADR-0023).
  - name: forwarders
    description: Third-party data forwarding configuration and forwarder dead-letter queue (ADR-0018).
  - name: companion-endpoints
    description: >-
      Platform-neutral companion connector (companion-subscription/v1):
      endpoint registration plus desired/read-back subscription visibility.
      One generic connector serves every conformant companion service.
  - name: gateway-operations
    description: Gateway operation catalog and human-only synchronous operation execution (ADR-0035).

paths:
  /healthz:
    get:
      tags: [system]
      summary: Liveness probe
      operationId: getHealth
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            text/plain:
              schema:
                type: string
                enum: [ok]

  /metrics:
    get:
      tags: [system]
      summary: Prometheus metrics scrape endpoint
      description: |
        Exposes process and platform metrics in the Prometheus text exposition
        format (version 0.0.4). The endpoint is unauthenticated (exempt from
        the REST authorizer, like `/healthz`) and intended to be scraped by
        the deployment's Prometheus over a trusted network; do not expose it
        publicly.

        Every scrape gathers a fresh snapshot (Go runtime and process
        collectors plus NereidLink gauges), so the response must stay
        fast: collection has an internal timeout and the WebSocket fanout
        is deliberately kept off the scrape path.

        Metric families (`nereidlink_*` unless noted):
        - Go runtime: `go_goroutines`, `go_memstats_*`, `go_gc_*`,
          `go_threads`, ...
        - Process: `process_*` (CPU, memory, open FDs, ...).
        - HTTP instrumentation: `nereidlink_http_requests_total`
          (labels `method`, `route`, `code`),
          `nereidlink_http_request_duration_seconds` histogram,
          `nereidlink_http_requests_in_flight`.
        - Infrastructure gauges: `nereidlink_uptime_seconds`,
          `nereidlink_postgres_*`, `nereidlink_nats_*`,
          `nereidlink_jetstream_stream_*` /
          `nereidlink_jetstream_consumer_*` (label `stream`, and
          `consumer` where applicable), `nereidlink_mqtt_clients`.
        - Per-tenant gauges (label `tenant`): `nereidlink_devices_total`
          (excludes decommissioned tombstones),
          `nereidlink_devices_decommissioned`,
          `nereidlink_devices_online`, `nereidlink_devices_offline`,
          `nereidlink_alarms_live`, `nereidlink_commands_inflight`,
          `nereidlink_rule_chains_active`, `nereidlink_tenant_customers`,
          `nereidlink_tenant_device_groups`, `nereidlink_tenant_users`,
          `nereidlink_tenant_memberships`,
          `nereidlink_tenant_device_credentials`,
          `nereidlink_tenant_secrets`, `nereidlink_firmware_packages`.
        - Tasks: `nereidlink_tasks_total`, `nereidlink_tasks_active`
          (labels `tenant`, `kind` of `batch_command` | `probe` | `ota`).
        - Real-time: `nereidlink_ws_clients`.
      operationId: getMetrics
      security: []
      responses:
        "200":
          description: Prometheus text exposition document.
          content:
            text/plain; version=0.0.4; charset=utf-8:
              schema:
                type: string
                example: |
                  # HELP nereidlink_uptime_seconds Process uptime.
                  # TYPE nereidlink_uptime_seconds gauge
                  nereidlink_uptime_seconds 3600
                  # HELP go_goroutines Number of goroutines.
                  # TYPE go_goroutines gauge
                  go_goroutines 42

  /ws:
    get:
      tags: [realtime]
      summary: WebSocket real-time channel
      description: |
        Upgrades to a WebSocket connection. The connection uses a Bearer
        token supplied during the HTTP upgrade.

        Client-to-server control frames (JSON text):

        ```json
        {"op":"subscribe","id":"<local-id>",
          "resource":{"type":"telemetry","tenant":"<tenant-uuid>",
                      "devices":["<device-uuid>"]}}
        {"op":"unsubscribe","id":"<local-id>"}
        {"op":"resume","id":"<local-id>","cursor":"<seq>"}
        {"op":"reauth","token":"<new-access-token>"}
        ```

        `resource.tenant` names the tenant the subscription is opened
        against. A single-tenant principal may omit it (the only tenant is
        implied); a platform administrator holding several tenants must send
        it. A tenant the principal has no membership in is rejected.

        The same subscribe frame accepts type `presence`, `alarm`,
        `attribute`, `shadow`, `device_event` and `notification`, plus the
        tenant-wide task progress resources `command_task`, `probe_task` and
        `ota_task`, the tenant-wide `connector` resource for edge connector
        lifecycle changes, the tenant-wide `secret_binding` resource for edge
        secret delivery lifecycle changes, and the tenant-wide `member`
        resource for tenant member administration changes (platform
        administrators only; a non-admin subscription is rejected with
        `WS_UNSUPPORTED_SUBSCRIPTION`). For telemetry,
        presence, alarm, attribute, shadow and device_event, an empty
        `devices` array requests everything the caller may see: a
        tenant-wide member receives a true tenant wildcard, while a
        customer/group-scoped member's wildcard is materialized to only its
        visible devices. Real-time frames never cross tenant boundaries:
        every push is filtered by both the subscription's tenant and the
        caller's data scope. The `notification`, `*_task`, `connector`,
        `secret_binding` and `member` resources are tenant-scoped, so their
        `devices` filter is ignored and only the named tenant's events are
        pushed. An `attribute` frame
        carries one changed key after a committed upsert (`scope`, `key`,
        `value`, `updated_at`, `source` `server` for REST writes or `device`
        for device/rule writes); clients patch the attribute row keyed by
        `(scope,key)`. A `shadow` frame carries the complete post-commit
        shadow (`desired`, `reported`, `delta`, versions, `etag`, `in_sync`,
        `source` `server` for desired patches or `device` for reported
        state); clients replace their whole shadow view. A `connector` frame
        is a change notification (`kind` is `desired`, `deleted`, `status`
        or `manifest`); clients re-fetch the named gateway's connector list
        and reconcile view rather than mutating from the frame. A
        `secret_binding` frame is a change notification (`kind` is `desired`,
        `withdrawn` or `status`) and clients re-fetch the named gateway's
        secret binding list. A `member` frame is a change notification
        (`kind` is `created`, `roles`, `data_scope`, `enabled`, `disabled`
        or `removed`, with `user_id`); clients re-fetch the tenant's member
        list rather than mutating from the frame.

        Server-to-client frames:

        ```json
        {"type":"telemetry","id":"<local-id>","seq":1,
          "data":{"time":"<rfc3339>","device_id":"<uuid>",
                  "measurement_key":"temperature",
                  "v_double":21.5,"quality":"GOOD",
                  "raw_value":42.0,"unit":"C",
                  "descriptor_version":1}}
        {"type":"alarm","seq":2,"data":{"alarm_id":"<uuid>",
          "tenant_id":"<uuid>","device_id":"<uuid>","alarm_type":"HighTemperature",
          "severity":"MAJOR","state":"ACTIVE","started_at":"<rfc3339>"}}
        {"type":"error","data":{"code":"WS_INVALID_FRAME","message":"..."}}
        {"type":"notification","seq":3,"data":{"notification_id":"<uuid>",
          "tenant_id":"<uuid>","alarm_id":"<uuid>","device_id":"<uuid>",
          "severity":"MAJOR","title":"[MAJOR] HighTemperature",
          "state":"NEW","created_at":"<rfc3339>"}}
        {"type":"device_event","seq":4,"data":{"id":17,
          "tenant_id":"<uuid>","device_id":"<uuid>","time":"<rfc3339>",
          "event_type":"door_opened","severity":"warning","payload":{}}}
        {"type":"attribute","seq":5,"data":{"tenant_id":"<uuid>",
          "device_id":"<uuid>","scope":"CLIENT","key":"fw_state",
          "value":"ready","updated_at":"<rfc3339>","source":"device"}}
        {"type":"shadow","seq":6,"data":{"device_id":"<uuid>",
          "desired":{"mode":"fast"},"reported":{},"delta":{"mode":"fast"},
          "desired_version":3,"reported_version":2,"etag":"\"3\"",
          "in_sync":false,"updated_at":"<rfc3339>",
          "tenant_id":"<uuid>","source":"server"}}
        {"type":"secret_binding","seq":7,"data":{"kind":"withdrawn",
          "tenant_id":"<uuid>","gateway_id":"<uuid>",
          "secret_name":"mqtt-broker","revision":12}}
        {"type":"member","seq":8,"data":{"kind":"roles",
          "tenant_id":"<uuid>","user_id":"<uuid>",
          "actor_id":"<uuid>","at":"<rfc3339>"}}
        ```

        Subscriptions always name business resources, never NATS subjects.
        One connection may hold multiple subscriptions. Frames carry a
        monotonic sequence number used for resume after reconnection.
      operationId: connectWebSocket
      security:
        - BearerAuth: []
      parameters:
        - name: Authorization
          in: header
          required: false
          schema:
            type: string
            example: Bearer <access-token>
      responses:
        "101":
          description: Switching protocols to WebSocket.
        "400":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/business-templates:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [business]
      summary: List business templates
      description: Returns all business templates visible to the tenant. Requires `business:read`.
      operationId: listBusinessTemplates
      responses:
        "200":
          description: Business templates; an empty list is returned as [].
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessTemplate"
        "503":
          $ref: "#/components/responses/Error"
    post:
      tags: [business]
      summary: Create a business template
      description: >-
        Creates a versioned business template. Invalid template documents return
        400 and name conflicts return 409. Requires `business:write`.
      operationId: createBusinessTemplate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessTemplate"
      responses:
        "201":
          description: Created business template.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessTemplate"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/business-templates/import:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      tags: [business]
      summary: Import a business template pack
      description: >-
        Imports a YAML or JSON template pack. The body is either a bare
        BusinessTemplate document or a BusinessTemplatePack envelope with a
        `templates` array. Every template is validated first and the import is
        all-or-nothing: an in-pack duplicate or invalid document returns 400,
        and an existing id@version returns 409, before any row is written. The
        body is limited to 1 MiB. Requires `business:write`.
      operationId: importBusinessTemplates
      requestBody:
        required: true
        content:
          application/yaml:
            schema:
              oneOf:
                - $ref: "#/components/schemas/BusinessTemplate"
                - $ref: "#/components/schemas/BusinessTemplatePack"
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/BusinessTemplate"
                - $ref: "#/components/schemas/BusinessTemplatePack"
      responses:
        "201":
          description: Imported template versions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessTemplate"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/business-templates/export:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [business]
      summary: Export all business templates as one pack
      description: >-
        Streams every tenant template in a BusinessTemplatePack envelope.
        YAML is the default wire format; pass `?format=json` for JSON.
        Requires `business:read`.
      operationId: exportBusinessTemplates
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [yaml, json]
            default: yaml
      responses:
        "200":
          description: Portable template pack.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Suggested download filename (business-templates.yaml/.json).
          content:
            application/yaml:
              schema:
                $ref: "#/components/schemas/BusinessTemplatePack"
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessTemplatePack"
        "400":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/business-templates/{templateId}/versions/{version}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: templateId
        in: path
        required: true
        schema:
          type: string
        description: Stable custom template identifier.
      - name: version
        in: path
        required: true
        schema:
          type: string
        description: Immutable template version to delete.
    delete:
      tags: [business]
      summary: Delete an unreferenced business template version
      description: >-
        Deletes one version only when no business instance references it.
        Referenced versions return 409; an unknown version returns 404.
        Instance creation and deletion serialize on the template row so a
        reference cannot appear after the final reference check. Requires
        `business:write`.
      operationId: deleteBusinessTemplateVersion
      responses:
        "204":
          description: Template version deleted; no response body.
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/business-instances:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [business]
      summary: List business instances
      description: Returns all business instances in the tenant. Requires `business:read`.
      operationId: listBusinessInstances
      responses:
        "200":
          description: Business instances; an empty list is returned as [].
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BusinessInstance"
        "503":
          $ref: "#/components/responses/Error"
    post:
      tags: [business]
      summary: Create a business instance
      description: >-
        Creates an instance from a template and an assembly. Invalid documents
        return 400, missing template references return 404, and name conflicts
        return 409. Requires `business:write`.
      operationId: createBusinessInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessInstanceCreate"
      responses:
        "201":
          description: Created business instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessInstance"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/business-instances/{instanceId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: instanceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [business]
      summary: Get a business instance
      description: Requires `business:read`.
      operationId: getBusinessInstance
      responses:
        "200":
          description: Business instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessInstance"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    put:
      tags: [business]
      summary: Update a business instance
      description: >-
        Replaces the mutable instance document using expected_generation for
        optimistic concurrency. Invalid documents return 400; generation or
        name conflicts return 409. Requires `business:write`.
      operationId: updateBusinessInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessInstanceUpdate"
      responses:
        "200":
          description: Updated business instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessInstance"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"
    delete:
      tags: [business]
      summary: Delete a business instance
      description: Requires `business:write`.
      operationId: deleteBusinessInstance
      responses:
        "204":
          description: Business instance deleted.
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/business-instances/{instanceId}/validate:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: instanceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [business]
      summary: Validate a business instance
      description: >-
        Validates the current instance document and returns all reported issues.
        Invalid documents or generation values return 400. Requires
        `business:write`.
      operationId: validateBusinessInstance
      responses:
        "200":
          description: Validation report, including reports with blocking issues.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessValidationReport"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/business-instances/{instanceId}/expansion:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: instanceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [business]
      summary: Expand a business instance into deployment artifacts
      description: >-
        Returns the deterministic expansion for the requested generation. An
        invalid generation returns 400; an unknown instance or generation
        returns 404. Requires `business:read`.
      operationId: getBusinessInstanceExpansion
      parameters:
        - name: generation
          in: query
          required: false
          description: Positive instance generation to expand.
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Expanded artifact set.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessExpansion"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/business-instances/{instanceId}/deploy:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: instanceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [business]
      summary: Request deployment of a business instance
      description: >-
        Requests deployment of the expanded instance generation. Deployment
        preflight runs before any side effects and may reject unsigned pipeline
        or companion capabilities. Invalid documents or generations return 400,
        generation conflicts return 409, and an unwired required module returns
        503. Requires `business:write`.
      operationId: deployBusinessInstance
      responses:
        "200":
          description: Business instance after the deployment request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessInstance"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/business-instances/{instanceId}/undeploy:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: instanceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [business]
      summary: Request undeployment of a business instance
      description: >-
        Requests removal of the active deployment. Generation conflicts return
        409 and an unwired required module returns 503. Requires
        `business:write`.
      operationId: undeployBusinessInstance
      responses:
        "200":
          description: Business instance after the undeployment request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessInstance"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/business-instances/{instanceId}/rollback:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: instanceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [business]
      summary: Request rollback of a business instance
      description: >-
        Requests rollback to a retained generation. Invalid generations return
        400, unknown instances or generations return 404, and generation
        conflicts return 409. Requires `business:write`.
      operationId: rollbackBusinessInstance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BusinessRollbackRequest"
      responses:
        "200":
          description: Business instance after the rollback request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessInstance"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/business-instances/{instanceId}/monitor:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: instanceId
