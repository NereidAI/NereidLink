        the server generate a 16-character unambiguous password returned
        in generated_password exactly once.
      operationId: createMember
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantMemberRequest'
      responses:
        "201":
          description: Member created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTenantMemberResponse'
        "400":
          description: Invalid role, email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: Email already registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: Caller is neither a platform administrator nor a TENANT_ADMIN of this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

