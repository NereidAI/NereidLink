            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/ops/deadman/test:
    post:
      tags: [ops]
      summary: Send a synthetic report through the platform dead-man channel
      description: >-
        Ops admin listener only. Delivers one synthetic platform problem
        through the independent dead-man fallback channel (ADR-0019) so an
        operator can confirm the endpoint is reachable without provoking a
        real outage. It never touches tenant notification state. The body is
        optional; omitted fields fall back to a test code, subject and body.
      operationId: testOpsDeadmanChannel
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpsDeadmanTestRequest'
      responses:
        "200":
          description: Report accepted by the independent fallback channel.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: delivered
        "400":
          description: Malformed request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "502":
          description: The fallback channel rejected or could not deliver the report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "503":
          description: The dead-man fallback channel is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

