  /v1/tenants/{tenantId}/profiles/{profileId}/targets:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: profileId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [device-profiles]
      summary: List explicit distribution targets of a library profile
      description: >-
        Lists the gateways the library profile is explicitly handed to (the
        shared-library main path). Requires profile:read.
      operationId: listProfileTargets
      responses:
        "200":
          description: Targets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfileTarget" }
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [device-profiles]
      summary: Distribute a library profile to a gateway
      description: >-
        Adds an explicit distribution edge and republishes the gateway's
        full desired profile set. The profile content is referenced, never
        copied. Recorded even when the gateway firmware has not negotiated
        the profiles feature; delivery then waits for an upgrade. Requires
        profile:write.
      operationId: distributeProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileTargetWrite" }
      responses:
        "201":
          description: Updated targets.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfileTarget" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/profiles/{profileId}/targets/{gatewayId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: profileId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: gatewayId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [device-profiles]
      summary: Withdraw a library profile from a gateway
      description: >-
        Removes the explicit distribution edge. When no connector instance
        still references the profile on that gateway, a removal frame is
        sent and the delivery reaches REMOVED. Requires profile:write.
      operationId: withdrawProfileTarget
      responses:
        "204": { description: Withdrawal requested. }
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/profiles/{profileId}/deliveries:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: profileId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [device-profiles]
      summary: List delivery state of a library profile across gateways
      description: >-
        Returns one delivery row per gateway the profile is targeted at or
        referenced by. Requires profile:read.
      operationId: listProfileDeliveries
      responses:
        "200":
          description: Deliveries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProfileDelivery" }
        "403":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/gateways/{gatewayId}/operations/{operation}/invoke:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: gatewayId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: operation
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [gateway-operations]
      summary: Execute a gateway operation synchronously
      description: >-
        Executes one immediate whole-gateway action from the effective
        catalog and returns the terminal task. Risk comes exclusively from
        the descriptor: read executes directly, normal is confirmed in the
        console, and dangerous requires a human operator with a fresh
        one-time TOTP step-up (step_up_id) completed within the last five
        minutes; machine principals are refused with OPERATION_HUMAN_ONLY.
        Params are validated against the descriptor param_schema and may
        carry secret:// references resolved at the last mile; params and
        results are capped at 64KB and the wait at 60 seconds. timeout_ms,
        when supplied, may only shorten the descriptor default and is
        clamped to 100ms..60000ms; malformed params fail with
        OPERATION_PARAMS_INVALID. An offline gateway fails immediately with
        NOT_CONNECTED; operations are never queued. Requires
        edge_operation:exec.
      operationId: invokeGatewayOperation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OperationInvokeBody" }
      responses:
        "200":
          description: Terminal task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationTask" }
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "428":
          description: Step-up required.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/tenants/{tenantId}/gateways/{gatewayId}/operation-tasks:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: gatewayId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [gateway-operations]
      summary: List the newest operation tasks for a gateway
      description: >-
        Returns task history (newest first). Results are retained 90 days;
        the permanent evidence is the chained audit log. Requires
        edge_operation:read.
      operationId: listOperationTasks
      responses:
        "200":
          description: Tasks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/OperationTask" }
        "403":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/gateways/{gatewayId}/operation-tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: gatewayId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: taskId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [gateway-operations]
      summary: Get one operation task
      operationId: getOperationTask
      responses:
        "200":
          description: Task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OperationTask" }
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/gateways/{gatewayId}/operations:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: gatewayId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [gateway-operations]
      summary: List one gateway's own operation catalog
      description: >-
        Lists the descriptors the target gateway itself advertised (newest
        version per operation) plus tenant-private descriptors it does not
        advertise. Disabled rows are included with disabled=true. Requires
        edge_operation:read.
      operationId: listGatewayScopedOperations
      responses:
        "200":
          description: Gateway catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/GatewayOperation" }
        "403":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/gateways/{gatewayId}/edge-profiles:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: gatewayId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [edge-profiles]
      summary: List cached EdgeX profiles for a gateway
      description: >-
        Lists the EdgeX device profiles a connected gateway has reported on
        v1/gateway/profiles, de-duplicated by platform-computed content hash.
        Returns [] (never null) when the gateway has not reported a profile.
        Requires profile:read.
      operationId: listGatewayEdgeProfiles
      responses:
        "200":
          description: Cached edge profiles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EdgeProfile" }
        "403":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/gateways/{gatewayId}/edge-profiles/{name}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: gatewayId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: name
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [edge-profiles]
      summary: Get one cached EdgeX profile with its raw resources
      description: >-
        Returns the cached profile metadata plus every reported deviceResource
        in report order with its adopt decision: translatable scalar resources
        carry translatable=true, while Binary/array/object and duplicate/empty
        resources carry translatable=false and a skip_reason. Read-only; it does
        not adopt. Requires profile:read.
      operationId: getGatewayEdgeProfile
      responses:
        "200":
          description: Cached edge profile detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeProfileDetail" }
        "404":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/gateways/{gatewayId}/edge-profiles/{name}/adopt:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: gatewayId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: name
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [edge-profiles]
      summary: Adopt a cached EdgeX profile as a native profile
      description: >-
        Translates the cached profile's scalar deviceResources into identity
        measurement descriptors and creates a native device profile. With no
        same-name native profile it is created (201); when this cache row
        already owns it, the call is an idempotent no-op (200). Any other
        same-name native profile conflicts (409) unless mode is "update"
        (replace descriptors, preserving connector template and rule-chain
        group) or target_name adopts under a different name. Binary, array
        and object value types are skipped but remain in the cached payload.
        Requires profile:write.
      operationId: adoptGatewayEdgeProfile
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EdgeProfileAdoptRequest" }
      responses:
        "200":
          description: Existing profile reused/updated or idempotent no-op.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeProfileAdoptResult" }
        "201":
          description: Native profile created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeProfileAdoptResult" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/connector-schemas:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [connectors]
      summary: List edge-registered connector config schemas
      description: >-
        Returns the draft-2020-12 JSON Schemas an edge has registered for the
        connector types/versions it supports during hello (migration 0043).
        The console uses them to render schema-aware connector config forms.
        Returns [] (never null) when no edge has registered a schema.
        Requires connector:read.
      operationId: listConnectorSchemas
      responses:
        "200":
          description: Registered connector config schemas.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectorSchema" }
        "403":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/edge-secret-types:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [credentials]
      summary: List edge secret type descriptors
      description: >-
        Returns the descriptors for credentials delivered to gateways
        (ADR-0034): edge-advertised descriptors (source=edge, read-only) and
        tenant-defined descriptors (source=manual). Each descriptor carries
        the draft-2020-12 fields schema the console renders credential forms
        from. Requires edge_secret:read.
      operationId: listEdgeSecretTypes
      responses:
        "200":
          description: Descriptor catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/EdgeSecretType" }
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [credentials]
      summary: Create a tenant-defined edge secret type
      operationId: createEdgeSecretType
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EdgeSecretTypeWrite" }
      responses:
        "201":
          description: Descriptor created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeSecretType" }
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/edge-secret-types/{type}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: type
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: query
        required: false
        description: Descriptor version; empty selects the unversioned row.
        schema: { type: string }
    get:
      tags: [credentials]
      summary: Get one edge secret type descriptor
      operationId: getEdgeSecretType
      responses:
        "200":
          description: Descriptor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeSecretType" }
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [credentials]
      summary: Replace a tenant-defined edge secret type
      operationId: updateEdgeSecretType
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EdgeSecretTypeWrite" }
      responses:
        "200":
          description: Descriptor updated.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeSecretType" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
    delete:
      tags: [credentials]
      summary: Delete a tenant-defined edge secret type
      operationId: deleteEdgeSecretType
      responses:
        "204":
          description: Descriptor deleted.
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [credentials]
      summary: Clone an edge descriptor into a tenant-defined type
      operationId: cloneEdgeSecretType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_type]
              properties:
                new_type: { type: string }
      responses:
        "201":
          description: Manual clone created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EdgeSecretType" }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/step-up/challenges:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      tags: [auth]
      summary: Start an operation-time step-up challenge
      description: >-
        Creates a 5-minute, single-use step-up challenge for a registered
        action (ADR-0035, migration 0068). The caller must be a human
        principal holding the action's permission point; service accounts are
        rejected. The response carries the signed QR payload describing the
        action, its details hash and the expiry. The TOTP code itself is
        submitted to the verify sub-resource.
      operationId: startStepUpChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepUpStart" }
      responses:
        "201":
          description: Pending challenge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepUpChallenge" }
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/step-up/challenges/{challengeId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: challengeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [auth]
      summary: Complete a step-up challenge with a current TOTP code
      description: >-
        Verifies a current 6-digit TOTP code and advances the challenge to
        verified. Recovery codes are not accepted. A wrong code is counted in
        the account's login-failure window (lockout may follow); the code is
        never logged or audited.
      operationId: completeStepUpChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepUpComplete" }
      responses:
        "200":
          description: Verified challenge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepUpChallenge" }
        "401":
          $ref: "#/components/responses/Error"
        "400":
          description: Params fail the descriptor schema (OPERATION_PARAMS_INVALID).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "403":
          description: Human-only operation called by a machine principal.
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "428":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/step-up/demo:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      tags: [auth]
      summary: Demo endpoint exercising the step-up guard
      description: >-
        Minimal protected route that consumes a verified challenge for
        step_up:demo exactly once, proving start/verify/consume end to end.
        A second presentation returns 409 STEP_UP_REPLAY.
      operationId: stepUpDemo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step_up_id]
              properties:
                step_up_id: { type: string, format: uuid }
      responses:
        "200":
          description: Guard passed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "410":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/gateway-operations:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [credentials]
      summary: List the aggregate gateway operation catalog
      description: >-
        Aggregates the tenant gateways' own advertised descriptors
        (migration 0080) with per-tenant private descriptors and disable
        marks. Edge rows list the advertising gateways (advertised_by /
        gateway_count) and flag divergent same-key contracts (conflict).
        Requires edge_operation:read.
      operationId: listGatewayOperations
      responses:
        "200":
          description: Effective catalog.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/GatewayOperation" }
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [credentials]
      summary: Create a private gateway operation descriptor
      operationId: createGatewayOperation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GatewayOperationWrite" }
      responses:
        "201":
          description: Private descriptor created.
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/gateway-operations/{operation}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: operation
        in: path
        required: true
        schema: { type: string }
      - name: version
        in: query
        required: false
        schema: { type: string }
    get:
      tags: [credentials]
      summary: Get one effective operation descriptor
      operationId: getGatewayOperation
      responses:
        "200":
          description: Descriptor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GatewayOperation" }
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [credentials]
      summary: Update a private operation descriptor
      operationId: updateGatewayOperation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GatewayOperationWrite" }
      responses:
        "204":
          description: Descriptor updated.
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [credentials]
      summary: Delete a private operation descriptor
      operationId: deleteGatewayOperation
      responses:
        "204":
          description: Descriptor deleted.
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [credentials]
      summary: Clone an advertised descriptor into a private one
      operationId: cloneGatewayOperation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_type]
              properties:
                new_type: { type: string }
      responses:
        "201":
          description: Private clone created.
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/gateway-operations/{operation}/disabled:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: operation
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [credentials]
      summary: Disable or enable an operation key for the tenant
      operationId: setGatewayOperationDisabled
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [disabled]
              properties:
                type_version: { type: string }
                disabled: { type: boolean }
      responses:
        "204":
          description: Toggle recorded.
        "403":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/protocol-families:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [profiles]
      summary: List the global device-service/protocol catalog
      description: >-
        Returns the global, operator-editable catalog of protocol families /
        reference EdgeX device services (ADR-0033, migration 0063). Rows are
        global vendor facts shared by every tenant; the tenant segment only
        attaches authorization. The fourteen official EdgeX 4.0.2 device
        services are seeded builtin. Optional `q` filters case-insensitively
        over family/display_name/service_name/protocol_key. Requires
        profile:read. Returns [] (never null).
      operationId: listProtocolFamilies
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Catalog families.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ProtocolFamily" }
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [profiles]
      summary: Create a custom protocol family
      description: >-
        Adds an operator-defined family (builtin=false). The family key must
        be lowercase letters/digits/dashes and be unique. Requires
        profile:write.
      operationId: createProtocolFamily
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtocolFamilyInput" }
      responses:
        "201":
          description: Created family.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtocolFamily" }
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/protocol-families/{family}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: family
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [profiles]
      summary: Get one protocol family
      operationId: getProtocolFamily
      responses:
        "200":
          description: One family.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtocolFamily" }
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [profiles]
      summary: Update a protocol family
      description: >-
        Replaces the mutable columns (display name, service/protocol key,
        transports, connection/point fields, doc URL). The family key and the
        builtin flag are immutable. Builtin families are editable. Requires
        profile:write.
      operationId: updateProtocolFamily
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProtocolFamilyInput" }
      responses:
        "200":
          description: Updated family.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProtocolFamily" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [profiles]
      summary: Delete a custom protocol family
      description: >-
        Removes a custom family. Builtin (official) families cannot be
        deleted and return 409 PROTOCOL_FAMILY_BUILTIN. Requires
        profile:write.
      operationId: deleteProtocolFamily
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/retention:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [retention]
      summary: List effective retention policy per domain
      description: >-
        Returns the effective policy for every domain (telemetry, event,
        alarm, audit), resolving code defaults when no override exists.
        Any tenant member may read; only a platform administrator may
        change policy.
      operationId: listRetention
      responses:
        "200":
          description: Effective policies.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RetentionPolicy"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/retention/{domain}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: domain
        in: path
        required: true
        schema:
          type: string
          enum: [telemetry, event, alarm, audit]
    get:
      tags: [retention]
      summary: Get one domain retention policy
      operationId: getRetention
      responses:
        "200":
          description: Effective policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionPolicy" }
        "400":
          $ref: "#/components/responses/Error"
    put:
      tags: [retention]
      summary: Set one domain retention policy (platform admin)
      description: >-
        Changes the automatic-deletion window and/or legal-hold flag.
        Shortening a window never deletes rows synchronously; the
        background enforcer applies it. retention_days = 0 keeps data
        indefinitely. Legal hold suspends automatic deletion.
      operationId: setRetention
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetentionPolicyWrite" }
      responses:
        "200":
          description: Updated effective policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetentionPolicy" }
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/discovery-policy:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [discovery]
      summary: Get effective tenant auto-provisioning policy
      description: >-
        Resolved policy for the tenant default (deployment YAML overridden by
        the stored tenant default). `overridden` is true when a stored row
        exists at this scope.
      operationId: getTenantDiscoveryPolicy
      responses:
        "200":
          description: Effective policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryPolicy" }
    put:
      tags: [discovery]
      summary: Set the tenant default auto-provisioning policy
      description: >-
        Upserts the tenant-default override. Omitted fields keep inheriting
        the deployment default. Provide at least one field.
      operationId: setTenantDiscoveryPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryPolicyWrite" }
      responses:
        "200":
          description: Updated effective policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryPolicy" }
        "400":
          $ref: "#/components/responses/Error"
    delete:
      tags: [discovery]
      summary: Remove the tenant default override (inherit deployment)
      operationId: deleteTenantDiscoveryPolicy
      responses:
        "204": { description: Override removed. }

  /v1/tenants/{tenantId}/gateways/{gatewayId}/discovery-policy:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: gatewayId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [discovery]
      summary: Get effective auto-provisioning policy for one gateway
      description: Resolved as gateway override over tenant default over deployment YAML.
      operationId: getGatewayDiscoveryPolicy
      responses:
        "200":
          description: Effective policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryPolicy" }
        "400":
          $ref: "#/components/responses/Error"
    put:
      tags: [discovery]
      summary: Set one gateway's auto-provisioning policy override
      description: >-
        Upserts a per-gateway override. Omitted fields keep inheriting the
        tenant default. Provide at least one field. The gateway must be an
        is_gateway device owned by the tenant.
      operationId: setGatewayDiscoveryPolicy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryPolicyWrite" }
      responses:
        "200":
          description: Updated effective policy.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryPolicy" }
        "400":
          $ref: "#/components/responses/Error"
    delete:
      tags: [discovery]
      summary: Remove one gateway's override (inherit tenant default)
      operationId: deleteGatewayDiscoveryPolicy
      responses:
        "204": { description: Override removed. }

  /v1/tenants/{tenantId}/discovery-candidates:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [discovery]
      summary: List gateway discovery approval candidates
      description: |
        Lists the human-review queue for gateway auto-provisioning
        (migration 0046). Candidates appear here only when the effective
        discovery policy approval_mode is `review`. Optional filters:
        `state` (PENDING/APPROVED/REJECTED/EXPIRED) and `gateway`. Requires
        `device:read`.
      operationId: listDiscoveryCandidates
      parameters:
        - name: state
          in: query
          required: false
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED, EXPIRED] }
        - name: gateway
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: page
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 1 }
        - name: page_size
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 50 }
      responses:
        "200":
          description: Paged discovery candidates newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, page, page_size, total_pages]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DiscoveryCandidate" }
                  total: { type: integer }
                  page: { type: integer }
                  page_size: { type: integer }
                  total_pages: { type: integer }
        "503":
          description: Approval queue not enabled.

  /v1/tenants/{tenantId}/discovery-candidates/{candidateId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: candidateId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [discovery]
      summary: Get one discovery candidate
      operationId: getDiscoveryCandidate
      responses:
        "200":
          description: Candidate record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryCandidate" }
        "404":
          description: Candidate not found in tenant.

  /v1/tenants/{tenantId}/discovery-candidates/{candidateId}/approve:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: candidateId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [discovery]
      summary: Approve a pending discovery candidate
      description: |
        Creates the queued device through the guarded registry path, marks
        the candidate APPROVED and asynchronously pushes the local_id to
        device_id result to the owning gateway. Requires `device:write`.
      operationId: approveDiscoveryCandidate
      responses:
        "200":
          description: Candidate approved and device created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidate: { $ref: "#/components/schemas/DiscoveryCandidate" }
                  result: { $ref: "#/components/schemas/DiscoveryItemResult" }
        "404":
          description: Candidate not found in tenant.
        "409":
          description: Candidate already has a decision.
        "422":
          description: Registry refused the creation (quota/name conflict).

  /v1/tenants/{tenantId}/discovery-candidates/{candidateId}/reject:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: candidateId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [discovery]
      summary: Reject a pending discovery candidate
      description: |
        Marks the candidate REJECTED without creating a device and pushes the
        rejection to the owning gateway. Requires `device:write`.
      operationId: rejectDiscoveryCandidate
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Candidate rejected.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryCandidate" }
        "404":
          description: Candidate not found in tenant.
        "409":
          description: Candidate already has a decision.

  /v1/tenants/{tenantId}/secrets:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [credentials]
      summary: List tenant secret metadata
      description: >-
        Lists the tenant secret vault (migration 0047, typed documents since
        0069). Values are never returned. Legacy secrets require
        `connector:read`; typed edge-secret entries use edge_secret points;
        see SecretMetadata.kind.
      operationId: listSecrets
      responses:
        "200":
          description: Secret metadata.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SecretMetadata" }
        "503":
          description: Secret vault not enabled.

  /v1/tenants/{tenantId}/secrets/{name}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: name
        in: path
        required: true
        schema: { type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9_.-]*$' }
    get:
      tags: [credentials]
      summary: Get one secret's metadata
      operationId: getSecret
      responses:
        "200":
          description: Secret metadata without the value.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretMetadata" }
        "404":
          description: Secret not found.
    put:
      tags: [credentials]
      summary: Create or rotate one secret
      description: >-
        Write-only upsert by (tenant, name). A body with `document` seals a
        typed JSON document (validated against the named edge secret type
        when one is registered; unregistered types are fail-open) and needs
        edge_secret:write. A body with `value` keeps the legacy single-value
        shape and needs connector:write. No history is retained.
      operationId: putSecret
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretWrite" }
      responses:
        "200":
          description: Secret stored (metadata only in the response).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretMetadata" }
        "400":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    delete:
      tags: [credentials]
      summary: Delete one secret with reference protection
      description: >-
        A normal DELETE is blocked (409 SECRET_IN_USE) while any non-REMOVED
        gateway binding exists; the response lists the referencing gateways.
        A forced DELETE sends `{ "force": true, "step_up_id": "<id>" }` after
        completing the human-only `edge_secret:force-delete` TOTP step-up.
        It withdraws every binding and returns 202 while gateways still must
        confirm removal; the vault original is deleted only after the last
        REMOVED report. With zero references it returns 204 immediately.
      operationId: deleteSecret
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretDeleteRequest" }
      responses:
        "204": { description: Secret deleted. }
        "202":
          description: Forced withdrawal initiated; awaiting gateway confirmation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PendingSecretDelete" }
        "403":
          $ref: "#/components/responses/Error"
        "409":
          description: Secret is still delivered to one or more gateways.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretDeleteConflict" }
        "428":
          description: Forced deletion requires a completed step-up challenge.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }

  /v1/tenants/{tenantId}/devices/{deviceId}/credentials:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [credentials]
      summary: List device credentials
      operationId: listCredentials
      responses:
        "200":
          description: Credential metadata without secret values.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Credential"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [credentials]
      summary: Create a device credential
      operationId: createCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialWrite"
      responses:
        "201":
          description: Created credential. A server-generated TOKEN or built-in CA issued X509 returns the plaintext secret/key material in this response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          description: Conflict. `credentials_id` is already in use, or the X.509 leaf certificate (SHA-256 fingerprint) is already bound to another device (ADR-0009 credential-reuse detection).
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/{deviceId}/credentials/{credentialId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: credentialId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [credentials]
      summary: Rotate a credential secret
      operationId: updateCredentialSecret
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credentials_value]
              properties:
                credentials_value: { type: string }
      responses:
        "204":
          description: Secret updated.
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [credentials]
      summary: Delete a credential
      operationId: deleteCredential
      responses:
        "204":
          description: Credential deleted.
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/{deviceId}/credentials/{credentialId}/status:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: credentialId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [credentials]
      summary: Enable or disable a credential
      description: Disabling revokes the credential immediately, ends the live session and forces re-authentication.
      operationId: setCredentialStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialStatusWrite"
      responses:
        "200":
          description: Updated credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/{deviceId}/credentials/{credentialId}/rotate:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: credentialId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [credentials]
      summary: Rotate a credential
      description: Replaces the secret and/or expiry in place, resets warning bookkeeping and forces the device to reconnect. Register a replacement credential first for overlap-window rotation.
      operationId: rotateCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialRotate"
      responses:
        "200":
          description: Rotated credential.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/{deviceId}/credentials/revoke-all:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [credentials]
      summary: Revoke every credential of a device
      description: "Bulk emergency revocation: disables all credentials, evicts presence and ends the live session."
      operationId: revokeAllCredentials
      responses:
        "200":
          description: Number of credentials disabled by this call.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: { type: integer, format: int64 }
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/{deviceId}/credentials/{credentialId}/secret:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: credentialId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [credentials]
      summary: Reveal stored credential material
      description: Returns the stored TOKEN/JWT secret or X509 certificate and its decrypted private key. A PASSWORD held as an argon2id hash returns revealable=false. The reveal is audited.
      operationId: revealCredential
      responses:
        "200":
          description: Stored credential material.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        "404":
          $ref: "#/components/responses/Error"

  /v1/platform/accounting/topn:
    get:
      tags: [platform]
      summary: Resource accounting Top-N for one dimension and window
      description: >-
        ADR-0025 resource accounting (sFlow/"show CLI" style). Every node
        samples one frame in N per dimension, reduces the sample locally to
        a bounded heavy-hitter view and reports it; the cluster aggregator
        sums the reports and this endpoint ranks the result. Counts are
        extrapolated from the sample, so each entry carries the divisor
        used and an `estimated` flag. Rows are retained for 24h, which is
        why the window cannot exceed 24h. Platform-admin only: the rows are
        cluster-wide and carry no tenant attribution.
      operationId: getAccountingTopN
      parameters:
        - name: dimension
          in: query
          required: false
          description: Dimension to rank; defaults to tenant.
          schema:
            type: string
            enum: [tenant, device, ip, protocol, node, topic]
            default: tenant
        - name: window
          in: query
          required: false
          description: Ranking window; defaults to 5m.
          schema:
            type: string
            enum: ["1m", "5m", "15m", "1h", "6h", "24h"]
            default: 5m
        - name: limit
          in: query
          required: false
          description: >-
            Maximum number of ranked values; defaults to 20 and is capped at
            200. A larger value is rejected with ACCOUNTING_BAD_LIMIT rather
            than silently clamped, so the echoed limit always describes the
            page actually returned.
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: tenant
          in: query
          required: false
          description: >-
            Restrict the ranking to one tenant. Only valid with
            dimension=tenant; other dimensions are not tenant-keyed.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Ranked dimension values, highest message count first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountingTopNResponse"
        "400":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/platform/ca:
    get:
      tags: [platform]
      summary: List platform trust anchors
      operationId: listTrustAnchors
      responses:
        "200":
          description: Every built-in and imported CA.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TrustAnchor"
    post:
      tags: [platform]
      summary: Import a third-party CA
      description: Only the CA certificate is imported; it must have basic constraints CA=true. Importing trusts certificates it has issued for device mTLS.
      operationId: importTrustAnchor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label, pem]
              properties:
                label: { type: string }
                pem: { type: string }
      responses:
        "201":
          description: Imported trust anchor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrustAnchor"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/platform/ca/{caId}/status:
    parameters:
      - name: caId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [platform]
      summary: Enable or disable a trust anchor
      description: Takes effect on the next TLS handshake; active sessions are not dropped.
      operationId: setTrustAnchorStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [ACTIVE, DISABLED] }
      responses:
        "204":
          description: Status updated.
        "404":
          $ref: "#/components/responses/Error"

  /v1/platform/ca/{caId}:
    parameters:
      - name: caId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [platform]
      summary: Delete an imported trust anchor
      description: The built-in CA cannot be deleted.
      operationId: deleteTrustAnchor
      responses:
        "204":
          description: Trust anchor deleted.
        "404":
          $ref: "#/components/responses/Error"

  /v1/me/ca.pem:
    get:
      tags: [platform]
      summary: Public CA bundle
      description: Returns the concatenated PEM of every active CA with no authentication, for device provisioning.
      operationId: publicCABundle
      security: []
      responses:
        "200":
          description: PEM bundle.
          content:
            application/x-pem-file:
              schema: { type: string }

  /v1/tenants/{tenantId}/credential-epoch:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    post:
      tags: [credentials]
      summary: Bump the tenant credential epoch
      description: Raises the per-tenant epoch used to invalidate every cached credential decision at once (ADR-0009).
      operationId: bumpCredentialEpoch
      responses:
        "200":
          description: New epoch value.
          content:
            application/json:
              schema:
                type: object
                required: [credential_epoch]
                properties:
                  credential_epoch: { type: integer, format: int64 }

  /v1/tenants/{tenantId}/devices/{deviceId}/commands:
    get:
      tags: [commands]
      summary: List device command history
      operationId: listDeviceCommands
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: state
          in: query
          schema:
            type: string
            enum: [PENDING, CLAIMED, QUEUED, DELIVERED, SUCCEEDED, FAILED,
                   TIMEOUT, NOT_CONNECTED, EXPIRED]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paged command history newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/CommandRecord"
    post:
      tags: [commands]
      summary: Dispatch a device command
      description: |
        Dispatches one command declared in the device Command Catalog.

        Behavior depends on the catalog entry:

        - `realtime` commands to an offline device end in `NOT_CONNECTED`.
        - `persistent` commands created while offline return `QUEUED` and are
          delivered after the device reconnects; undelivered commands exceeding
          the configured TTL end in `EXPIRED`.
        - `one-way` commands end in `DELIVERED`; `request-response` commands
          wait for one device response and end in `SUCCEEDED` or `TIMEOUT`.

        The synchronous result is the terminal status except for `QUEUED`.
        Late responses after a timeout are published as command lifecycle
        events.
      operationId: sendDeviceCommand
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
      responses:
        "200":
          description: Synchronous command result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          description: Command is not declared in the device catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Parameter document exceeds the configured size limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/{deviceId}/command-catalog:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [commands]
      summary: List the device command whitelist
      operationId: listDeviceCommandCatalog
      responses:
        "200":
          description: Declared commands, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandCatalogList"
        "404":
          $ref: "#/components/responses/Error"
    post:
      tags: [commands]
      summary: Declare a command in the device whitelist
      description: |
        Manually declares (or replaces) one command. Automatic entries
        materialized from the bound profile cannot be created through this
        endpoint; an existing automatic entry is replaced by a manual one
        on the same name. Requires device:write.
      operationId: createDeviceCommandCatalogEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandCatalogInput"
      responses:
        "201":
          description: Declared.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandCatalogEntry"
        "400":
          $ref: "#/components/responses/Error"
  /v1/tenants/{tenantId}/devices/{deviceId}/command-catalog/{commandName}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: commandName
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [commands]
      summary: Replace one declared command
      operationId: updateDeviceCommandCatalogEntry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandCatalogInput"
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandCatalogEntry"
        "400":
          $ref: "#/components/responses/Error"
    delete:
      tags: [commands]
      summary: Remove one declared command
      description: In-flight commands are not affected.
      operationId: deleteDeviceCommandCatalogEntry
      responses:
        "204":
          description: Removed.
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/{deviceId}/attributes:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [devices]
      summary: List device attributes
      operationId: listDeviceAttributes
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [CLIENT, SERVER_SCOPE, SHARED_SCOPE]
          description: |
            Filters by scope. In the current implementation both SERVER_SCOPE
            and SHARED_SCOPE are delivered to the device on the attribute
            downlink (unlike classic ThingsBoard, where SERVER_SCOPE is
            server-private); CLIENT scope is device-reported and read-only.
      responses:
        "200":
          description: Shadow attributes grouped by scope.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceAttribute"
    put:
      tags: [devices]
      summary: Upsert one server/shared attribute
      operationId: putDeviceAttribute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceAttributeWrite"
      responses:
        "204":
          description: Attribute stored.
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [devices]
      summary: Delete one server/shared attribute
      description: |
        Removes one platform-writable attribute key. CLIENT scope is
        device-owned and cannot be deleted here. After the row is committed a
        null change is fanned out on the attribute downlink so a connected
        edge drops the key from its local cache; an offline edge recovers on
        its next `v1/.../attributes/get`.
      operationId: deleteDeviceAttribute
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum: [SERVER_SCOPE, SHARED_SCOPE]
        - name: key
          in: query
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Attribute deleted.
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/{deviceId}/events:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [devices]
      summary: List device domain events
      description: |
        Returns the append-only domain-event ledger for one device, newest
        first. Events originate from the device `v1/me/events` MQTT topic;
        `event_type`, `severity` and `payload` are tenant-defined. The caller's
        data scope restricts which devices are visible. Returns `[]` (never
        `null`) when there are no events.
      operationId: listDeviceEvents
      parameters:
        - name: event_type
          in: query
          schema: { type: string }
        - name: start
          in: query
          description: RFC3339, default now-24h.
          schema: { type: string, format: date-time }
        - name: end
          in: query
          description: RFC3339, default now.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          description: Page cap, default 200, max 1000.
          schema: { type: integer, default: 200 }
      responses:
        "200":
          description: Device domain events newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceEvent"
        "503":
          description: Device events are not enabled.

  /v1/tenants/{tenantId}/device-events:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    get:
      tags: [devices]
      summary: List tenant-wide device domain events
      description: |
        Returns domain events across the tenant, optionally narrowed by
        device and event type. The caller's data scope restricts which
        devices are visible. Returns `[]` (never `null`) when empty.
      operationId: listTenantDeviceEvents
      parameters:
        - name: device_id
          in: query
          schema: { type: string, format: uuid }
        - name: event_type
          in: query
          schema: { type: string }
        - name: start
          in: query
          description: RFC3339, default now-24h.
          schema: { type: string, format: date-time }
        - name: end
          in: query
          description: RFC3339, default now.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          description: Page cap, default 200, max 1000.
          schema: { type: integer, default: 200 }
      responses:
        "200":
          description: Device domain events newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceEvent"
        "503":
          description: Device events are not enabled.

  /v1/tenants/{tenantId}/devices/{deviceId}/telemetry:
    get:
      tags: [devices]
      summary: List historical device telemetry
      operationId: listDeviceTelemetry
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: key
          in: query
          schema: { type: string }
        - name: start
          in: query
          description: RFC3339, default now-24h. Window (end-start) is capped at 7 days; use the series endpoint for longer ranges.
          schema: { type: string, format: date-time }
        - name: end
          in: query
          description: RFC3339, default now. Must be later than start.
          schema: { type: string, format: date-time }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paged telemetry newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/TelemetryHistory"
        "400":
          description: Malformed start/end, reversed window, or range over 7 days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/tenants/{tenantId}/devices/{deviceId}/telemetry/keys:
    get:
      tags: [devices]
      summary: Discover device measurement keys
      description: |
        Returns the most recent value of every measurement key reported
        within the window (default 30 days), newest key first. It backs
        the measurement selector and the latest-telemetry strip.
      operationId: listDeviceTelemetryKeys
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: start
          in: query
          description: RFC3339, default now-30d. Window (end-start) is capped at 90 days.
          schema: { type: string, format: date-time }
        - name: end
          in: query
          description: RFC3339, default now. Must be later than start.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Latest value of every measurement key.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelemetryKey"
        "400":
          description: Malformed start/end, reversed window, or range over 90 days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/tenants/{tenantId}/devices/{deviceId}/telemetry/series:
    get:
      tags: [devices]
      summary: Downsampled device telemetry series
      description: |
        Returns the last value per time bucket covering the whole window,
        so long ranges render without fetching every raw row. The bucket
        width is chosen server-side so the response spans at most a few
        hundred buckets.
      operationId: listDeviceTelemetrySeries
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: deviceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: key
          in: query
          required: true
          schema: { type: string }
        - name: start
          in: query
          description: RFC3339, default now-24h. Window (end-start) is capped at 400 days.
          schema: { type: string, format: date-time }
        - name: end
          in: query
          description: RFC3339, default now. Must be later than start.
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Downsampled buckets ascending in time.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TelemetrySeriesPoint"
        "400":
          description: Malformed start/end, reversed window, or range over 400 days.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/tenants/{tenantId}/presence:
    get:
      tags: [devices]
      summary: Snapshot online devices
      description: |
        Lists every device currently holding a live presence session, so
        a freshly loaded client can seed its online map without waiting
        for the next presence boundary event.
      operationId: getPresenceSnapshot
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Current presence snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresenceSnapshot"

  /v1/tenants/{tenantId}/notifications:
    get:
      tags: [notifications]
      summary: List in-app notifications
      operationId: listNotifications
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: state
          in: query
          schema:
            type: string
            enum: [NEW, READ]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paged notifications newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Notification"

  /v1/tenants/{tenantId}/notifications/read:
    post:
      tags: [notifications]
      summary: Mark notifications as read
      operationId: markNotificationsRead
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string, format: uuid }
      responses:
        "204":
          description: Notifications marked read.

  /v1/tenants/{tenantId}/storage-hooks:
    get:
      tags: [storage]
      summary: List pre-storage hooks
      operationId: listStorageHooks
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: All hooks including disabled ones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StorageHook"
    post:
      tags: [storage]
      summary: Create a pre-storage hook
      operationId: createStorageHook
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageHookWrite"
      responses:
        "201":
          description: Created hook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageHook"
        "400":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/storage-hooks/{hookId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: hookId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [storage]
      summary: Replace one pre-storage hook
      operationId: updateStorageHook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StorageHookWrite"
      responses:
        "200":
          description: Updated hook.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageHook"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [storage]
      summary: Delete one pre-storage hook
      operationId: deleteStorageHook
      responses:
        "204":
          description: Hook deleted.
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/forwarders:
    get:
      tags: [forwarders]
      summary: List data forwarders
      operationId: listForwarders
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: All forwarders including disabled ones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Forwarder"
    post:
      tags: [forwarders]
      summary: Create a data forwarder
      operationId: createForwarder
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwarderWrite"
      responses:
        "201":
          description: Created forwarder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forwarder"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/forwarders/{forwarderId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: forwarderId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [forwarders]
      summary: Get one data forwarder
      operationId: getForwarder
      responses:
        "200":
          description: One forwarder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forwarder"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [forwarders]
      summary: Replace one data forwarder
      description: |
        Updates a forwarder. The `sink_type` is immutable after creation
        and must equal the existing value; a mismatching sink type is
        rejected with 400. To change the delivery mechanism, create a new
        forwarder.
      operationId: updateForwarder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForwarderWrite"
      responses:
        "200":
          description: Updated forwarder.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forwarder"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [forwarders]
      summary: Delete one data forwarder
      operationId: deleteForwarder
      responses:
        "204":
          description: Forwarder deleted.
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/forwarder-dlq:
    get:
      tags: [forwarders]
      summary: List forwarder dead-letter rows
      operationId: listForwarderDLQ
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: forwarder
          in: query
          description: Optional forwarder id to filter by.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Dead letters newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForwarderDeadLetter"

  /v1/tenants/{tenantId}/forwarder-dlq/{dlqId}/replay:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: dlqId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [forwarders]
      summary: Replay one forwarder dead letter
      operationId: replayForwarderDLQ
      responses:
        "202":
          description: Message re-published onto the forwarder stream.
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/forwarder-deliveries:
    get:
      tags: [forwarders]
      summary: List per-forwarder delivery-log rows
      description: >-
        Returns the most recent delivery attempts with the receiver return
        code (for example the HTTP status). Settlement is asynchronous, so the
        forward node trace cannot carry this code; it is observable here. The
        log is bounded by age (7 days) and per-forwarder count (1000 rows).
      operationId: listForwarderDeliveries
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: forwarder
          in: query
          description: Optional forwarder id to filter by.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          description: Maximum rows to return; server default 200.
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Delivery attempts newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ForwarderDelivery"

  /v1/tenants/{tenantId}/companion-endpoints:
    get:
      tags: [companion-endpoints]
      summary: List companion endpoints
      operationId: listCompanionEndpoints
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: All registered companion endpoints including disabled ones.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanionEndpoint"
    post:
      tags: [companion-endpoints]
      summary: Register a companion endpoint
      description: >-
        Registers one companion installation for a logical companion id on one
        gateway. Re-registering the same (companion_id, gateway_id) natural key
        upserts the row. The auth token is write-only and never returned.
      operationId: createCompanionEndpoint
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanionEndpointWrite"
      responses:
        "201":
          description: Registered endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionEndpoint"
        "400":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/companion-endpoints/{endpointId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: endpointId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [companion-endpoints]
      summary: Get one companion endpoint
      operationId: getCompanionEndpoint
      responses:
        "200":
          description: One endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionEndpoint"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [companion-endpoints]
      summary: Update one companion endpoint
      description: >-
        Updates an endpoint. The natural key (companion_id, gateway_id) is
        immutable; changing either is rejected with 400. An omitted
        auth_token preserves the stored secret; an explicit empty string
        clears it.
      operationId: updateCompanionEndpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanionEndpointWrite"
      responses:
        "200":
          description: Updated endpoint.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanionEndpoint"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [companion-endpoints]
      summary: Delete one companion endpoint
      description: Deleting an endpoint cascades its desired subscription rows.
      operationId: deleteCompanionEndpoint
      responses:
        "204":
          description: Endpoint deleted.
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/companion-endpoints/{endpointId}/subscriptions:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: endpointId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [companion-endpoints]
      summary: List desired subscription rows with read-back status
      operationId: listCompanionSubscriptions
      responses:
        "200":
          description: Desired rows with the last companion-reported revision/status.
          content:
            application/json:
              schema:
                type: object
                required: [subscriptions]
                properties:
                  subscriptions:
                    type: array
                    items:
                      $ref: "#/components/schemas/CompanionDesiredSubscription"
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/telemetry-dlq:
    get:
      tags: [storage]
      summary: List telemetry dead-letter rows
      operationId: listTelemetryDLQ
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: hook_name
          in: query
          description: Exact failing-hook name to filter by.
          schema: { type: string }
        - name: device
          in: query
          description: Case-insensitive substring match on device_id.
          schema: { type: string }
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paged DLQ rows newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/TelemetryDLQ"

  /v1/tenants/{tenantId}/telemetry-dlq/delete:
    post:
      tags: [storage]
      summary: Delete DLQ rows
      operationId: deleteTelemetryDLQ
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "204":
          description: Rows deleted.

  /v1/tenants/{tenantId}/telemetry-dlq/replay:
    post:
      tags: [storage]
      summary: Replay DLQ points into telemetry
      description: |
        Re-inserts the original points directly into ts_telemetry at the
        replay time, bypassing hooks. DLQ rows are retained for audit until
        deleted explicitly.
      operationId: replayTelemetryDLQ
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
      responses:
        "200":
          description: Replay result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  replayed: { type: integer }

  /v1/tenants/{tenantId}/overview:
    get:
      tags: [overview]
      summary: Read tenant operational summary
      description: Returns KPI counters, telemetry buckets, alarm severity and recent feeds.
      operationId: getTenantOverview
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Aggregated tenant snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverviewSummary"

  /v1/tenants/{tenantId}/rule-chain-groups:
    get:
      tags: [rule-chains]
      summary: List chain groups
      description: |
        Returns the chain groups of a tenant with their active and latest
        version summary. A chain group is the stable identity that device
        profiles and devices bind to; the default group is the tenant
        fallback chain.
      operationId: listRuleChainGroups
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Chain groups, default first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuleChainGroup"
    post:
      tags: [rule-chains]
      summary: Create a chain group
      operationId: createRuleChainGroup
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 255 }
      responses:
        "201":
          description: Empty chain group created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }

  /v1/tenants/{tenantId}/rule-chain-groups/{groupId}:
    delete:
      tags: [rule-chains]
      summary: Delete a chain group
      description: |
        Deletes a group only when it is neither the tenant default nor
        bound to any device or profile; its version rows cascade. The
        tenant default group, and any group still referenced by device or
        profile bindings, cannot be deleted — rebind the referencing rows
        first. The list response exposes device_count and profile_count so
        clients can disable the action before calling this endpoint.
      operationId: deleteRuleChainGroup
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Group deleted.
        "400":
          description: Attempt to delete the tenant default group.
        "404":
          description: Group not found.
        "409":
          description: Group is still bound to devices or profiles.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/tenants/{tenantId}/rule-chain-groups/{groupId}/versions:
    get:
      tags: [rule-chains]
      summary: List versions of a chain group
      operationId: listRuleChainVersions
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Group versions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuleChainMeta"
    post:
      tags: [rule-chains]
      summary: Create a draft version of a chain group
      description: |
        Stores the supplied graph as a new immutable draft. Every graph node
        receives a fresh identifier; incoming node identifiers are used only
        as local edge references.
      operationId: createRuleChainDraft
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: groupId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleGraphWrite"
      responses:
        "201":
          description: Draft version created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleChainDraftResponse"

  /v1/tenants/{tenantId}/rule-chains/{chainId}:
    get:
      tags: [rule-chains]
      summary: Read one chain version graph
      operationId: getRuleChainGraph
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: chainId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Chain version graph.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleGraph"

  /v1/tenants/{tenantId}/rule-chains/{chainId}/activate:
    post:
      tags: [rule-chains]
      summary: Activate a draft version
      operationId: activateRuleChain
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: chainId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Chain activated; previous active version archived.

  /v1/tenants/{tenantId}/alarms:
    get:
      tags: [alarms]
      summary: List alarm audit rows
      description: |
        Returns one page of alarm rows, newest first. The compound state
        values LIVE and OPEN match both ACTIVE and ACK alarms.
      operationId: listTenantAlarms
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: device_id
          in: query
          schema: { type: string, format: uuid }
        - name: state
          in: query
          schema:
            type: string
            enum: [LIVE, OPEN, ACTIVE, ACK, CLEARED]
        - name: severity
          in: query
          schema:
            type: string
            enum: [CRITICAL, MAJOR, MINOR, WARNING]
        - name: alarm_type
          in: query
          description: Exact alarm type.
          schema: { type: string }
        - name: assignee
          in: query
          description: Assignee user UUID, or "none" for unassigned alarms.
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: One page of alarm rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlarmPage"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/link-episodes:
    get:
      tags: [alarms]
      summary: List gateway link outage episodes
      description: |
        Returns one page of link episode rows (outage intervals), newest
        first. Rows are lease-detected by the platform or reported by an
        edge watchdog over v1/gateway/linkhealth (including episodes that
        corrected a lease row and alarm-free micro-flaps). Scoped by the
        caller's data scope through gateway membership.
      operationId: listLinkEpisodes
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: gateway_id
          in: query
          schema: { type: string, format: uuid }
        - name: source
          in: query
          schema:
            type: string
            enum: [lease, edge]
        - name: start
          in: query
          description: RFC3339; matches episodes started at or after.
          schema: { type: string, format: date-time }
        - name: end
          in: query
          description: RFC3339; matches episodes started before.
          schema: { type: string, format: date-time }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: One page of link episode rows.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkEpisodePage"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/alarms/{alarmId}/ack:
    post:
      tags: [alarms]
      summary: Acknowledge one active alarm
      operationId: ackAlarm
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: alarmId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Alarm acknowledged; already-ACK alarms are idempotent.
        "404":
          description: Alarm does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/alarms/{alarmId}/assign:
    post:
      tags: [alarms]
      summary: Assign one alarm or clear its assignment
      operationId: assignAlarm
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: alarmId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignAlarmRequest"
      responses:
        "204":
          description: Assignment updated.
        "400":
          description: Assignee is not an active tenant member.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Alarm does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/alarms/{alarmId}/comments:
    get:
      tags: [alarms]
      summary: List alarm comments
      operationId: listAlarmComments
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: alarmId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Comment timeline.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AlarmComment"
        "500":
          $ref: "#/components/responses/Error"
    post:
      tags: [alarms]
      summary: Add an alarm comment
      operationId: addAlarmComment
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: alarmId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlarmCommentRequest"
      responses:
        "201":
          description: Comment added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlarmComment"
        "400":
          description: Invalid comment body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Alarm does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/commands:
    get:
      tags: [commands]
      summary: List commands across every device
      description: |
        Returns one page of command audit rows for the tenant-wide command
        center, newest first. The special state value INFLIGHT matches every
        non-terminal state (PENDING, CLAIMED, QUEUED).
      operationId: listTenantCommands
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: device_id
          in: query
          description: |
            Partial, case-insensitive match on the target device's canonical
            name or alias (not the UUID).
          schema: { type: string }
        - name: name
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema:
            type: string
            enum: [INFLIGHT, PENDING, CLAIMED, QUEUED, DELIVERED, SUCCEEDED,
                   FAILED, TIMEOUT, NOT_CONNECTED, EXPIRED]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: One page of command records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandRecordPage"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/command-tasks:
    post:
      tags: [commands]
      summary: Create an asynchronous batch command
      description: |
        Expands a group subtree or explicit device selector into independent
        commands. The response returns after persistence; execution continues
        asynchronously and progress is pushed over WebSocket.
      operationId: createBatchCommand
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchCommandRequest"
      responses:
        "202":
          description: Batch task accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCommandTask"
        "400":
          description: Invalid target or request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [commands]
      summary: List batch command tasks
      operationId: listBatchCommands
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Page of batch tasks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCommandTaskPage"

  /v1/tenants/{tenantId}/command-tasks/{taskId}:
    get:
      tags: [commands]
      summary: Get one batch command task
      operationId: getBatchCommand
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Batch task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCommandTask"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/tenants/{tenantId}/command-tasks/{taskId}/items:
    get:
      tags: [commands]
      summary: List per-device batch task items
      operationId: listBatchCommandItems
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Page of per-device outcomes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchCommandItemPage"

  /v1/tenants/{tenantId}/probes:
    post:
      tags: [probes]
      summary: Create an on-demand gateway probe task
      description: |
        Groups the requested gateway-bound devices by owning gateway and sends
        one aggregated probe frame per online gateway. Returns 202 with a task
        id immediately; per-device results arrive over the `probe_task`
        WebSocket resource or via GET. Devices on an offline gateway fail
        immediately. Admission is limited per principal (rate, concurrency)
        and per device (cooldown). A request whose devices are all already
        open in one same-principal, same-mode in-flight task coalesces onto
        and replays that task (202) without consuming admission quota.
        Targets and reads are narrowed by the caller's data scope. A repeated
        Idempotency-Key with the same
        body replays the original 202 response. Requires `probes:write`.
      operationId: createProbe
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProbeRequest"
      responses:
        "202":
          description: Probe task accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeTask"
        "400":
          description: Invalid mode, device list, or target not gateway-bound.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Idempotency key reused with a different body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "429":
          description: Rate, concurrency, or cooldown limit exceeded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [probes]
      summary: List on-demand probe tasks
      operationId: listProbes
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 10 }
      responses:
        "200":
          description: Page of probe tasks (results retained 24h).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeTaskPage"

  /v1/tenants/{tenantId}/probes/{taskId}:
    get:
      tags: [probes]
      summary: Get one on-demand probe task
      operationId: getProbe
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Probe task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeTask"
        "404":
          description: Task not found or expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/tenants/{tenantId}/probes/{taskId}/items:
    get:
      tags: [probes]
      summary: List per-device probe items
      operationId: listProbeItems
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Page of per-device outcomes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeItemPage"

  /v1/tenants/{tenantId}/ota-tasks:
    post:
      tags: [ota]
      summary: Create a firmware OTA rollout task
      description: |
        Starts one rollout to the named targets. Targets may be directly
        connected devices or gateway-managed sub-devices (max 1000, must be
        ACTIVE/UNCLAIMED). Two package sources are supported:

        * Set `firmware_id` for a platform-hosted package (ADR-0006b). NL
          resolves version/sha256/size from the firmware repository and sets
          `package_url` to the authenticated relative path
          `/v1/me/ota/{task_id}/package`. Direct devices poll
          `GET /v1/me/ota/tasks`; gateway sub-devices receive one aggregated
          `v1/gateway/ota/task` frame. Both download bytes through the
          per-device authorized relay (no S3 credentials on the edge).
        * Otherwise supply an external `package` with an absolute http(s)
          `url` the edge downloads directly, enforcing sha256 before applying.

        Returns 202 + task; progress arrives by GET or the `ota_task`
        WebSocket resource. Requires `device:write`.
      operationId: createOTATask
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OTACreateRequest"
      responses:
        "202":
          description: Rollout accepted and dispatched asynchronously.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTATask"
        "400":
          description: Invalid target list, URL or sha256.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    get:
      tags: [ota]
      summary: List firmware OTA tasks
      operationId: listOTATasks
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 100 }
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [pending, running, paused, completed, partial, failed, aborted, canceled]
          description: Filter by aggregate task state; absent returns all states.
      responses:
        "200":
          description: Page of OTA tasks, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTATaskPage"

  /v1/tenants/{tenantId}/ota-tasks/{taskId}:
    get:
      tags: [ota]
      summary: Get one firmware OTA task
      operationId: getOTATask
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OTA task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTATask"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/tenants/{tenantId}/ota-tasks/{taskId}/items:
    get:
      tags: [ota]
      summary: List per-device OTA progress items
      operationId: listOTAItems
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 100 }
      responses:
        "200":
          description: Page of per-device progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTAItemPage"

  /v1/tenants/{tenantId}/ota-tasks/{taskId}/events:
    get:
      tags: [ota]
      summary: List the append-only per-device OTA phase timeline
      description: >
        Returns phase-boundary events (not every percentage frame) for the
        task, optionally narrowed with `device_id`. Each device timeline is
        ordered by a per-device monotonic `seq` beginning with the platform
        `pending` event.
      operationId: listOTAEvents
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: device_id
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Timeline events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTAEventPage"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/tenants/{tenantId}/ota-tasks/{taskId}/cancel:
    post:
      tags: [ota]
      summary: Safely cancel an OTA rollout
      description: >
        Best-effort, non-rollback cancel. Pending targets become `skipped`;
        targets that had started downloading but had not begun applying become
        `canceled` (the package relay then refuses them with 403 and later
        progress is rejected). Targets already applying (`updating`, `updated`,
        `rebooting`) are never interrupted; they finish undisturbed and their
        final result is still collected, with the task pinned to `canceled`.
        Canceling a task already `canceled` is idempotent (200); canceling a
        task in any other terminal state returns 409. Requires
        `device:write`.
      operationId: cancelOTATask
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Cancel applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTACancelResult"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Task is already finished and cannot be canceled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/tenants/{tenantId}/ota-tasks/{taskId}/pause:
    post:
      tags: [ota]
      summary: Hold a running OTA rollout
      description: >
        Pauses canary advancement: no new batch opens and offline-gateway
        redispatch stops, but devices already applying finish undisturbed and
        their results are still collected. A paused task may be resumed or
        canceled. Idempotent on an already paused task (200). Requires
        `device:write` (ADR-0006d §5).
      operationId: pauseOTATask
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Task paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTATask"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Task is not running.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/tenants/{tenantId}/ota-tasks/{taskId}/resume:
    post:
      tags: [ota]
      summary: Resume a held OTA rollout
      description: >
        Moves a `paused` task back to `running` and immediately dispatches the
        currently open batch. Requires `device:write` (ADR-0006d §5).
      operationId: resumeOTATask
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Task resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OTATask"
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "409":
          description: Task is not paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/tenants/{tenantId}/firmware:
    get:
      tags: [ota]

      summary: List platform-hosted firmware packages
      operationId: listFirmware
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: search
          in: query
          required: false
          schema: { type: string }
          description: Substring match on release name, version or file name.
        - name: profile_id
          in: query
          required: false
          schema: { type: string }
          description: Filter by device model; the literal `none` returns model-agnostic packages.
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, default: 10 }
        - name: state
          in: query
          description: Filter by aggregate task state.
          schema:
            type: string
            enum: [pending, running, completed, partial, failed]
        - name: mode
          in: query
          description: Filter by probe mode.
          schema:
            type: string
            enum: [cached, fresh, strict]
        - name: q
          in: query
          description: Partial match on the gateway or probed device name/alias.
          schema: { type: string }
      responses:
        "200":
          description: Page of firmware packages, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwarePage"
        "503":
          description: Firmware repository disabled (object storage not configured).
    post:
      tags: [ota]
      summary: Upload a firmware package (streamed multipart)
      description: |
        Streams one artifact into object storage without buffering it whole.
        The request is multipart/form-data; the metadata text parts
        (`version`, optional `filename`, `profile_id`, `content_type`,
        `is_stable`) MUST precede the `file` part. The server computes size
        and the lowercase sha256 digest while streaming and rejects empty or
        over-size uploads. A package bound to a profile must belong to the
        tenant; `(tenant, profile, version)` is unique. Requires
        `device:write`.
      operationId: uploadFirmware
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FirmwareUpload"
      responses:
        "201":
          description: Package stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwarePackage"
        "409":
          description: Duplicate (tenant, profile, version).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "413":
          description: Package exceeds the configured size cap.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/tenants/{tenantId}/firmware/{firmwareId}:
    get:
      tags: [ota]
      summary: Get one firmware package
      operationId: getFirmware
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: firmwareId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Package metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwarePackage"
        "404":
          $ref: '#/components/responses/Error'
    delete:
      tags: [ota]
      summary: Delete one firmware package and its backing object
      description: >
        Removes the package metadata and the object-store blob. A package
        referenced by any OTA task cannot be deleted (409); it must be
        removed from task history first. Requires `device:write`.
      operationId: deleteFirmware
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: firmwareId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Deleted.
        "404":
          $ref: '#/components/responses/Error'
        "409":
          description: Package is referenced by an OTA task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /v1/tenants/{tenantId}/firmware/{firmwareId}/stable:
    post:
      tags: [ota]
      summary: Mark or unmark a recommended stable version
      operationId: setFirmwareStable
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: firmwareId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: stable
          in: query
          required: false
          schema: { type: boolean, default: true }
          description: Any value other than `false` marks the package stable.
      responses:
        "200":
          description: Updated package.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwarePackage"
        "404":
          $ref: '#/components/responses/Error'

  /v1/tenants/{tenantId}/firmware/{firmwareId}/download:
    get:
      tags: [ota]
      summary: Get an operator presigned download URL
      description: >
        Returns a short-lived presigned URL for browser/operator download.
        Devices never use this; they download through the authenticated
        `/v1/me/ota/{task_id}/package` relay.
      operationId: presignFirmware
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: firmwareId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Presigned URL descriptor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmwarePresignedDownload"
        "404":
          $ref: '#/components/responses/Error'

  /v1/tenants/{tenantId}/stats/system:
    get:
      tags: [statistics]
      summary: Read the infrastructure snapshot
      description: |
        Returns a point-in-time snapshot of Go runtime, PostgreSQL,
        NATS/JetStream stream and consumer backlog, and the embedded MQTT
        broker client count.
      operationId: getSystemStats
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: System snapshot.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemSnapshot"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/stats/business:
    get:
      tags: [statistics]
      summary: Read the tenant business report
      operationId: getBusinessStats
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: range
          in: query
          schema:
            type: string
            enum: [1h, 24h, 7d]
            default: 24h
      responses:
        "200":
          description: Aggregated business report.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessReport"
        "500":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/rule-nodes/{nodeId}/debug:
    get:
      tags: [rules]
      summary: Read node debug captures
      description: Returns recent in/out captures for a node with debug enabled.
      operationId: getNodeDebug
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: nodeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Recent captures, newest last.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NodeCapture"
    post:
      tags: [rules]
      summary: Toggle node debug capture
      operationId: setNodeDebug
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Debug state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }

  /v1/tenants/{tenantId}/rule-chains/dry-run:
    post:
      tags: [rules]
      summary: Single-chain test delivery
      description: |
        Runs one constructed message with side effects suppressed and returns
        the per-node trace. When graph is present, that unsaved graph is
        compiled for this request; otherwise the tenant's active chain is
        tested.
      operationId: dryRunRuleChain
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data: { type: object, additionalProperties: true }
                metadata: { type: object, additionalProperties: true }
                graph:
                  $ref: "#/components/schemas/RuleGraphWrite"
      responses:
        "200":
          description: Non-destructive execution trace.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainTrace"

  /v1/tenants/{tenantId}/rule-chains/trace:
    get:
      tags: [rules]
      summary: Read full-chain traces
      operationId: getChainTraces
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: chain_id
          in: query
          schema: { type: string, format: uuid }
        - name: trace_id
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Recent traces.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChainTrace"
    post:
      tags: [rules]
      summary: Toggle full-chain tracing
      operationId: setChainTrace
      parameters:
        - name: tenantId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: chain_id
          in: query
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Trace state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled: { type: boolean }

  /v1/me/telemetry:
    post:
      tags: [device-ingest]
      summary: Submit a telemetry frame
      description: |
        Accepts one JSON object whose keys are measurement identifiers.
        One telemetry Envelope is published per numeric key. The device is
        authenticated with its device access token.
      operationId: postMyTelemetry
      security:
        - DeviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceTelemetryFrame'
            examples:
              environment:
                value:
                  temperature: 21.5
                  humidity: 62.1
      responses:
        "200":
          description: Frame accepted and published.
          content:
            application/json:
              schema:
                type: object
                required: [published]
                properties:
                  published:
                    type: integer
                    description: Number of measurement Envelopes published.
                    example: 2
        "400":
          description: Frame rejected (malformed JSON or unknown measurements).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "413":
          description: Telemetry frame exceeds the accepted body size.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/me/blob:
    post:
      tags: [device-ingest]
      summary: Upload one media object and publish its reference
      description: |
        Streams the binary request body into blob storage and publishes one
        telemetry point whose string value is `blob://<key>` (BlobRef). The
        stored object key is generated by the server. The measurement key is
        selected with the `key` query parameter (default `blob`) and may
        contain only letters, digits, `_`, `.` and `-`. Requires device
        authentication and blob storage to be enabled.
      operationId: postMyBlob
      security:
        - DeviceToken: []
      parameters:
        - name: key
          in: query
          required: false
          description: Measurement key for the published telemetry point.
          schema:
            type: string
            default: blob
            pattern: '^[A-Za-z0-9_.-]{1,128}$'
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "202":
          description: Object stored and telemetry reference published.
          content:
            application/json:
              schema:
                type: object
                required: [published, key, uri, size]
                properties:
                  published:
                    type: integer
                    example: 1
                  key:
                    type: string
                    example: media/tenant-a/dev-1/8f3c...
                  uri:
                    type: string
                    description: Telemetry value stored (v_string).
                    example: blob://media/tenant-a/dev-1/8f3c...
                  size:
                    type: integer
                    format: int64
                    example: 48213
        "400":
          description: Invalid measurement key or object could not be stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "413":
          description: Media object exceeds blob.media_max_bytes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "415":
          description: Content type rejected by blob.media_allowed_types.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "503":
          description: Blob storage is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      tags: [device-ingest]
      summary: Download one of the device's own media objects
      description: |
        Serves a media object identified by `key`. The key must be a
        `media/<tenant>/<device>/<object>` key owned by the authenticated
        device; other devices' objects return 403. Supports HTTP Range,
        ETag and conditional requests.
      operationId: getMyBlob
      security:
        - DeviceToken: []
      parameters:
        - name: key
          in: query
          required: true
          schema:
            type: string
          example: media/tenant-a/dev-1/8f3c...
      responses:
        "200":
          description: Object bytes.
          headers:
            Content-Type:
              schema:
                type: string
              example: image/jpeg
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "403":
          description: Object key is not owned by this device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: Object no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "503":
          description: Blob storage is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/me/commands:
    get:
      tags: [device-ingest]
      summary: Long-poll for the next command
      description: |
        Returns one queued command or holds the request open until a command
        arrives or the long-poll window elapses. The device polls
        continuously; an empty response (command is null) triggers the next
        poll.
      operationId: getMyCommands
      security:
        - DeviceToken: []
      responses:
        "200":
          description: One command or an empty poll result.
          content:
            application/json:
              schema:
                type: object
                required: [command]
                properties:
                  command:
                    oneOf:
                      - $ref: '#/components/schemas/DeviceCommandFrame'
                      - type: 'null'
              examples:
                command:
                  value:
                    command:
                      id: e16f236e-a6af-4b38-9a8f-bcf4b045a343
                      name: set-led
                      params:
                        color: green
                idle:
                  value:
                    command: null
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/me/cmdres/{command}:
    post:
      tags: [device-ingest]
      summary: Submit a command response
      description: |
        Correlates a device response with its pending request-response
        command. The raw JSON body is recorded as the command result.
      operationId: postMyCommandResponse
      security:
        - DeviceToken: []
      parameters:
        - name: command
          in: path
          required: true
          description: Command identifier.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Arbitrary JSON result document.
            examples:
              ack:
                value:
                  ok: true
                  received: set-led
      responses:
        "204":
          description: Response accepted.
        "400":
          description: Malformed response body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/me/ota/tasks:
    get:
      tags: [device-ingest]
      summary: List the caller's open firmware assignments
      description: |
        Pull-model endpoint for directly connected devices (ADR-0006b).
        Returns open platform-hosted firmware jobs targeting the caller,
        newest first. Each entry carries the relative authenticated
        `url` (`/v1/me/ota/{task_id}/package`), target version, sha256 and
        size. Gateway sub-devices are instead pushed through
        `v1/gateway/ota/task`.
      operationId: listMyOtaTasks
      security:
        - DeviceToken: []
      responses:
        "200":
          description: Open assignments.
          content:
            application/json:
              schema:
                type: object
                required: [assignments]
                properties:
                  assignments:
                    type: array
                    items:
                      $ref: "#/components/schemas/MyOtaAssignment"
        "401":
          $ref: '#/components/responses/Error'
        "503":
          description: OTA disabled (object storage not configured).

  /v1/me/ota/{taskId}/package:
    get:
      tags: [device-ingest]
      summary: Download a platform-hosted firmware package (authorized relay)
      description: |
        Streams the package bytes from object storage through NL; the edge
        never sees S3 credentials. Authorization is re-checked on every
        request: the caller must be the target device (direct) or the gateway
        responsible for a target (gateway), the task must be active, and it
        must be platform-hosted. Supports a single byte `Range` for resume
        (`206` + `Content-Range`); `X-Firmware-Sha256` carries the digest.
      operationId: downloadMyOtaPackage
      security:
        - DeviceToken: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          required: false
          schema: { type: string, example: "bytes=0-1048575" }
      responses:
        "200":
          description: Full package stream.
          headers:
            X-Firmware-Sha256:
              schema: { type: string }
            Accept-Ranges:
              schema: { type: string, example: bytes }
            Content-Length:
              schema: { type: integer, format: int64 }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "206":
          description: Partial content for the requested byte range.
          headers:
            Content-Range:
              schema: { type: string, example: "bytes 0-1048575/2097152" }
            X-Firmware-Sha256:
              schema: { type: string }
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: '#/components/responses/Error'
        "403":
          description: Caller is not a target, or the task is not active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: Task not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: Task uses an external package URL (not platform-hosted).
        "416":
          description: Unsupported or unsatisfiable Range.

  /v1/me/ota/{taskId}/progress:
    post:
      tags: [device-ingest]
      summary: Report per-device firmware progress
      description: |
        Records one progress frame for the caller on a task. Non-terminal
        states (downloading/downloaded/updating) are forward-only; succeeded
        writes back the target version to the device's `firmware_version`,
        failed terminates the item. Aggregate task state is recomputed and
        pushed on the `ota_task` WebSocket resource.
      operationId: reportMyOtaProgress
      security:
        - DeviceToken: []
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MyOtaProgress"
      responses:
        "204":
          description: Progress recorded.
        "400":
          description: Malformed body or unknown state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          $ref: '#/components/responses/Error'
        "503":
          description: OTA disabled.

  /v1/auth/bootstrap-status:
    get:
      tags: [auth]
      summary: Check whether first-run administrator setup is required
      description: >
        Public endpoint. On a fresh deployment the migration creates the
        platform administrator admin@nereidai.local with an empty password.
        While `required` is true the SPA must show the first-run setup screen
        instead of the login form. It reveals only that setup is pending and
        the fixed admin email.
      operationId: getBootstrapStatus
      security: []
      responses:
        "200":
          description: First-run state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapStatus'
              examples:
                required:
                  summary: Setup pending
                  value:
                    required: true
                    email: admin@nereidai.local
                done:
                  summary: Already configured
                  value:
                    required: false
  /v1/auth/bootstrap:
    post:
      tags: [auth]
      summary: Set the first administrator password (first run)
      description: >
        Public, single-use endpoint. Sets the bootstrap administrator password
        while it is still unset, clears the must-change flag and returns a
        token pair so the new administrator is logged straight in. Once the
        password is set it fails with 409 BOOTSTRAP_COMPLETE; use the normal
        password-reset flow afterwards.
      operationId: completeBootstrap
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapRequest'
            examples:
              bootstrap:
                summary: Set password
                value:
                  password: FirstRunStrongPass123
      responses:
        "201":
          description: Password set and session issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        "400":
          description: Password does not meet the policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: First-run setup is already complete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                complete:
                  summary: Already configured
                  value:
                    error:
                      code: BOOTSTRAP_COMPLETE
                      message: first-run setup is already complete
  /v1/auth/captcha:
    get:
      tags: [auth]
      summary: Get a one-time arithmetic login challenge
      description: >
        Issues a simple arithmetic captcha (operands within 10, using
        addition, subtraction, multiplication and even division). The
        returned id and the user's integer answer must both be sent to
        POST /v1/auth/login. Each challenge is single-use and expires after
        10 minutes; it is a lightweight anti-automation gate, not a
        cryptographic boundary.
      operationId: getCaptcha
      security: []
      responses:
        "200":
          description: Arithmetic challenge issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaptchaChallenge'
              examples:
                challenge:
                  summary: Challenge
                  value:
                    captcha_id: 1b9d6bcdbbfd4b2d9b3d6b4f5f4f5f10
                    expression: "7 + 2 = ?"
  /v1/auth/oidc/status:
    get:
      tags: [auth]
      summary: Report whether external OIDC single sign-on is enabled
      description: >
        Public. Returns {enabled: true} when an external OpenID Connect
        provider is configured, so the login UI can show the "Sign in with
        SSO" button. No token is required.
      operationId: getOIDCStatus
      security: []
      responses:
        "200":
          description: OIDC availability.
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: { type: boolean }
  /v1/auth/oidc/login:
    get:
      tags: [auth]
      summary: Start OIDC authorization-code + PKCE login
      description: >
        Public browser entry point (302 redirect, not a JSON API). Builds the
        PKCE verifier/challenge, a nonce and an opaque state, stores them
        server-side, and redirects the browser to the external IdP
        authorization endpoint. The IdP later redirects back to
        GET /v1/auth/oidc/callback. Optional query parameter redirect_to is
        an internal SPA path to land on after login.
      operationId: oidcLogin
      security: []
      parameters:
        - in: query
          name: redirect_to
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the external IdP authorization endpoint.
          headers:
            Location:
              schema: { type: string, format: uri }
        "404":
          description: OIDC is not configured.
  /v1/auth/oidc/callback:
    get:
      tags: [auth]
      summary: Complete OIDC login and return to the SPA
      description: >
        Public redirect target registered at the IdP. Exchanges the
        authorization code (with the PKCE verifier), verifies the id token
        signature via the IdP JWKS and its issuer/audience/nonce, JIT
        provisions the user (empty password) and maps an IdP group to a
        built-in role, then mints a normal local session token pair. The
        browser is 302-redirected to the SPA /auth/callback with the
        TokenPair in the URL fragment (#session=...), which is never sent to
        a server. An IdP error, invalid/expired state, missing email claim or
        unmapped role redirects to /login?oidc_error=<code>.
      operationId: oidcCallback
      security: []
      parameters:
        - in: query
          name: code
          required: false
          schema: { type: string }
        - in: query
          name: state
          required: false
          schema: { type: string }
        - in: query
          name: error
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Redirect into the SPA with the session fragment or an error.
          headers:
            Location:
              schema: { type: string, format: uri }
        "404":
          description: OIDC is not configured.
  /v1/auth/sso/status:
    get:
      tags: [auth]
      summary: Check if NS ticket SSO is enabled
      description: >
        Reports whether the NereidSphere one-time handoff ticket SSO is
        configured. The SPA uses this to show the "Login with NS" button.
      operationId: ssoStatus
      security: []
      responses:
        "200":
          description: SSO status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:
                    type: boolean
  /auth/ns-callback:
    get:
      tags: [auth]
      summary: Receive NS handoff ticket and establish local session
      description: >
        Public redirect target registered in NS as the product's
        sso_callback_path (default `/auth/ns-callback`; the exact path is
        deployment-configured). The browser arrives here with
        `?ticket=<id>&to=<path>` after logging into NS. The backend exchanges
        the ticket server-to-server at
        `POST {NS}/api/v1/auth/ticket/verify` using its shared secret
        (`X-NS-Client-Id` + `X-NS-Client-Secret`). On success, JIT-provisions
        the user and materialises local tenant memberships from the ticket
        identity groups (`/nereidlink/{tenant_uuid}/{admins|engineers|read_only}`,
        multi-tenant; group-less tickets fall back to the realm-role map into
        `sso.tenant_id`). Suite-managed roles removed upstream are reconciled
        away on the next login (never touching CUSTOMER_USER memberships or
        platform admins). A local session TokenPair is then minted and the
        browser is 302-redirected to the SPA /auth/callback with it in the
        URL fragment (#session=...). Failures redirect to
        /login?sso_error=<code>.
      operationId: ssoTicketCallback
      security: []
      parameters:
        - in: query
          name: ticket
          required: false
          schema: { type: string }
        - in: query
          name: to
          required: false
          schema: { type: string }
      responses:
        "302":
          description: Redirect into the SPA with the session fragment or an error.
          headers:
            Location:
              schema: { type: string, format: uri }
        "404":
          description: NS ticket SSO is not configured.
  /v1/integration/ns/tenants:
    get:
      tags: [integration]
      summary: Tenant picker for the NereidSphere suite admin console
      description: >
        Consumed through the NS reverse proxy (`GET /p/link/v1/integration/ns/tenants`),
        which strips any inbound identity headers and injects the verified
        caller identity plus the product's integration secret. The product
        origin is also directly reachable, so the shared secret is mandatory:
        requests without a constant-time-matching `X-NS-Integration-Secret`
        are rejected 401 regardless of any `X-User-*` headers, and callers
        without the suite `admin` role in `X-User-Roles` (comma-joined) are
        rejected 403. Returns a bare JSON array of ACTIVE tenants as
        `{tenant_id, tenant_name}`. Read-only.
      operationId: nsIntegrationTenants
      security: []
      parameters:
        - in: header
          name: X-NS-Integration-Secret
          required: true
          schema: { type: string }
          description: The product sso_secret, stamped by the NS gateway on this path only.
        - in: header
          name: X-User-Roles
          required: false
          schema: { type: string }
          description: Comma-joined suite roles; must include the exact value `admin`.
        - in: header
          name: X-User-Id
          required: false
          schema: { type: string }
        - in: header
          name: X-User-Email
          required: false
          schema: { type: string }
      responses:
        "200":
          description: ACTIVE tenants.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [tenant_id, tenant_name]
                  properties:
                    tenant_id: { type: string, format: uuid }
                    tenant_name: { type: string }
        "401":
          description: Missing or invalid integration secret.
        "403":
          description: Authenticated NS caller without the suite admin role.
        "404":
          description: NS integration is not configured.
  /v1/auth/login:
    post:
      tags: [auth]
      summary: Authenticate with email and password
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          description: Token pair issued, or MFA challenge required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
              examples:
                tokenPair:
                  summary: Token pair
                  value:
                    pair:
                      access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                      refresh_token: j0yc_-o4pJQEfFZbfigo8hTL3QbFsPGpOJicvTdWwXc
                      token_type: Bearer
                      expires_in: 1800
                mfaRequired:
                  summary: MFA challenge
                  value:
                    mfa:
                      challenge_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9
                      expires_in: 300
        "401":
          description: Captcha invalid/expired, or incorrect email and password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                captchaInvalid:
                  summary: Captcha rejected
                  value:
                    error:
                      code: CAPTCHA_INVALID
                      message: captcha is invalid or expired
        "403":
          description: User disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: Administrator password has not been set (first-run setup pending).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                passwordNotSet:
                  summary: Setup pending
                  value:
                    error:
                      code: PASSWORD_NOT_SET
                      message: administrator password has not been set; complete first-run setup
        "429":
          description: Account locked after repeated failures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/auth/api-keys:
    get:
      tags: [auth]
      summary: List the caller's user API keys
      operationId: listOwnAPIKeys
      description: Prefix-only management view; full key material is never returned.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Caller's API keys.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKey'
        "401": { description: Unauthorized }
        "403": { description: Interactive user session required }
    post:
      tags: [auth]
      summary: Create a user API key
      operationId: createOwnAPIKey
      description: >-
        Creates a long-lived X-Api-Key credential for the authenticated human
        user. Empty scopes inherit the owner's live role permissions; explicit
        scopes must be a subset of the owner's current permission points. The
        plaintext key is returned exactly once.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        "201":
          description: Key created; one-time plaintext returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedAPIKey'
        "400": { description: Invalid name, expiry or scope }
        "401": { description: Unauthorized }
        "403": { description: Scope not held by owner, or interactive session required }

  /v1/auth/api-keys/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [auth]
      summary: Get one of the caller's API keys
      operationId: getOwnAPIKey
      security:
        - BearerAuth: []
      responses:
        "200":
          description: API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        "404": { description: Not found }
    delete:
      tags: [auth]
      summary: Hard-delete one of the caller's API keys
      operationId: deleteOwnAPIKey
      description: The row is removed; append-only audit events retain the key id and prefix.
      security:
        - BearerAuth: []
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }

  /v1/auth/api-keys/{key}/rotate:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [auth]
      summary: Rotate a user API key
      operationId: rotateOwnAPIKey
      description: >-
        Replaces the credential and its lookup prefix; the new plaintext is
        returned exactly once. An empty body keeps the current expiry.
        Revoked or already expired keys cannot be rotated, and a supplied
        expiry must be in the future.
      security:
        - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                expires_at: { type: string, format: date-time }
      responses:
        "200":
          description: Rotated; one-time plaintext returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotatedAPIKey'
        "400": { description: Revoked/expired key, or past replacement expiry }
        "404": { description: Not found }

  /v1/auth/api-keys/{key}/revoke:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [auth]
      summary: Soft-revoke one of the caller's API keys
      operationId: revokeOwnAPIKey
      description: Sets revoked=true and retains the row and audit history.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Revoked key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        "404": { description: Not found }

  /v1/tenants/{tenant}/api-keys:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
    get:
      tags: [auth]
      summary: List all user API keys in a tenant
      operationId: listTenantAPIKeys
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Tenant API keys.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKey'
        "403": { description: Requires external-access:read }

  /v1/tenants/{tenant}/api-keys/{key}:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - name: key
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [auth]
      summary: Get a tenant API key
      operationId: getTenantAPIKey
      security:
        - BearerAuth: []
      responses:
        "200":
          description: API key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        "403": { description: Requires external-access:read }
        "404": { description: Not found }
    delete:
      tags: [auth]
      summary: Hard-delete a tenant API key
      operationId: deleteTenantAPIKey
      security:
        - BearerAuth: []
      responses:
        "204": { description: Deleted }
        "403": { description: Requires external-access:write }
        "404": { description: Not found }

  /v1/tenants/{tenant}/api-keys/{key}/revoke:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - name: key
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [auth]
      summary: Soft-revoke a tenant API key
      operationId: revokeTenantAPIKey
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Revoked key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIKey'
        "403": { description: Requires external-access:write }
        "404": { description: Not found }

  /v1/auth/token:
    post:
      tags: [auth]
      summary: OAuth2 machine token (client_credentials)
      operationId: issueToken
      description: >-
        Exchanges a service-account client_id/client_secret for a short-lived
        machine access token (ADR-0021). No refresh token is issued; present
        the secret again when the token expires. Credentials are accepted as
        JSON, application/x-www-form-urlencoded, or HTTP Basic auth
        (`base64(client_id:client_secret)`). Only grant_type
        `client_credentials` is supported. Repeated failures for one client id are temporarily locked (HTTP 429)
        regardless of source address, matching per-account login lockout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      security:
        - ClientCredentials: []
      responses:
        "200":
          description: Machine access token issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineTokenResponse'
        "400":
          description: Unsupported grant type or missing parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        "401":
          description: Invalid client credentials (unknown client or bad secret).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        "403":
          description: Service account disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        "415":
          description: Unsupported content type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'
        "429":
          description: Credential endpoint temporarily locked after repeated failures.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthError'

  /v1/tenants/{tenant}/blob/sign:
    get:
      tags: [telemetry]
      summary: Resolve a media blob reference into a signed download URL
      description: |
        Used by console telemetry views for values shaped `blob://<key>`.
        The key must be a media object (`media/<tenant>/<device>/<object>`)
        scoped to the tenant in the path. Returns a short-lived presigned
        S3 URL or, for the local blob backend, an HMAC-signed
        `/v1/blobs/get` URL. Requires `device:read`.
      operationId: signTenantMediaBlob
      security:
        - BearerAuth: []
        - APIKeyAuth: []
      parameters:
        - name: tenant
          in: path
          required: true
          schema:
            type: string
        - name: key
          in: query
          required: true
          description: Blob object key (without the blob:// scheme).
          schema:
            type: string
          example: media/tenant-a/dev-1/8f3c...
      responses:
        "200":
          description: Signed URL and object metadata.
          content:
            application/json:
              schema:
                type: object
                required: [url, size, content_type]
                properties:
                  url:
                    type: string
                    format: uri
                  size:
                    type: integer
                    format: int64
                    example: 48213
                  content_type:
                    type: string
                    example: image/jpeg
        "400":
          description: Key is not a media object in this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: Object no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "503":
          description: Blob storage is not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/tenants/{tenant}/service-accounts:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
    get:
      tags: [auth]
      summary: List tenant service accounts
      operationId: listServiceAccounts
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Service accounts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceAccount'
        "401": { description: Unauthorized }
        "403": { description: Requires serviceaccount:read (tenant administrator). }
    post:
      tags: [auth]
      summary: Create a service account
      operationId: createServiceAccount
      description: >-
        Returns the plaintext client_secret exactly once; only its argon2id
        hash is stored. Machine scopes are ADR-0022 permission points;
        service-account administration points may never be assigned to a
        machine, even via the '*' wildcard.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceAccountRequest'
      responses:
        "201":
          description: Account created; one-time credentials returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedServiceAccount'
        "400": { description: Invalid name or scope }
        "403": { description: Requires serviceaccount:write (tenant administrator). }
        "401": { description: Unauthorized }

  /v1/tenants/{tenant}/service-accounts/{account}:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - name: account
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [auth]
      summary: Get a service account
      operationId: getServiceAccount
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Service account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccount'
        "404": { description: Not found }
        "403": { description: Requires serviceaccount:read }
    patch:
      tags: [auth]
      summary: Update service-account name or scopes
      operationId: updateServiceAccount
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceAccountRequest'
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccount'
        "400": { description: Invalid name or scope }
        "403": { description: Requires serviceaccount:write }
        "404": { description: Not found }
    delete:
      tags: [auth]
      summary: Delete a service account and its secrets
      operationId: deleteServiceAccount
      security:
        - BearerAuth: []
      responses:
        "204": { description: Deleted }
        "403": { description: Requires serviceaccount:write }
        "404": { description: Not found }

  /v1/tenants/{tenant}/service-accounts/{account}/enabled:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - name: account
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [auth]
      summary: Enable or disable a service account
      operationId: setServiceAccountEnabled
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceAccount'
        "403": { description: Requires serviceaccount:write }
        "404": { description: Not found }

  /v1/tenants/{tenant}/service-accounts/{account}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/TenantPath'
      - name: account
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [auth]
      summary: Overlap-rotate the client secret
      operationId: rotateServiceAccountSecret
      description: >-
        The old PRIMARY secret is demoted to ROTATING and stays valid until
        the next rotation, allowing zero-downtime secret deployment. The new
        plaintext secret is returned exactly once.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Rotated; new one-time secret returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RotatedServiceAccountSecret'
        "403": { description: Requires serviceaccount:write }
        "404": { description: Not found }

  /v1/auth/mfa/verify:
    post:
      tags: [auth]
      summary: Complete an MFA challenge
      operationId: verifyMFA
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MFAVerifyRequest'
      responses:
        "200":
          description: Second factor verified; token pair issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        "401":
          description: Invalid challenge token or second factor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/auth/mfa/status:
    get:
      tags: [auth]
      summary: Get MFA enrollment status
      operationId: mfaStatus
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user MFA status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MFAStatus'

  /v1/auth/mfa/totp/setup:
    post:
      tags: [auth]
      summary: Start TOTP enrollment
      operationId: startTOTP
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Pending TOTP enrollment created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TOTPEnrollment'

  /v1/auth/mfa/totp/confirm:
    post:
      tags: [auth]
      summary: Confirm and activate TOTP enrollment
      operationId: confirmTOTP
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TOTPConfirmRequest'
      responses:
        "201":
          description: TOTP activated; one-time recovery codes returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodeSet'
        "400":
          description: Invalid TOTP code or no pending enrollment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/auth/mfa/totp:
    delete:
      tags: [auth]
      summary: Disable TOTP enrollment
      operationId: disableTOTP
      security:
        - BearerAuth: []
      responses:
        "204":
          description: TOTP disabled and recovery codes deleted.

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate a refresh token
      operationId: refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        "200":
          description: New token pair; the presented session is revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        "401":
          description: Unknown, expired or already rotated token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the current session
      operationId: logout
      security:
        - BearerAuth: []
      responses:
        "204":
          description: Session revoked.

  /v1/auth/sessions:
    get:
      tags: [auth]
      summary: List the caller's active login sessions
      description: >-
        Returns the caller's currently usable refresh sessions (not
        revoked and inside their TTL), newest first. The session backing
        the presented access token is marked `current: true`. Only the
        non-sensitive id/IP/user-agent/timestamps are exposed; the
        refresh-token hash never leaves the service.
      operationId: listSessions
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Active sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionInfo'
        "401":
          $ref: '#/components/responses/Error'

  /v1/auth/sessions/{sessionId}:
    delete:
      tags: [auth]
      summary: Revoke one of the caller's sessions
      description: >-
        Revokes a single session owned by the caller. Revocation is
        effective immediately: the still-signed access token bound to
        that session is rejected on the next request or WebSocket
        handshake, without waiting for its short TTL. Revoking a session
        owned by another user returns 404.
      operationId: revokeSession
      security:
        - BearerAuth: []
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Session revoked; `current` is true when the presented token's own session was revoked.
          content:
            application/json:
              schema:
                type: object
                required: [id, current]
                properties:
                  id: { type: string, format: uuid }
                  current: { type: boolean }
        "401":
          $ref: '#/components/responses/Error'
        "404":
          description: Session not found or owned by another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/auth/me:
    get:
      tags: [auth]
      summary: Get the authenticated user
      operationId: currentUser
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUser'
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/audit:
    get:
      tags: [audit]
      summary: List audit events
      description: Returns cross-tenant audit events newest first. Requires platform administration.
      operationId: listAuditEvents
      security:
        - DeviceToken: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum:
              - AUTH_LOGIN
              - AUTH_LOGIN_FAILED
              - AUTH_LOGOUT
              - CONFIG_CHANGE
              - COMMAND_DISPATCH
              - CREDENTIAL_MANAGE
              - PERMISSION_CHANGE
              - HIGH_RISK_OPERATION
              - TENANT_LIFECYCLE
        - name: tenant
          in: query
          schema:
            type: string
            format: uuid
        - name: actor
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Audit event page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        "400":
          description: Invalid timestamp or paging parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: Caller is not a platform administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "503":
          description: Audit service is not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/audit/verify:
    post:
      tags: [audit]
      summary: Verify the audit hash chain
      description: Recomputes every event hash and checks completed daily seals.
      operationId: verifyAuditChain
      security:
        - DeviceToken: []
      responses:
        "200":
          description: Verification result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditVerifyResult'
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: Caller is not a platform administrator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "503":
          description: Audit service is not enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/platform/license:
    get:
      tags: [licenses]
      summary: Get deployment license status
      description: |
        Returns the installed deployment-scope license and its effective gate
        state. Platform super administrator only.
      operationId: getPlatformLicense
      security:
        - DeviceToken: []
      responses:
        "200":
          description: Deployment license status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploymentLicense'
        "401":
          description: Missing or invalid access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: Platform administration required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      tags: [licenses]
      summary: Install or replace the deployment license
      description: |
        Accepts a signed deployment license envelope (the same JSON file used
        by `nereidlink license install`), verifies its Ed25519 signature with
        the configured vendor public key and atomically replaces the current
        deployment license. A tenant-scope envelope is rejected. Platform
        super administrator only.
      operationId: installPlatformLicense
      security:
        - DeviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseEnvelope'
      responses:
        "200":
          description: License installed; returns refreshed status.
          content:
            application/json:
              schema:
