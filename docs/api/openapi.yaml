  /v1/tenants/{tenantId}/gateways/{gatewayId}/connectors:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: gatewayId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [connectors]
      summary: List connector instances for a gateway
      operationId: listConnectors
      responses:
        "200":
          description: Connector instances, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConnectorInstance" }
        "403":
          $ref: "#/components/responses/Error"
    post:
      tags: [connectors]
      summary: Create a desired connector instance
      description: >-
        Creates the desired spec at revision 1, pushes it to the connected
        gateway and re-sends it on every later hello. Target must be a
        gateway device owned by the tenant. Requires connector:write.
      operationId: createConnector
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectorWrite" }
      responses:
        "201":
          description: Created connector instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorInstance" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/gateways/{gatewayId}/connectors/{specId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: gatewayId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: specId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [connectors]
      summary: Get one connector instance
      operationId: getConnector
      responses:
        "200":
          description: Connector instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorInstance" }
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [connectors]
      summary: Replace the desired connector spec
      description: >-
        Overwrites desired fields, increments revision and resets reported
        state to PENDING for re-application.
      operationId: updateConnector
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectorWrite" }
      responses:
        "200":
          description: Updated connector instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorInstance" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [connectors]
      summary: Delete a connector instance
      description: >-
        Atomically removes desired state and commits a durable, revisioned
        delete tombstone, then attempts dispatch. Post-hello and background
        replay preserve offline deletion. 204 is not an edge delete ACK.
      operationId: deleteConnector
      responses:
        "204":
          description: Desired deletion and durable delete intent committed; edge removal is not acknowledged.
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/gateways/{gatewayId}/connectors-reconcile:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: gatewayId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [connectors]
      summary: Read-only connector reconcile view
      description: >-
        Computes the current desired-vs-applied classification for one
        gateway on demand from the last connector manifest watermark. It is
        strictly read-only: it accepts no manifest, raises/clears no alarm
        and never converges in strict mode, so a console may poll it. A
        gateway that has never reported a connector manifest returns a null
        watermark with every spec left unclassified (in_sync/missing/stale/
        drifted/extra all empty). Requires connector:read.
      operationId: getConnectorReconcile
      responses:
        "200":
          description: Desired-vs-applied connector classification.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorReconcileView" }
        "403":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/gateways/{gatewayId}/secret-bindings:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: gatewayId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [edge-secrets]
      summary: List secret delivery bindings for a gateway
      description: >-
        Returns active (non-removed) bindings. A binding never carries
        plaintext over REST. Requires edge_secret:read.
      operationId: listSecretBindings
      responses:
        "200":
          description: Bindings.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SecretBinding" }
        "403":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/gateways/{gatewayId}/secret-bindings/{secretName}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: gatewayId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: secretName
        in: path
        required: true
        schema: { type: string }
    put:
      tags: [edge-secrets]
      summary: Deliver or update a secret binding
      description: >-
        Declares the named typed-document secret should be present on this
        gateway with the supplied selectors (generic [{kind,value}]; the
        platform never interprets them), bumps revision and pushes the full
        desired set. Recorded even when the gateway firmware has not
        negotiated the secrets feature; delivery then waits for an upgrade.
        Requires edge_secret:write.
      operationId: deliverSecret
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecretBindingWrite" }
      responses:
        "200":
          description: Binding.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecretBinding" }
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      tags: [edge-secrets]
      summary: Withdraw a secret binding
      description: >-
        Moves the binding to REMOVING; the gateway erases its copy on the
        next sync and the row reaches REMOVED. The vault original stays.
        Requires edge_secret:write.
      operationId: withdrawSecret
      responses:
        "204": { description: Withdrawal requested. }
        "404":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/gateways/{gatewayId}/models:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: gatewayId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [connectors]
      summary: List a gateway's edge model inventory
      description: >-
        Returns the models the gateway last reported in its full-replacement
        manifest models segment (ADR-0039), with state, failure reason,
        labels, active binding count and the lease-stale marker. An empty
        inventory is an empty array, never null. Read-only; reuses the
        connector:read permission. Only READY, non-stale models should be
        offered for an edge-inference binding.
      operationId: listGatewayModels
      responses:
        "200":
          description: Gateway model inventory.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GatewayModel" }
        "403":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/gateways/{gatewayId}/profile-deliveries:
