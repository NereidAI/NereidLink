      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [customers]
      summary: Transfer a device to another customer/group
      description: Device identity and time series are preserved. Credential reset and alarm policy are explicit.
      operationId: transferDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "200":
          description: Transferred device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "409":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/{deviceId}/decommission:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [customers]
      summary: Decommission a device
      description: Deletes credentials, ends the live session and opens a recall window (default 90d).
      operationId: decommissionDevice
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                recall:
                  type: string
                  description: Go duration recall window; default 2160h.
      responses:
        "200":
          description: Decommissioned device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "409":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/{deviceId}/reactivate:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [customers]
      summary: Reactivate a decommissioned device
      description: Allowed only inside the recall window. New credentials must be issued separately.
      operationId: reactivateDevice
      responses:
        "200":
          description: Reactivated device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "409":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/{deviceId}/quarantine:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [customers]
      summary: Quarantine a device (platform administrator)
      description: |
        Incident-response action: the device moves to QUARANTINED, its
        live session ends and its credentials can no longer open
        connections. Identity, ownership and time series are preserved.
        The state is lifted by a direct release call (platform
        administrator, note required, audit + alarm) or an ADR-0023
        quarantine.release dual-control order.
      operationId: quarantineDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason_code]
              properties:
                reason_code:
                  type: string
                  enum: [credential-compromise, device-stolen, burst-flood, firmware-anomaly, other]
                  description: Structured incident code.
                note:
                  type: string
                  description: Free-text detail; required when reason_code is other.
      responses:
        "200":
          description: Quarantined device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/{deviceId}/quarantine/release:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [customers]
      summary: Release a quarantined device (platform administrator)
      description: |
        Returns a QUARANTINED device to ACTIVE. Credentials are not
        revoked by quarantine, so the device reconnects with its existing
        identity. A note is required for audit.
      operationId: releaseFromQuarantine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  description: Why the incident is resolved.
      responses:
        "200":
          description: Released device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/quarantine-reasons:
    get:
      tags: [customers]
      summary: List accepted quarantine reason codes
      description: Returns the vocabulary of structured reason codes the operator may pick when quarantining a device.
      operationId: listQuarantineReasons
      responses:
        "200":
          description: Reason code vocabulary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  reason_codes:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                        note_required:
                          type: boolean
                  note_required:
                    type: array
                    items:
                      type: string
                  description: Codes that require a free-text note.

  /v1/tenants/{tenantId}/devices/bulk-decommission:
    post:
      tags: [devices]
      summary: Decommission multiple devices at once
      description: |
        Applies the non-destructive decommission transition to each
        selected device. Credentials are disabled (not deleted) and the
        recall window starts. Devices that cannot be decommissioned are
        reported in the skipped array rather than failing the whole batch.
      operationId: bulkDecommissionDevices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_ids]
              properties:
                device_ids:
                  type: array
                  items:
                    type: string
                    format: uuid
                  maxItems: 200
                recall_days:
                  type: integer
                  minimum: 1
                  description: Override the default 90-day recall window.
      responses:
        "200":
          description: Bulk decommission result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  decommissioned:
                    type: integer
                    description: Number of devices successfully decommissioned.
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        device_id:
                          type: string
                          format: uuid
                        reason:
                          type: string

  /v1/tenants/{tenantId}/devices/bulk-import:
    post:
      tags: [devices]
      summary: Import many devices from a CSV upload
      description: |
        Creates devices from the uploaded CSV. The body is the raw CSV
        text (not JSON) so a file upload or a script can pipe the file
        directly. Each row is processed independently; failures are
        reported with their line number.
      operationId: bulkImportDevices
      requestBody:
        required: true
        content:
          text/csv:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Import result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  created:
                    type: integer
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        line:
                          type: integer
                        canonical_name:
                          type: string
                        reason:
                          type: string
        "400":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/bulk-import/template:
    get:
      tags: [devices]
      summary: Download the device import template
      description: |
        Returns a fillable template with the correct column headers,
        an example row, and (for XLSX) a validated state dropdown and
        an instructions sheet. The format is chosen by the query string.
      operationId: downloadBulkImportTemplate
      parameters:
        - name: format
          in: query
          schema:
            type: string
            enum: [xlsx, csv]
            default: xlsx
      responses:
        "200":
          description: Template file.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/bulk-import/preview:
    post:
      tags: [devices]
      summary: Validate and preview a device import without writing
      description: |
        Parses the uploaded CSV/XLSX and validates format and every row
        against the same rules creation uses, but persists nothing.
        Returns each parsed row with a valid flag so the console can
        render a preview before the operator confirms the import.
      operationId: previewBulkImportDevices
      requestBody:
        $ref: "#/components/requestBodies/ImportFile"
      responses:
        "200":
          description: Validation and preview result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "400":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/profiles/bulk-import:
    post:
      tags: [profiles]
      summary: Import many device profiles from a CSV upload
      description: |
        Creates profiles from the uploaded CSV. Accepted columns are
        `name` (required) and `rule_chain_group_id` (optional). Each row
        is processed independently; failures are reported with line.
      operationId: bulkImportProfiles
      requestBody:
        $ref: "#/components/requestBodies/ImportFile"
      responses:
        "200":
          description: Import result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  created: { type: integer }
                  failed:
                    type: array
                    items:
                      type: object
                      properties:
                        line: { type: integer }
                        name: { type: string }
                        reason: { type: string }
        "400":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/profiles/bulk-import/preview:
    post:
      tags: [profiles]
      summary: Validate and preview a profile import without writing
      operationId: previewBulkImportProfiles
      requestBody:
        $ref: "#/components/requestBodies/ImportFile"
      responses:
        "200":
          description: Validation and preview result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPreview"
        "400":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/profiles/bulk-import/template:
    get:
      tags: [profiles]
      summary: Download the profile import template
      operationId: downloadProfileImportTemplate
      responses:
        "200":
          description: CSV template file.
          content:
            text/csv:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/profiles/import:
    post:
      tags: [profiles]
      summary: Import one device profile from a pasted neutral or EdgeX document
      description: |
        Creates a source=import library profile from a pasted document. The
        document may be the vendor-neutral NL shape
        (`{name, protocol?, points[]{name,type,...address}}`) or an EdgeX
        DeviceProfile (`deviceResources[]`). Structural problems are a 400;
        non-fatal notices (unknown type degraded to string, duplicate/blank
        point skipped) are returned in `warnings`.
      operationId: importProfileDocument
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileImportRequest"
      responses:
        "201":
          description: Imported.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImportResult"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/profiles/import/preview:
    post:
      tags: [profiles]
      summary: Parse and preview a pasted profile document without writing
      operationId: previewProfileDocument
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileImportRequest"
      responses:
        "200":
          description: Parse result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImportResult"
