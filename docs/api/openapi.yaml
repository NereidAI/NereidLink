          description: Updated member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMember'
        "400":
          description: Empty or unsupported role set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: Member not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: Platform administrator account is protected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /v1/tenants/{tenantId}/members/{userId}/data-scope:
    post:
      tags: [members]
      summary: Replace the data scope of one member
      description: |
        Changes which devices the member may reach. The scope and its anchor
        are replaced together: a narrowing without its anchor, or a leftover
        anchor on a TENANT scope, is rejected. The anchor is verified to
        belong to the tenant, so a scope can never be pointed at another
        tenant's customer or group.

        This is a permission change, not a profile edit: widening a member
        from CUSTOMER or GROUP to TENANT grants reach over every device in
        the tenant. Both the previous and the new scope are recorded in the
        audit log.
      operationId: setMemberDataScope
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberDataScopeRequest'
      responses:
        "200":
          description: Updated member.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantMember'
        "400":
          description: |
            Unsupported scope (including SELF, which cannot be honored), a
            missing anchor for CUSTOMER/GROUP, or an anchor that does not
            exist in the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: Member not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: Caller is neither a platform administrator nor a TENANT_ADMIN of this tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

