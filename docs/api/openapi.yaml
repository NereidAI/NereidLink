        password makes the server generate one, returned in the response.
      operationId: resetMemberPassword
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberPasswordRequest'
      responses:
        "200":
          description: New plaintext password (shown once).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPasswordResponse'
        "400":
          description: Password violates policy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: Member not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

