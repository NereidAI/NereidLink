        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [customers]
      summary: Issue a single-use claim token
      description: Only UNCLAIMED devices can issue tokens. The plaintext token is returned once; only its hash is stored.
      operationId: issueClaimToken
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ttl:
                  type: string
                  description: Go duration token lifetime; default 24h.
      responses:
        "201":
          description: Issued claim token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimTokenResult"
        "409":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/{deviceId}/claim:
    parameters:
      - $ref: "#/components/parameters/TenantId"
      - name: deviceId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [customers]
      summary: Claim a device
      description: Consumes the single-use token and moves the UNCLAIMED device to ACTIVE under the chosen customer/group.
      operationId: claimDevice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimRequest"
      responses:
        "200":
          description: Claimed device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "409":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/{deviceId}/transfer:
    parameters:
