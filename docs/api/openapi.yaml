  /v1/tenants/{tenantId}/devices:
    get:
      tags: [devices]
      summary: List devices
      operationId: listDevices
      description: >-
        Returns one page of devices ordered by created_at descending (newest
        first), ties broken by canonical name. The `type` query filters by the
        derived console kind, not a stored column.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: search
          in: query
          description: Case-insensitive substring match on canonical name.
          schema: { type: string }
        - name: profile_id
          in: query
          schema: { type: string, format: uuid }
        - name: state
          in: query
          description: >-
            Lifecycle state filter. Omitted keeps the default visible set
            (UNCLAIMED, ACTIVE, QUARANTINED; decommissioned rows hidden).
            Pass `ALL` to include every lifecycle state, including
            decommissioned tombstones.
          schema:
            type: string
            enum: [ALL, UNCLAIMED, ACTIVE, DECOMMISSIONED, ARCHIVED, QUARANTINED]
        - name: gateway
          in: query
          description: When true, only gateway devices are returned (used by the sub-device binding picker).
          schema: { type: boolean }
        - name: managed_by
          in: query
          description: Sub-devices bound to this gateway id (used by the gateway's managed-devices view).
          schema: { type: string, format: uuid }
        - name: type
          in: query
          description: >-
            Filter by derived device kind: `gateway` (is_gateway),
            `subdevice` (non-gateway bound to a gateway) or `device`
            (standalone, non-gateway and unbound). Empty/absent returns all.
          schema:
            type: string
            enum: [gateway, subdevice, device]
        - name: connection
          in: query
          description: >-
            Filter by live connection state derived from the latest
            `ts_presence` boundary: `online`, `offline`, or `unknown`
            (no boundary ever recorded). Empty/absent returns any
            connection state. Independent of the lifecycle `state` filter.
          schema:
            type: string
            enum: [online, offline, unknown]
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Paged tenant devices.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/PaginationEnvelope"
                  - type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: "#/components/schemas/Device"
    post:
      tags: [devices]
      summary: Create a device
      operationId: createDevice
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceWrite"
      responses:
        "201":
          description: Created device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"

  /v1/tenants/{tenantId}/devices/{deviceId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
