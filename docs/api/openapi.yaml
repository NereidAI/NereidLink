      operationId: listMembers
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        "200":
          description: Every member of the tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantMember'
