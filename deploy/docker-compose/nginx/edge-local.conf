# Loopback-only development edge for local compose trials without a host
# nginx. It reproduces the production path split (see nginx/nereidlink.conf
# for the standalone TLS edge) on plain HTTP so the browser talks to one
# origin: backend prefixes go to the nereidlink service, everything else
# to the static frontend nginx. Mounted by docker-compose.local.yml.example;
# do not use it as a public-facing edge (no TLS, loopback publish only).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # REST API, the single WebSocket, Swagger UI, metrics, health probes and
    # the NS SSO browser callback.
    location ~ ^/(v1|ws|api|metrics|healthz|auth)(/|$) {
        proxy_pass http://nereidlink:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA index, hashed assets and client-side routes; history-mode fallback
    # and asset 404 semantics live in the frontend image's nginx.conf.
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
