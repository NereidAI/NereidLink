# NereidLink HTTPS reverse proxy for the jonasal/nginx-certbot image.
#
# This file is mounted at /etc/nginx/user_conf.d and symlinked into conf.d by
# the image's entrypoint. The image's built-in port-80 server already serves
# /.well-known/acme-challenge and redirects everything else to HTTPS, so only
# the 443 server is defined here.
#
# The certbot bootstrap script derives the certificate name ("nereidlink")
# from the ssl_certificate_key path below and the domain list from the
# server_name line. Before the real Let's Encrypt certificate exists it
# installs a temporary self-signed placeholder at these paths so nginx boots;
# nginx is reloaded automatically once issuance completes.

# Translate the Upgrade request header into the Connection token the upstream
# needs. WebSocket (/ws) and ordinary HTTP share the same location.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name nereidlink.example.com;

    ssl_certificate         /etc/letsencrypt/live/nereidlink/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/nereidlink/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/nereidlink/chain.pem;

    # Backend prefixes: REST API, the single WebSocket, Swagger UI, metrics,
    # health probes and the NS SSO browser callback. Regex wins over the
    # prefix location below. WebSocket (/ws) needs the upgrade headers and
    # long timeouts; ordinary HTTP shares the same block.
    location ~ ^/(v1|ws|api|metrics|healthz|auth)(/|$) {
        proxy_pass http://nereidlink:8080;
        proxy_http_version 1.1;

        # Preserve a non-default public port (for example :10443). The
        # WebSocket same-origin check compares Host with Origin; $host drops
        # that port and makes a valid same-origin upgrade fail with HTTP 403.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade handling; long-lived WS frames must not be killed
        # by the default 60s proxy read timeout.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Everything else is the SPA and its hashed assets, served by the
    # static frontend nginx container.
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
