# Static-only nginx configuration for the NereidLink web image.
#
# This server never proxies to the backend: API/WebSocket traffic is split
# at the Ingress/edge, so every request reaching here is a browser asset or
# a client-side SPA route. PID and temp paths live under /tmp so the same
# configuration also works when the container is forced to run as a
# non-root uid (the image default keeps the upstream nginx entrypoint).

user nginx;
worker_processes auto;

pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/javascript application/json
               application/xml+rss image/svg+xml;

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Vite fingerprints every build asset, so hashed files are immutable
        # for the life of the deployment. A missing hashed file is a real
        # 404, never an HTML fallback under an asset URL.
        location ^~ /assets/ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri =404;
        }

        # Any other path carrying a file extension targets a concrete static
        # file (favicon, robots.txt, ...); a missing one returns 404 instead
        # of silently serving index.html, matching the former Go embed
        # handler's asset-vs-route distinction.
        location ~ \.[A-Za-z0-9]+$ {
            try_files $uri =404;
        }

        # Extensionless paths are client-side routes: history-mode fallback
        # to index.html so the React router owns the render. The document is
        # revalidated on every navigation so a rolling web deployment cannot
        # pin a browser to a stale index.
        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
