{{- /*
Copyright (C) 2026 YIQISOFT
SPDX-License-Identifier: Apache-2.0

Optional image pull secret for sites whose registry projects are private.
Created in the target namespace so the chart is self-contained (the shared
nereidforge-system copy is not assumed to exist here). Renders nothing while
registryCredentials.username is empty; set create=false to reuse an
identically named secret already present in a shared namespace. The
registry hostname comes from an untracked -f value, never from a committed
default (treaty §18).
*/ -}}
{{- if and .Values.registryCredentials.create .Values.registryCredentials.username }}
{{- $cred := .Values.registryCredentials }}
apiVersion: v1
kind: Secret
metadata:
  name: harbor-registry-secret
  labels:
{{ include "nereidlink.labels" . | indent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ dict "auths" (dict $cred.registry (dict "username" $cred.username "password" $cred.password "email" $cred.email "auth" (printf "%s:%s" $cred.username $cred.password | b64enc))) | toJson | quote }}
{{- end }}
