{{- /*
Copyright (C) 2026 YIQISOFT
SPDX-License-Identifier: Apache-2.0

Bundled NATS with JetStream for the self-contained Kubernetes deployment.
nats.replicas=1 runs a standalone server (single-node topology, R1). A count
of 3 (or 5) forms a clustered JetStream Raft group: every pod has a
node-local RWO PVC (never NFS), cluster routes use the headless Service and
pods prefer different nodes. The ordinary client Service in front stays the
same in both modes.
*/ -}}
{{- if .Values.nats.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nereidlink.fullname" . }}-nats
  labels:
{{ include "nereidlink.labels" . | indent 4 }}
    app.kubernetes.io/component: nats
spec:
  selector:
    app.kubernetes.io/name: {{ include "nereidlink.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: nats
  ports:
    - name: tcp-client
      port: 4222
      targetPort: 4222
    - name: tcp-monitor
      port: 8222
      targetPort: 8222
---
{{- if gt (int .Values.nats.replicas) 1 }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nereidlink.fullname" . }}-nats-headless
  labels:
{{ include "nereidlink.labels" . | indent 4 }}
    app.kubernetes.io/component: nats
spec:
  clusterIP: None
  # Members must resolve each other BEFORE Raft quorum makes them ready;
  # headless services otherwise publish only ready pods, a boot deadlock.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: {{ include "nereidlink.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: nats
  ports:
    - name: tcp-client
      port: 4222
      targetPort: 4222
    - name: tcp-cluster
      port: 6222
      targetPort: 6222
    - name: tcp-monitor
      port: 8222
      targetPort: 8222
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nereidlink.fullname" . }}-nats-config
  labels:
{{ include "nereidlink.labels" . | indent 4 }}
    app.kubernetes.io/component: nats
data:
  nats.conf: |
    # JetStream clustering requires a stable unique server name per pod.
    server_name: $POD_NAME
    listen: 0.0.0.0:4222
    http: 0.0.0.0:8222
    jetstream {
      store_dir: "/data/jetstream"
    }
    cluster {
      name: {{ include "nereidlink.fullname" . }}-nats
      listen: 0.0.0.0:6222
      routes = [
{{- $service := include "nereidlink.fullname" . }}
{{- $namespace := .Release.Namespace }}
{{- $namespace := .Release.Namespace }}
{{- range $i, $_ := until (int .Values.nats.replicas) }}
        "nats://{{ $service }}-nats-{{ $i }}.{{ $service }}-nats-headless.{{ $namespace }}.svc.cluster.local:6222",
{{- end }}
      ]
    }
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "nereidlink.fullname" . }}-nats
  labels:
{{ include "nereidlink.labels" . | indent 4 }}
    app.kubernetes.io/component: nats
spec:
  {{- if gt (int .Values.nats.replicas) 1 }}
  serviceName: {{ include "nereidlink.fullname" . }}-nats-headless
  {{- else }}
  serviceName: {{ include "nereidlink.fullname" . }}-nats
  {{- end }}
  replicas: {{ .Values.nats.replicas }}
  {{- if gt (int .Values.nats.replicas) 1 }}
  # Parallel: a JetStream cluster member's /healthz stays unready until
  # the Raft quorum forms, so OrderedReady (default) would deadlock before
  # pod-1/-2 are ever created.
  podManagementPolicy: Parallel
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "nereidlink.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "nereidlink.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: nats
    spec:
      imagePullSecrets:
{{ toYaml .Values.imagePullSecrets | indent 8 }}
      securityContext:
        fsGroup: 1000
      {{- if gt (int .Values.nats.replicas) 1 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
{{ include "nereidlink.selectorLabels" . | indent 20 }}
                    app.kubernetes.io/component: nats
                topologyKey: kubernetes.io/hostname
      {{- end }}
      containers:
        - name: nats
          image: {{ include "nereidlink.depImage" (dict "registry" .Values.nats.image.registry "repository" .Values.nats.image.repository "tag" .Values.nats.image.tag) }}
          imagePullPolicy: {{ .Values.nats.image.pullPolicy }}
          {{- if gt (int .Values.nats.replicas) 1 }}
          args: ["-c", "/etc/nats/nats.conf"]
          env:
            # Referenced as $POD_NAME by nats.conf for the JetStream
            # server_name (must be unique and stable per cluster member).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          {{- else }}
          # -js enables JetStream; -sd points it at the persistent dir;
          # -m exposes the health/monitor port used by the probe.
          args: ["-js", "-sd=/data", "-m", "8222"]
          {{- end }}
          ports:
            - name: tcp-client
              containerPort: 4222
            {{- if gt (int .Values.nats.replicas) 1 }}
            - name: tcp-cluster
              containerPort: 6222
            {{- end }}
            - name: http-monitor
              containerPort: 8222
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8222
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if gt (int .Values.nats.replicas) 1 }}
            - name: config
              mountPath: /etc/nats
              readOnly: true
            {{- end }}
          resources:
{{ toYaml .Values.nats.resources | indent 12 }}
      {{- if gt (int .Values.nats.replicas) 1 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "nereidlink.fullname" . }}-nats-config
      {{- end }}
      nodeSelector:
{{ toYaml .Values.nodeSelector | indent 8 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.nats.storageClass }}
        resources:
          requests:
            storage: {{ .Values.nats.size }}
{{- end }}
