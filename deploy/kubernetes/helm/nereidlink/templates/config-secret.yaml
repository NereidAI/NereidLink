{{- /*
Copyright (C) 2026 YIQISOFT
SPDX-License-Identifier: Apache-2.0

Secret overlay merged ON TOP of the ConfigMap base at startup
(90-secret.yaml sorts after 10-base.yaml). Only credentials live here;
everything tunable without a secret stays in config-configmap.yaml.
*/ -}}
{{- if eq .Values.postgresql.mode "external" -}}
{{- required "postgresql.externalDSN is required when postgresql.mode=external" .Values.postgresql.externalDSN -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nereidlink.fullname" . }}-config-secret
  labels:
{{ include "nereidlink.labels" . | indent 4 }}
type: Opaque
stringData:
  90-secret.yaml: |
    postgres:
      dsn: {{ include "nereidlink.pgDSN" . | quote }}

    identity:
      jwt_secret: {{ .Values.auth.jwtSecret | quote }}
    blob:
      access_key: {{ required "blob.accessKey is required" .Values.blob.accessKey | quote }}
      secret_key: {{ required "blob.secretKey is required" .Values.blob.secretKey | quote }}
{{- if .Values.oidc.enabled }}
    oidc:
      client_secret: {{ required "oidc.clientSecret is required when oidc.enabled" .Values.oidc.clientSecret | quote }}
{{- end }}
{{- if .Values.sso.enabled }}
    sso:
      sso_secret: {{ required "sso.ssoSecret is required when sso.enabled" .Values.sso.ssoSecret | quote }}
{{- end }}
{{- if .Values.horizon.enabled }}
    horizon:
      api_key: {{ required "horizon.apiKey is required when horizon.enabled" .Values.horizon.apiKey | quote }}
{{- end }}
