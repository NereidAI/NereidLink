# Prometheus configuration for NereidLink monitoring.
#
# Run example:
#   prometheus --config.file=prometheus.yml
#
# When Prometheus runs in Docker and the platform runs on the host,
# host.docker.internal resolves to the host (add --add-host=host.docker.internal:host-gateway
# on Linux). Otherwise replace it with the platform address.

global:
  scrape_interval: 10s
  evaluation_interval: 30s

scrape_configs:
  - job_name: nereidlink
    metrics_path: /metrics
    static_configs:
      - targets:
          - 'host.docker.internal:8080'
