# Hardened NATS configuration for southbound modules. All clients stay in
# the CORE account (so they can publish into the core JetStream streams),
# but every module gets a user whose permissions are limited to:
#
#   publish:   telemetry subjects, presence KV and events, command events
#   subscribe: only its own command dispatch subject
#
# The generic _INBOX allowance is required for JetStream KV request-reply
# and NATS responses; inbox subjects carry unguessable multi-part tokens.
# Replace the shared passwords with operator-managed secrets or switch the
# module users to NKEY credentials for production. The ingress IDs below
# must match the values used when provisioning the modules.

accounts {
    CORE {
        users = [
            {
                user: core
                password: core
            }
            {
                user: coap
                password: coap
                permissions {
                    publish = [
                        "nl.telemetry.>",
                        "nl.presence.>",
                        "$KV.>",
                        "nl.command.events.>",
                        "_INBOX.>"
                    ]
                    subscribe = [
                        "nl.command.dispatch.ingress-coap-1",
                        "_INBOX.>"
                    ]
                }
            }
            {
                user: snmp
                password: snmp
                permissions {
                    publish = [
                        "nl.telemetry.>",
                        "nl.presence.>",
                        "$KV.>",
                        "nl.command.events.>",
                        "_INBOX.>"
                    ]
                    subscribe = [
                        "nl.command.dispatch.ingress-snmp-1",
                        "_INBOX.>"
                    ]
                }
            }
            {
                user: lwm2m
                password: lwm2m
                permissions {
                    publish = [
                        "nl.telemetry.>",
                        "nl.presence.>",
                        "$KV.>",
                        "nl.command.events.>",
                        "_INBOX.>"
                    ]
                    subscribe = [
                        "nl.command.dispatch.ingress-lwm2m-1",
                        "_INBOX.>"
                    ]
                }
            }
        ]
    }
}
