# Rolling dev channel (root treaty §19). Every push to main publishes the
# 0.0.0-dev floating tag and an immutable 0.0.0-dev-<sha> tag to GHCR for
# each split image via the organization reusable workflow. Pull requests
# deliberately do not trigger this, so forks cannot publish into the
# organization namespace. Formal releases remain tag-only through
# release.yml. Each caller passes the same gha cache-scope as its ci.yml
# warm job and release.yml caller, byte-for-byte.
name: Publish Dev Images

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prep:
    name: Derive image build metadata
    runs-on: ubuntu-latest
    outputs:
      build_date: ${{ steps.meta.outputs.build_date }}
    steps:
      - id: meta
        run: echo "build_date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  publish-dev-backend:
    name: Build and publish backend dev image
    needs: prep
    uses: NereidAI/.github/.github/workflows/publish-dev-image.yml@v1
    with:
      image-name: nereidlink-backend
      file: deploy/images/backend/Dockerfile
      cache-scope: nereidlink-backend
      build-args: |
        GIT_SHA=${{ github.sha }}
        BUILD_DATE=${{ needs.prep.outputs.build_date }}

  publish-dev-frontend:
    name: Build and publish frontend dev image
    needs: prep
    uses: NereidAI/.github/.github/workflows/publish-dev-image.yml@v1
    with:
      image-name: nereidlink-frontend
      file: deploy/images/frontend/Dockerfile
      cache-scope: nereidlink-frontend
      build-args: |
        GIT_SHA=${{ github.sha }}
        BUILD_DATE=${{ needs.prep.outputs.build_date }}
